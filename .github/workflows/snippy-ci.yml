name: Snippy pre-commit and post-push
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Nix
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl --proto '=https' --tlsv1.2 -L https://releases.nixos.org/nix/nix-2.35.2/install | sh -s -- --no-daemon
          export USER=$(whoami)
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          echo "$HOME/.nix-profile/bin" >> $GITHUB_PATH
          echo "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            cmake
            libunwind
            lld
            llvm
            third-party
      - name: Prepare ccache
        id: prepare_ccache
        run: |
          echo "timestamp=$(TZ=UTC date "+%Y-%m-%d-T%H:%M:%S")" >> $GITHUB_OUTPUT
          CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
          mkdir -p "$CCACHE_DIR"
          nixpkgs=$(nix-instantiate --eval -E 'with import llvm/tools/llvm-snippy/nix/pins; "${nixpkgs}"' --read-write-mode --raw)
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> $GITHUB_ENV
          echo 'NIX_CONFIG<<EOF' >> $GITHUB_ENV
          echo "extra-sandbox-paths = /var/ccache=$CCACHE_DIR" >> $GITHUB_ENV
          echo "max-jobs = auto" >> $GITHUB_ENV
          echo "sandbox-fallback = false" >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
      - name: Set up ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ steps.prepare_ccache.outputs.timestamp }}
          restore-keys: ccache-${{ github.job }}-
      - name: Build
        run: |
          nix-build llvm/tools/llvm-snippy -A llvm-snippy -A llvm-snippy.doc --log-format bar-with-logs --arg withCCache true
          nix-build llvm/tools/llvm-snippy -A snippy-release-tarball --out-link result-release-tarball --log-format bar-with-logs --arg withCCache true
      - name: Upload html docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snippy-doc-html
          path: result-doc/html
      - name: Upload (pre)release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snippy-x86_64-linux
          path: result-release-tarball/snippy-x86_64-linux.tar.xz
      - name: Build Snippy manual
        run: |
          nix-build llvm/tools/llvm-snippy -A snippy-manual --out-link result-manual --log-format bar-with-logs --arg withCCache true
      - name: Upload Snippy manual artifacts (PDF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snippy-doc-pdf
          path: result-manual/snippy_guide.pdf
      - name: Upload github pages artifact
        if: github.event_name == 'push' && github.ref_name == 'main' && (github.repository_owner == 'syntacore' || github.repository_owner == 'LLVM-Snippy')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: result-doc/html
      - name: Show ccache statistics
        run: |
          nix-shell -p ccache --run "ccache -s"
          nix-shell -p ccache --run "ccache -z"
  deploy-pages:
    needs: [main]
    if: github.event_name == 'push' && github.ref_name == 'main' && (github.repository_owner == 'syntacore' || github.repository_owner == 'LLVM-Snippy')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
