# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike

# COM: This test checks that even with a sparse space of legal vector registers and
# COM: with segment loads/stores in histogram, only legal instructions are generated
# COM: (execution on the model reaches completion).

# RUN: llvm-snippy %s \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: +v
  num-instrs: 10000
  reserved-regs-list: [V2,V4,V5,V6,V11,V20]

riscv-vector-unit:
  mode-change-bias:
    P: 0.5
  mode-distribution:
    VM:
      - [all_ones, 2.0]
      - [any_legal, 1.0]
    VL:
      - [max_encodable, 2.0]
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
        sew_64: 1.0
      LMUL:
        m2: 1.0
        m1: 1.0
        mf4: 1.0
        mf8: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram: 
    - [VADD_VV, 1.0]
    - [VL1RE16_V, 1.0]
    - [VL1RE32_V, 1.0]
    - [VL1RE64_V, 1.0]
    - [VL1RE8_V, 1.0]
    - [VL2RE16_V, 1.0]
    - [VL2RE32_V, 1.0]
    - [VL2RE64_V, 1.0]
    - [VL2RE8_V, 1.0]
    - [VL4RE16_V, 1.0]
    - [VL4RE32_V, 1.0]
    - [VL4RE64_V, 1.0]
    - [VL4RE8_V, 1.0]
    - [VLOXEI16_V, 1.0]
    - [VLOXEI32_V, 1.0]
    - [VLOXSEG2EI8_V, 1.0]
