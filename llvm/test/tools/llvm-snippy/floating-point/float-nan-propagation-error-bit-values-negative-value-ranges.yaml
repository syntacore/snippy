# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: "+d"
  num-instrs: 10
fpu-config:
  overwrite:
    ieee-double:
      valuegram:
        - type: bitrange
          min: -1
          max: 0
histogram:
  - [FADD_D, 1.0]

# CHECK: float-nan-propagation-error-bit-values-negative-value-ranges.yaml:{{[0-9]+}}:{{[0-9]+}}: error: Value can't be negative
