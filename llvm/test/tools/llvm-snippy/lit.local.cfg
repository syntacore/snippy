import sys
import os

# FIXME: This script runs from lit's directory and so relative import can't find
# our lit_matrix_format.py file. This probably can be done differently
sys.path.insert(0, os.path.dirname(__file__))
from lit_matrix_format import MatrixShTest

from lit.llvm import llvm_config
from pathlib import Path

from lit.llvm.subst import ToolSubst
from lit.llvm.subst import FindTool


SnippyTool = ToolSubst(
    'llvm-snippy',
    command=FindTool('llvm-snippy'),
    unresolved='ignore',
    extra_args=['-Wno-error=non-reproducible-execution -o %t'])

config.substitutions.append(("%examples_path", config.llvm_src_root + "/tools/llvm-snippy/examples"))
config.substitutions.append(("%llvm_tools", str(config.llvm_tools_dir)))

match = SnippyTool.resolve(llvm_config, config.llvm_tools_dir)
if not match:
  config.unsupported = True
else:
  subst_key, tool_pipe, command = match
  config.substitutions.append((subst_key, tool_pipe + command))


config.available_features.add('riscv-rvv')

simulator_models = ['spike', 'whisper']
seeds_per_model = {}

def get_seeds_num(model_key):
    param_name = f'snippy-seeds-num-{model_key}' if model_key else 'snippy-seeds-num-None'
    # Seed counts are only meaningful for the full matrix run, in which
    # setup.py always sets an explicit value for every model. The default here
    # is only hit when some (but not all) of the params are provided.
    val = lit_config.params.get(param_name, '5')
    try:
        num = int(val)
        if num < 0:
            raise ValueError
    except ValueError:
        lit_config.error(f"Invalid {param_name}: '{val}'. Must be a non-negative integer.")
        num = 5
    return list(range(1, num + 1))

# For 'None' (and '' which is alias)
seeds_per_model['None'] = get_seeds_num('None')
seeds_per_model[''] = seeds_per_model['None']   # same seeds for skip-model-mixin

# For each simulator model
for model in simulator_models:
    seeds = get_seeds_num(model)
    if len(seeds) > 0:
        seeds_per_model[model] = seeds

# The full build/test harness (setup.py TestCommand) runs the test
# suite twice: a first smoke run with no seed params at all, and a second
# full run that explicitly sets -Dsnippy-seeds-num-*. When no seed param is
# present, collapse every test to a single (model, seed) configuration so the
# smoke run still exercises each test exactly once (typo/parse check) while
# staying fast.

all_params = [f'snippy-seeds-num-{m}' for m in ['None', 'spike', 'whisper']]
single_run = not any(
    param in lit_config.params
    for param in all_params
)
models_with_callbacks = ['spike', 'whisper']
config.test_format = MatrixShTest(
   seeds_per_model=seeds_per_model,
   models_with_callbacks=models_with_callbacks,
   single_run=single_run
)
