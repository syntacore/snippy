# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s
options:
  mtriple: riscv64
  num-instrs: 100

sections:
    - name:      1
      VMA:       0x10000
      SIZE:      0x20000
      LMA:       0x10000
      ACCESS:    rx
    - name:      2
      VMA:       0x40000
      SIZE:      0x10000
      LMA:       0x40000
      ACCESS:    rw
code-layout:
  ranges:
    - start: 0x10000
      size: 0x4000
      stride: 0x10
      first-offset: 0
      last-offset: 0
    - start: 0x20000
      size: 0x5000
      stride: 0xD
      first-offset: 0
      last-offset: 0
histogram:
    - [ADD, 3.0]
    - [BLT, 1.0]
branches:
  permutation: on
  alignment: 32
  loop-ratio: 0.5
  number-of-loop-iterations:
      min: 2
      max: 32
  max-depth:
    if: 500
    loop: 4
  distance:
    blocks:
      min: 1
      max: 20

# CHECK: error
# CHECK-SAME: Code layout feature is only supported with branches alignment set to 1 
