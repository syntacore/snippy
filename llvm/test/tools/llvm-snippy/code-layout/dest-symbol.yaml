# RUN: llvm-snippy %s -model-plugin None -o %t
# RUN: readelf -s --wide %t.elf | FileCheck %s

options:
  mtriple: riscv64
  enable-phdrs-definition: true
  num-instrs: 50

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x1000
      LMA:       0x100000
      ACCESS:    rx
      PHDR:      'header1'
    - name:      2
      VMA:       0x15000
      SIZE:      0x1000
      LMA:       0x15000
      ACCESS:    rx
      PHDR:      'header2'
    - name:      3
      VMA:       0x1000
      SIZE:      0x1000
      LMA:       0x1000
      ACCESS:    rw
      PHDR:      'header3'
    - name:      4
      VMA:       0x1000000
      SIZE:      0x1000
      LMA:       0x1000000
      ACCESS:    r
      PHDR:      'header3'

code-layout:
  ranges:
    - start: 0x100000
      size: 0x1000
      stride: 0x8
      first-offset: 0
      last-offset: 0
    - start: 0x15000
      size: 0x1000
      stride: 0x8
      first-offset: 0
      last-offset: 0
histogram:
    - [BLT, 1.0]

# CHECK-COUNT-50: .dest
