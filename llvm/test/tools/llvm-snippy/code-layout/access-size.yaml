# RUN: llvm-snippy %s -model-plugin None | FileCheck %s

options:
  mtriple: riscv64
  dump-bb-addresses: true
  num-instrs: 100

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x20000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x130000
      SIZE:      0x20000
      LMA:       0x130000
      ACCESS:    rx
    - name:      4
      VMA:       0x150000
      SIZE:      0x100
      LMA:       0x150000
      ACCESS:    rx
    - name:      3
      VMA:       0x200000
      SIZE:      0x100000
      LMA:       0x200000
      ACCESS:    rw
 

code-layout:
  ranges:
    - start: 0x100000
      size: 0x10000
      stride: 0x10
      first-offset: 0
      last-offset: 0
    - start: 0x130000
      size: 0x10000
      stride: 0x10
      first-offset: 0
      last-offset: 0
    - start: 0x150000
      size: 0x100
      stride: 0x1
      first-offset: 0
      last-offset: 0
      access-size: 2

histogram:
    - [ADD, 3.0]
    - [BLT, 1.0]

# CHECK-NOT:  0x150{{([[:xdigit:]]{3})}}
