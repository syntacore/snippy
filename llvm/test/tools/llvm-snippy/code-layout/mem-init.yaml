# RUN: llvm-snippy %s --model-plugin None -o %t
# RUN: llvm-readelf -S %t.elf | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100
  init-memory: runtime
  init-regs-in-elf: true

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x20000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x130000
      SIZE:      0x20000
      LMA:       0x130000
      ACCESS:    rx
    - name:      3
      VMA:       0x200000
      SIZE:      0x1000
      LMA:       0x200000
      ACCESS:    rw
 

code-layout:
  ranges:
    - start: 0x100000
      size: 0x10000
      stride: 0x10000
      first-offset: 0
      last-offset: 0xffff
    - start: 0x130000
      size: 0x10000
      stride: 0x10000
      first-offset: 0
      last-offset: 0xffff
histogram:
    - [ADD, 3.0]
    - [BLT, 1.0]

# CHECK: .snippy.1.rx
# CHECK-SAME: PROGBITS
# CHECK: .snippy.2.rx
# CHECK-SAME: PROGBITS
