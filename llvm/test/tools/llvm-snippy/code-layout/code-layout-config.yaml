# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  dump-layout: true

sections:
    - name:      1
      VMA:       0x1000
      SIZE:      0x2000
      LMA:       0x1000
      ACCESS:    rx
    - name:      2
      VMA:       0x4000
      SIZE:      0x1000
      LMA:       0x4000
      ACCESS:    rw
    - name:      3
      VMA:       0x3000
      SIZE:      0x100
      LMA:       0x3000
      ACCESS:    r
code-layout:
  ranges:
    - start: 0x1000
      size: 0x1500
      stride: 0x10
      first-offset: 0
      last-offset: 0

histogram:
    - [ADD, 1.0]
    - [BLT, 1.0]

# CHECK-NOT: unknown key
# CHECK: code-layout:
# CHECK-NEXT: ranges:
# CHECK-DAG: size: 0x1500
# CHECK-DAG: start: 0x1000
