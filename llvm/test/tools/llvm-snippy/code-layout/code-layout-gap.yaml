# RUN: llvm-snippy %s --model-plugin=None -o %t
# RUN: llvm-objdump -D -j .snippy.1.rx %t.elf | FileCheck %s
options:
  mtriple: riscv64
  num-instrs: 100

sections:
    - name:      1
      VMA:       0x10000
      SIZE:      0x20000
      LMA:       0x10000
      ACCESS:    rx
    - name:      2
      VMA:       0x40000
      SIZE:      0x10000
      LMA:       0x40000
      ACCESS:    rw
code-layout:
  ranges:
    - start: 0x10000
      size: 0x4000
      stride: 0x10
      first-offset: 0
      last-offset: 0
    - start: 0x20000
      size: 0x5000
      stride: 0x10
      first-offset: 0
      last-offset: 0
histogram:
    - [ADD, 3.0]
    - [BLT, 1.0]

# CHECK: 000000000000{{([[:xdigit:]]{4})}} <.LBB0_{{[[:digit:]]+}}>
# CHECK: ...
# CHECK: 000000000001{{([[:xdigit:]]{4})}} <.LBB0_{{[[:digit:]]+}}>
