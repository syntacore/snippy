# RUN: llvm-snippy %s

include:
  - ../../Inputs/memory-aligned.yaml

options:
  mtriple: riscv64
  verify-gen-plan: true
  num-instrs: 10
  init-regs-in-elf: true
  last-instr: RET
  mattr: -c

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80002000
    SIZE:      0x100000
    LMA:       0x80002000
    ACCESS:    rw

histogram:
    - [BEQ, 1.0]
    - [BNE, 1.0]
    - [BLT, 1.0]
    - [BLTU, 1.0]
    - [BGE, 1.0]
    - [BGEU, 1.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]

branches:
  max-depth:
    loop: 1
  distance:
    pc:
      min: 0
      max: 120
