# RUN: not llvm-snippy %s |& FileCheck %s --check-prefix=NOTWORK
# RUN: llvm-snippy %s -mattr=+f,+d \
# RUN: |& FileCheck %s --check-prefix=WORK

options:
  mtriple: riscv64

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [FCVT_W_D, 20.0]

# WORK-NOT: Illegal opcode for specified cpu: FCVT_W_D
# NOTWORK: Illegal opcode for specified cpu: FCVT_W_D
