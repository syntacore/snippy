# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 \
# RUN: -external-stack=true -redefine-sp=SP \
# RUN: -num-instrs=10 |& FileCheck %s --dump-input fail

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x800000
      SIZE:      0x400000
      LMA:       0x800000
      ACCESS:    rw
    - name:      stack
      VMA:       0x1500000
      SIZE:      0x100
      LMA:       0x1500000
      ACCESS:    rw

histogram:
    - [LD, 1.0]

# CHECK: warning: (inconsistent-options) Section 'stack' will not be used: external stack was enabled.
