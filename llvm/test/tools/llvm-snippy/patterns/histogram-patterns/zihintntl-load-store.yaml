# RUN: llvm-snippy %s -model-plugin=None -verify-mi \
# RUN: --define-main-histogram=LoadNTL | FileCheck %s --check-prefix=LOAD_NTL

# RUN: llvm-snippy %s -model-plugin=None -verify-mi \
# RUN: --define-main-histogram=StoreNTL | FileCheck %s --check-prefix=STORE_NTL

# RUN: llvm-snippy %s -model-plugin=None -verify-mi \
# RUN: --define-main-histogram=LoadStoreNTL | FileCheck %s --check-prefix=LOAD_STORE_NTL

options:
  mtriple: riscv64-linux-gnu 
  mattr: "+zihintntl"
  dump-mf: on
  num-instrs: 1000
  verify-gen-histogram: on
  histogram-must-succeed: on

include:
  - Inputs/sections.yaml

histogram-patterns:
    - LoadNTL: "(LD ^ 3) * NTL_ALL * (LW ^ 2) * NTL_P1"
    - StoreNTL: "(SD ^ 3) * NTL_ALL * (SW ^ 2) * NTL_P1"
    - LoadStoreNTL: "NTL_ALL * LD * NTL_P1 * SD * NTL_PALL * LD * NTL_S1 * LW"

# LOAD_NTL: LD
# LOAD_NTL-NEXT: LD
# LOAD_NTL-NEXT: LD
# LOAD_NTL-NEXT: NTL_ALL
# LOAD_NTL-NEXT: LW
# LOAD_NTL-NEXT: LW
# LOAD_NTL-NEXT: NTL_P1

# STORE_NTL: SD
# STORE_NTL-NEXT: SD
# STORE_NTL-NEXT: SD
# STORE_NTL-NEXT: NTL_ALL
# STORE_NTL-NEXT: SW
# STORE_NTL-NEXT: SW
# STORE_NTL-NEXT: NTL_P1

# LOAD_STORE_NTL: NTL_ALL
# LOAD_STORE_NTL-NEXT: LD
# LOAD_STORE_NTL-NEXT: NTL_P1
# LOAD_STORE_NTL-NEXT: SD
# LOAD_STORE_NTL-NEXT: NTL_PALL
# LOAD_STORE_NTL-NEXT: LD
# LOAD_STORE_NTL-NEXT: NTL_S1
# LOAD_STORE_NTL-NEXT: LW
