# RUN: llvm-snippy %s -model-plugin=None |& FileCheck %s

options:
  mtriple: riscv64 
  num-instrs: 5000
  dump-mf: on
  verify-gen-histogram: on
  histogram-must-succeed: on

include:
  - Inputs/sections.yaml

histogram-patterns:
    - ManyLoads: "LD ^ 50 * SW * XOR"
    - ManyStores: "SD ^ 50 * SLT"
    - LoadStoresRange: "(LB * SB ^ 3) ^ [15 : 20]"

histogram:
    - [pattern: ManyLoads, 1.0]
    - [pattern: ManyStores, 1.0]
    - [pattern: LoadStoresRange, 1.0]

