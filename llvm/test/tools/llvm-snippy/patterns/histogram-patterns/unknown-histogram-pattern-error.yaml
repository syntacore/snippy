# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

# RUN: not llvm-snippy %s -define-main-histogram=hist2 \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64 
  num-instrs: 10

include:
  - Inputs/sections.yaml

histogram-patterns:
  - hist1: "ADDI | LUI"

histogram:
    - [pattern: hist2, 2.0]

# CHECK: error: unknown pattern: 'hist2'
