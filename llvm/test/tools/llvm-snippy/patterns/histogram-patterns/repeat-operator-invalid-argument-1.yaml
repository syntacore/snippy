# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64 
  mattr: "+m"
  num-instrs: 15
  dump-mf: on

include:
  - Inputs/sections.yaml

histogram-patterns:
  - hist1: "MUL ^ 3"
  - hist2: "MUL ^ MUL"

histogram:
    - [pattern: hist1, 1.0]

# CHECK: error: invalid argument for '^' operation
# CHECK-NEXT: - hist2: "MUL ^ MUL"
