
# RUN: llvm-snippy %s -model-plugin=None -define-main-histogram=LoadSeq \
# RUN: |& FileCheck %s --check-prefixes=LOAD_SEQ

# RUN: llvm-snippy %s -model-plugin=None -define-main-histogram=StoreSeq \
# RUN: |& FileCheck %s --check-prefixes=STORE_SEQ

# RUN: llvm-snippy %s -model-plugin=None -define-main-histogram=LoadStoreSeq \
# RUN: |& FileCheck %s --check-prefixes=LOAD_STORE_SEQ

# RUN: llvm-snippy %s -model-plugin=None -define-main-histogram=LoadStoreWithOthers \
# RUN: |& FileCheck %s --check-prefixes=LOAD_STORE_WITH_OTHERS

include:
  - Inputs/load-store-config.yaml
  - Inputs/sections.yaml

options:
  mtriple: riscv64 
  mattr: "+m"
  num-instrs: 2000
  dump-mf: on
  verify-gen-histogram: on
  histogram-must-succeed: on

