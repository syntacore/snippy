# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - Inputs/sections.yaml

options:
  mtriple: riscv64 
  num-instrs: 15

histogram-patterns:
  - MissingBrace: "(OR | AND) * (SUB | SLT"

