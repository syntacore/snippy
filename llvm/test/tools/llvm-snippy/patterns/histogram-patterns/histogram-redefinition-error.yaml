# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64 
  num-instrs: 10

include:
  - Inputs/sections.yaml

histogram-patterns:
  - AddHist: "ADD ^ 5"
  - SubHist: "SUB ^ 5"
  - AddHist: "ADD | ADDI"

# CHECK: error: redefinition of 'AddHist'
# CHECK-NEXT: - AddHist: "ADD | ADDI"
