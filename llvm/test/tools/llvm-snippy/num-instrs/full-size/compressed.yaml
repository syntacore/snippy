# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s -dump-registers-yaml=%t
# RUN: FileCheck %s --input-file=%t 

options:
  mtriple: riscv64
  init-regs-in-elf: true
  num-instrs: all
  mattr: +c

sections:
    - name:      1
      VMA:       0x80000
      SIZE:      0x2000
      LMA:       0x80000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]

# COM: We expect that generation with no additional support instructions will be ended in this PC.
# COM: Note, that any change of init sequence or adding compressed instructions will change this PC.

# CHECK: PC, 0x0000000000081{{([[:xdigit:]]{3})}}
