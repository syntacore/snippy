# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64  \
# RUN: --init-regs-in-elf \
# RUN: -spilled-regs-list=X1,X10 \
# RUN: -num-instrs=all \
# RUN: -mattr=-c -dump-registers-yaml=%t
# RUN: FileCheck %s --input-file=%t

sections:
    - name:      1
      VMA:       0x80000
      SIZE:      0x2000
      LMA:       0x80000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw
    - name:      stack
      VMA:       0x80A00000
      SIZE:      0x100000
      LMA:       0x80A00000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [LD, 1.0]
    - [SW, 1.0]


# COM: We expect that generation with no additional support instructions will be ended in this PC.
# COM: Note, that any change of init sequence or adding compressed instructions will change this PC.

# CHECK: PC, 0x0000000000081F{{[D-F][0-9A-F]}}
