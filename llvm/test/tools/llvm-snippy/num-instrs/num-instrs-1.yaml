# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -c
  num-instrs: 1
  dump-mf: true

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADDI, 1.0]

# CHECK: ADDI
# CHECK-NEXT: EBREAK
