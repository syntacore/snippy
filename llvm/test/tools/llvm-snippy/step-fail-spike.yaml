# REQUIRES: riscv-snippy-model-spike

# RUN: not llvm-snippy %s \
# RUN:    -mtriple=riscv64 -num-instrs=1000  \
# RUN:    -init-regs-in-elf -mattr=+a \
# RUN: |& FileCheck %s --check-prefix=UNALIGNED
include:
- Inputs/unaligned-guarantee.yaml

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x5000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x260000
    SIZE:      0x1000
    LMA:       0x260000
    ACCESS:    r
  - name:      3
    VMA:       0x600000
    SIZE:      0x100
    LMA:       0x600000
    ACCESS:    rw

histogram:
    - [AMOADD_D, 1.0]

