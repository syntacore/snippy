# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s -mtriple=riscv64 -mattr=-a,+m -num-instrs=10 >& %t
# RUN: FileCheck --input-file=%t --dump-input always %s

sections:
    - name:      2
      VMA:       0x10000
      SIZE:      0x200
      LMA:       0x10000
      ACCESS:    rx
    - name:      2
      VMA:       0x10200
      SIZE:      0x200
      LMA:       0x10200
      ACCESS:    rw
    - name:      3
      VMA:       0x10400
      SIZE:      0x200
      LMA:       0x10400
      ACCESS:    rw

histogram:
    - [DIV, 1.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SW, 5.0]

