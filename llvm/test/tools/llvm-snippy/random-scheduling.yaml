# RUN: llvm-snippy %s \
# RUN:    -o %t_1 \
# RUN:    -initial-regs=%S/initialization/Inputs/initial_state_rv64i.yaml

# RUN: llvm-snippy %s \
# RUN:    -o %t_2 \
# RUN:    -random-scheduling \
# RUN:    -initial-regs=%S/initialization/Inputs/initial_state_rv64i.yaml

# RUN: llvm-snippy %s \
# RUN:    %S/Inputs/random-scheduling/basic.yaml \
# RUN:    -o %t_3 \
# RUN:    -initial-regs=%S/initialization/Inputs/initial_state_rv64i.yaml

# RUN: not diff -q %t_1.elf %t_2.elf
# RUN: not diff -q %t_1.elf %t_3.elf

options:
  num-instrs: 10000
  mtriple: riscv64
  mattr: -f,+a,+c,+m
  init-regs-in-elf: true
sections:
  - name: 1
    VMA: 0x100000
    SIZE: 0x1000000
    LMA: 0x100000
    ACCESS: rx
  - name: 2
    VMA: 0x1100000
    SIZE: 0x100000
    LMA: 0x1100000
    ACCESS: rw
branches:
  number-of-loop-iterations:
    min: 1
    max: 2
  max-depth:
    if: 3
    loop: 3
histogram:
  # branches
  - [BEQ, 3.7]
  - [BGE, 3.7]
  - [BGEU, 3.7]
  - [BLT, 3.7]
  - [BLTU, 3.7]
  - [BNE, 3.7]
  - [C_BEQZ, 3.7]
  - [C_BNEZ, 3.7]
  - [C_J, 3.7]
  # loads/stores ~ 2/3 instruction
  - [C_LD, 29]
  - [C_LW, 29]
  - [C_SD, 29]
  - [C_SW, 29]
  - [LB, 29]
  - [LBU, 29]
  - [LD, 29]
  - [LH, 29]
  - [LHU, 29]
  - [LR_D, 29]
  - [LR_D_AQ, 29]
