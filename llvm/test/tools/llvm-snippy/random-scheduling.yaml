  - [SB, 29]
  - [SC_D, 29]
  - [SC_D_RL, 29]
  - [SC_W, 29]
  - [SC_W_RL, 29]
  - [SD, 29]
  - [SH, 29]
  - [SW, 29]
  # other ~1/3 instructions, atomics 10 time less
