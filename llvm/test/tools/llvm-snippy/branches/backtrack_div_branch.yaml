# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+m \
# RUN:    -num-instrs=1000 -backtrack -dump-mf \
# RUN:    -initial-regs-yaml=%S/../initialization/Inputs/initial_state_zero.yaml \
# RUN: |& FileCheck %s

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [DIV, 1.0]
    - [XOR, 1.0]
    - [BLT, 1.0]

branches:
    max-depth:
        loop: 0

# CHECK: XOR
# CHECK-NOT: DIV

# CHECK: xor
# CHECK: blt

