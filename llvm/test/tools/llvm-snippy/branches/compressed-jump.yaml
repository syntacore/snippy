# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s
# RUN: llvm-snippy %s -init-regs-in-elf

options:
  mtriple: riscv64
  num-instrs: 100
  verify-mi: true
  mattr: +c

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [C_J, 1.0]
