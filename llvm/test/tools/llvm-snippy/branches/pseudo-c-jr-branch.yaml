# RUN: llvm-snippy -mtriple=riscv64 -mattr=+c \
# RUN:      -num-instrs=500 -verify-gen-histogram -model-plugin=None %s

sections:
    - name:      text
      VMA:       0x100000
      SIZE:      0x200000
      LMA:       0x100000
      ACCESS:    rx
    - name:      data
      VMA:       0x4000000
      SIZE:      0x20000
      LMA:       0x4000000
      ACCESS:    rw
    - name:      stack
      VMA:       0x5000000
      SIZE:      0x20000
      LMA:       0x5000000
      ACCESS:    rw

histogram:
    - [PseudoC_JRB, 1.0]
