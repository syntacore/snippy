# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 -num-instrs=100 \
# RUN:     -verify-mi -mattr=+c |& FileCheck %s
# RUN: llvm-snippy %s -mtriple=riscv64 -num-instrs=100 \
# RUN:     -verify-mi -mattr=+c -init-regs-in-elf |& \
# RUN:     FileCheck %s

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [C_J, 1.0]

# CHECK: c.j
