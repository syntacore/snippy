# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s -mtriple=riscv64 -num-instrs=20 \
# RUN:     -verify-mi -mattr=-c -dump-mf --verify-consecutive-loops -o %t \
# RUN:     |& FileCheck %s

sections:
    - name:      1
      VMA:       0x1000
      SIZE:      0x10000
      LMA:       0x1000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rw

histogram:
    - [BEQ, 1.0]

branches:
  consecutive-loops: 1 # CHECK:[[@LINE]]:3: error: Consecutive loop generation is not supported for nested loops
  loop-ratio: 1
