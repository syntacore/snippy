# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  num-instrs: 100
  verify-mi: true
  mattr: -c
  dump-mf: true
  verify-consecutive-loops: true
  init-cons-loop-in-prev-loop: true

sections:
    - name:      1
      VMA:       0x1000
      SIZE:      0x10000
      LMA:       0x1000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [BEQ, 1.0]
    - [BLT, 1.0]
    - [BLTU, 1.0]
    - [BGE, 1.0]
    - [BGEU, 1.0]
    - [BNE, 1.0]

branches:
  consecutive-loops: 1
  loop-ratio: 1
  max-depth:
    loop: 1
  distance:
    pc:
      max: 20
