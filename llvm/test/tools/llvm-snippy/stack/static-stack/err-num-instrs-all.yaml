# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: all
  enable-static-stack: on

include:
  - Inputs/sections-with-stack.yaml

# CHECK: error: Incompatible options: When -num-instrs=all is specified, option -enable-static-stack is not supported.
