# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  honor-target-abi: on
  enable-static-stack: on

include:
  - Inputs/sections-with-stack.yaml

# CHECK: error: Incompatible options: When --honor-target-abi is enabled, option -enable-static-stack is not supported.
