# COM: This test checks that caller-saved registers are spilled to stack before
#      call instruction and reloaded after the call.

# RUN: llvm-snippy %s -model-plugin None \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 1000
  init-regs-in-elf: true
  function-layers: 5
  function-number: 10
  num-instr-ancil: 10
  redefine-sp: "reg::X11"
  dump-mf: on

include:
  - Inputs/sections-with-stack.yaml

histogram:
    - [SUB, 1.0]
    - [JAL, 0.1]
    - [JALR, 0.1]

#          An example of what we're matching. Spill and reload caller-saved x31:
#
#                     $x3 = ADDI $x3, -16
#                     SD $x31, $x3, 0
#                     $x19 = AUIPC target-flags(riscv-pcrel-hi) @fun7
#                     $x19 = ADDI $x19, target-flags(riscv-pcrel-lo)
#                     $x19 = ADDI $x19, -1478
#                     $x19 = ADDI $x19, 0
#                     $x1 = PseudoJALRCall $x19
#                     $x20 = LUI 64
#                     $x20 = ADDI $x20
#                     $x31 = LD $x20, 0

# CHECK: {{ADDI.*[[:space:]].*SD.*[[:space:]].*AUIPC.*[[:space:]].*ADDI.*[[:space:]].*ADDI.*[[:space:]].*ADDI.*[[:space:]].*PseudoJALRCall.*[[:space:]].*LUI.*[[:space:]].*ADDI.*[[:space:]].*LD}}
