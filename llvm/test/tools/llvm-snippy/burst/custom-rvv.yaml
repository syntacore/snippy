options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: true
  verify-gen-histogram: true
  histogram-must-succeed: true

riscv-vector-unit:
  mode-distribution:
    VM:
      - [all_ones, 2.0]
      - [any_legal, 1.0]
    VL:
      - [max_encodable, 2.0]
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_8: 1.0
        sew_16: 1.0
        sew_32: 1.0
        sew_64: 1.0
      LMUL:
        m1: 1.0
        m2: 1.0
        mf2: 1.0
        mf4: 1.0
        mf8: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0

burst:
  mode: custom
  min-size: 3
  max-size: 3
  groupings:
    - [OPCODE]

histogram:
  - [OPCODE, 1.0]
  - [VSETIVLI, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]


# OPCODE-NOT: Opcode OPCODE is not supported in the burst mode
# OPCODE: {{((OPCODE.*[[:space:]].*){3})}}

# WARN: Opcode OPCODE is not supported in the burst mode
