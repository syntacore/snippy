# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s -num-instrs=97 \
# RUN: |& FileCheck %s --check-prefix=CHECK-TWO-OFF

# RUN: llvm-snippy %s -num-instrs=98 \
# RUN: |& FileCheck %s --check-prefix=CHECK-ONE-OFF

# RUN: llvm-snippy %s -num-instrs=99 \
# RUN: |& FileCheck %s --check-prefix=CHECK-MATCH

# RUN: llvm-snippy %s -num-instrs=100 \
# RUN: |& FileCheck %s --check-prefix=CHECK-ONE-PLUS

options:
  mtriple: riscv64
  histogram-must-succeed: false
  verify-gen-histogram: true

burst:
  mode: mixed
  min-size: 100
  max-size: 100
sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADDI, 1.0]
    - [LD, 1.0]

# CHECK-TWO-OFF: #===Simulation Start===

# CHECK-ONE-OFF: #===Simulation Start===

# CHECK-MATCH: #===Simulation Start===

# CHECK-ONE-PLUS: #===Simulation Start===
