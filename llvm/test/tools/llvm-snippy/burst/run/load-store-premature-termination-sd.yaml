# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 1000
  dump-mi: true
  histogram-must-succeed: false
  verify-gen-histogram: true

burst:
  mode: load-store
  min-size: 1000
  max-size: 1000
sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [SD, 1.0]
    - [LD, 0.3]


# CHECK: #===Simulation Start===
