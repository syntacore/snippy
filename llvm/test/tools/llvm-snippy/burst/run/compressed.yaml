# RUN: llvm-snippy %s %S/../Inputs/burst-store.yaml -num-instrs=200

# RUN: llvm-snippy %s %S/../Inputs/burst-load.yaml -num-instrs=200

# RUN: llvm-snippy %s %S/../Inputs/burst-mixed.yaml -num-instrs=200

# RUN: llvm-snippy %s %S/../Inputs/burst-load-store.yaml -num-instrs=200

# RUN: llvm-snippy %s %S/../Inputs/burst-mixed-huge.yaml -num-instrs=500

options:
  mtriple: riscv64
  mattr: +c
  dump-mf: true

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [C_LW, 1.0]
    - [C_SW, 1.0]
    - [C_SD, 1.0]
    - [ADD, 1.0]
    - [XOR, 1.0]
    - [AND, 1.0]
