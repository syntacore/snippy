include:
  - Inputs/sections.yaml
  - Inputs/mixed-burst.yaml

options:
  mtriple: riscv64
  mattr: +a,+f
  dump-mf: true
  num-instrs: 200
  dump-layout: true

histogram:
    - [LW, 1.0]
    - [SW, 1.0]
    - [LBU, 1.0]
    - [SD, 1.0]
    - [FLW, 1.0]
    - [FSW, 1.0]
    - [AMOADD_W, 1.0]
    - [ADD, 1.0]
    - [XOR, 1.0]
    - [AND, 1.0]


# CHECK: burst:
# CHECK:  min-size: 3
# CHECK:  max-size: 3
# CHECK:  mode: custom

# DOUBLESPEC: error: duplicated mapping key 'burst
