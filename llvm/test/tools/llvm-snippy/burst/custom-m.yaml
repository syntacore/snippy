options:
  mtriple: riscv64
  mattr: +m
  num-instrs: 100
  dump-mf: true

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80000000
    SIZE:      0x10
    LMA:       0x80000000
    ACCESS:    rw

burst:
  mode: custom
  min-size: 3
  max-size: 3
  groupings:
    - [OPCODE]

histogram:
  - [OPCODE, 0.1]
  - [ADDI, 1.0]

# COM: Check that we have at least one sequence of 3 consecutive OPCODEs

# OPCODE-NOT: warning: (burst-mode) Opcode OPCODE is not supported
# OPCODE: {{OPCODE.*[[:space:]].*OPCODE.*[[:space:]].*OPCODE}}
