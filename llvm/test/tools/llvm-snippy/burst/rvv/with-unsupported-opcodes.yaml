# RUN: llvm-snippy %s -model-plugin=None |& FileCheck %s

options:
    mtriple: riscv64
    mattr: +v,+c
    dump-mf: on
    num-instrs: 100

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

histogram:
    - [LB, 1.0]
    - [LBU, 1.0]
    - [C_SD, 1.0]
    - [C_LD, 1.0]
    - [VLSE16_V, 1.0]
    - [VSSE16_V, 1.0]
    - [VADD_VV, 1.0]

burst:
    mode: custom
    min-size: 4
    max-size: 16
    groupings:
      - [LB, LBU, C_LD, VSETVL]
      - [C_SD, VSETVLI]

# CHECK: warning: (burst-mode) Opcode VSETVL is not supported in the
# CHECK-SAME: burst mode: generator will generate it but not in a burst group.
# CHECK: warning: (burst-mode) Opcode VSETVLI is not supported in the
# CHECK-SAME: burst mode: generator will generate it but not in a burst group.

# CHECK: VLSE16_V
# CHECK: VSSE16_V
