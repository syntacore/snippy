# RUN: llvm-snippy %s -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

burst:
  mode: custom
  min-size: 4
  max-size: 8
  groupings:
    - - VLSE8_V
      - VLSE16_V
      - VLSE32_V
      - VLSE64_V
      - VSSE8_V
      - VSSE16_V
      - VSSE32_V
      - VSSE64_V

histogram:
  - [VLSE8_V, 1.0]
  - [VLSE16_V, 1.0]
  - [VLSE32_V, 1.0]
  - [VLSE64_V, 1.0]
  - [VSSE8_V, 1.0]
  - [VSSE16_V, 1.0]
  - [VSSE32_V, 1.0]
  - [VSSE64_V, 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
