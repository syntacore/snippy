# RUN: llvm-snippy %s -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 10000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-little-lmul.yaml

burst:
  mode: mixed
  min-size: 2
  max-size: 3

histogram:
  - ["V[LS][UO]XSEG[2-3]EI[12368]{1,2}_V", 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
