# RUN: llvm-snippy %s --model-plugin None

options:
  num-instrs: 10000
  mtriple: riscv64
  mattr: +v
  init-regs-in-elf: on

include:
  - Inputs/sections.yaml

histogram:
- [LB, 1.0]
- [LH, 1.0]
- [VSOXSEG8EI32_V, 1.0]
- [VSOXSEG8EI64_V, 1.0]
- [VSETVL, 1.0]

burst:
  mode: custom
  min-size: 4
  max-size: 64
  groupings:
  - [LB, LH]
