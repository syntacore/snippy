# RUN: llvm-snippy %s -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

burst:
  mode: custom
  min-size: 4
  max-size: 8
  groupings:
    - - VLE8_V
      - VLE16_V
      - VLE32_V
      - VLE64_V
      - VSE8_V
      - VSE16_V
      - VSE32_V
      - VSE64_V
      - VLM_V
      - VSM_V

histogram:
  - [VLE8_V, 1.0]
  - [VLE16_V, 1.0]
  - [VLE32_V, 1.0]
  - [VLE64_V, 1.0]
  - [VSE8_V, 1.0]
  - [VSE16_V, 1.0]
  - [VSE32_V, 1.0]
  - [VSE64_V, 1.0]
  - [VLM_V, 1.0]
  - [VSM_V, 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
