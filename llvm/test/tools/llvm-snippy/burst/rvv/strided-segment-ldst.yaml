# RUN: llvm-snippy %s -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 20000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-little-lmul.yaml

burst:
  mode: custom
  min-size: 2
  max-size: 3
  groupings:
    - - VLSSEG6E32_V
      - VSSSEG2E32_V
      - VLSSEG3E16_V
      - VSSSEG4E16_V
      - VLSSEG5E8_V
      - VSSSEG6E8_V

histogram:
  - [VLSSEG6E32_V, 1.0]
  - [VSSSEG2E32_V, 1.0]
  - [VLSSEG3E16_V, 1.0]
  - [VSSSEG4E16_V, 1.0]
  - [VLSSEG5E8_V, 1.0]
  - [VSSSEG6E8_V, 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
