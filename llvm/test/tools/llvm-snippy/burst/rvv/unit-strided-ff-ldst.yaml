# RUN: llvm-snippy %s -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

burst:
  mode: custom
  min-size: 4
  max-size: 5
  groupings:
    - - VLE8FF_V
      - VLE16FF_V
      - VLE32FF_V
      - VLE64FF_V

histogram:
  - [VLE8FF_V, 1.0]
  - [VLE16FF_V, 1.0]
  - [VLE32FF_V, 1.0]
  - [VLE64FF_V, 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
