# RUN: llvm-snippy %s -model-plugin=None |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  verify-gen-histogram: true
  histogram-must-succeed: true
  dump-mf: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

burst:
  mode: custom
  min-size: 10
  max-size: 10
  groupings:
    # All are supported in burst
    - [VLE8_V, VADD_VX, VLSEG2E32_V, VL2RE8_V, VS2R_V]
    # The only supported opcode here is SW
    - [VSETVL, VSETVLI, SW, VSETIVLI]

histogram:
  - [VLE8_V, 1.0]
  - [VLSE8_V, 1.0]
  - [VLSEG2E32_V, 1.0]
  - [VSSE8_V, 1.0]
  - [VADD_VX, 1.0]
  - [VLSSEG2E32_V, 1.0]
  - [VL2RE8_V, 1.0]
  - [VS2R_V, 1.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]

# CHECK-DAG: {{((SW.*[[:space:]].*){10})}}
# CHECK-DAG: {{(((VLE8_V|VADD_VX|VL2RE8_V|VS2R_V).*[[:space:]].*){10})}}
# CHECK-NOT: Opcode VLSEG2E32_V will not be generated in the burst group
