# RUN: llvm-snippy %s -model-plugin=None

options:
    mtriple: riscv64
    mattr: +v
    num-instrs: 100
    verify-gen-histogram: true
    histogram-must-succeed: true

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-all.yaml

histogram:
    - [LD, 1.0]
    - [SD, 1.0]
    - [ADD, 1.0]
    - [VSSE64_V, 1.0]
    - [VLSE64_V, 1.0]

burst:
    mode: custom
    min-size: 4
    max-size: 16
    groupings:
      - [LD, VLSE64_V]
      - [SD, VSSE64_V]

