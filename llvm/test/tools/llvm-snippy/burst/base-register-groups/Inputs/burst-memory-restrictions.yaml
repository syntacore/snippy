options:
    mtriple: riscv64
    dump-mf: on
    num-instrs: 200
    mattr: +Zifencei

sections:
  - name:   text
    VMA:    0x10000000
    SIZE:   0x10000
    LMA:    0x10000000
    ACCESS: rx
  - name:   data1
    VMA:    0x20000000
    SIZE:   0x10000
    LMA:    0x20000000
    ACCESS: rw
  - name:   data2
    VMA:    0x30000000
    SIZE:   0x10000
    LMA:    0x30000000
    ACCESS: rw

histogram:
    - [LW, 1.0]
    - [SW, 1.0]

access-groups:
  - weight: 1.0
    access-ranges:
      - start: 0x20000000
        size: 0x10000
        stride: 4
        first-offset: 0
        last-offset: 3
        max-past-last-offset: 0
        attr:
          - type: opcode-restrictions
            allowed-only: [LW]
  - weight: 1.0
    access-ranges:
      - start: 0x30000000
        size: 0x10000
        stride: 4
        first-offset: 0
        last-offset: 3
        max-past-last-offset: 0
        attr:
          - type: opcode-restrictions
            allowed-only: [SW]