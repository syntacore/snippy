# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -model-plugin=None \
# RUN:     -num-instrs=100 -init-memory=runtime -init-regs-in-elf \
# RUN:     -skip-memory-runtime-init -dump-mf \
# RUN: |& FileCheck %s

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram:
    - [LB, 2.0]
    - [SB, 10.0]
    - [SW, 10.0]
    - [ADD, 1.0]

# CHECK: LB
# CHECK: SB
# CHECK: SW
# CHECK: ADD
