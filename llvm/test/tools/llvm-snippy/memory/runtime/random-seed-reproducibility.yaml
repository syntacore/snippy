# ONCE: warning: (seed-not-specified)
# OCNE-NOT: warning: (seed-not-specified)

# CHECK: warning:
# CHECK-SAME: memory seed "none" specified for mode "runtime" that requires it

options:
  mtriple: riscv64
  num-instrs: 1000
  init-regs-in-elf: on

sections:
- name: 1
  VMA: 0x10000
  LMA: 0x10000
  SIZE: 0x10000
  ACCESS: rx
- name: 2
  VMA: 0x20000
  LMA: 0x20000
  SIZE: 0x20000
  ACCESS: rw

histogram:
  - [LW, 1.0]
  - [SW, 1.0]
  - [ADDI, 1.0]
  - [SUB, 1.0]
