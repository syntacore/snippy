# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 1000
  selfcheck: ""
  selfcheck-mem: true
  init-memory: loads

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100
      LMA:       0x210000
      ACCESS:    rw

histogram:
    - [LB, 2.0]
    - [SB, 10.0]
    - [SW, 10.0]
    - [ADD, 1.0]

# CHECK: error: runtime memory initialization 
# CHECK: may be performed only with init-regs-in-elf option
