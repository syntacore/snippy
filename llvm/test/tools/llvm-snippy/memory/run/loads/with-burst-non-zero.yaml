# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 \
# RUN:     -num-instrs=1000 -selfcheck -selfcheck-mem -init-regs-in-elf \
# RUN:     -init-memory=loads -memory-seed=11 \
# RUN:     -dump-memory-section=2 -memory-section-file=%t11

# RUN: llvm-objcopy -O ihex -I binary %t11 %t1
# RUN: cat %t1 |& FileCheck %s --dump-input fail

# COMM: This is the reference of splitmix32 generation for memory-seed=11
# CHECK: 330E1273299ED19A53102DED30FBF41C40

burst:
  mode: mixed
  min-size: 5
  max-size: 5
sections:
    - name:      1
      VMA:       0x70000000
      SIZE:      0x400000
      LMA:       0x70000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x00000040
      LMA:       0x80000000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x60000000
      SIZE:      0x100000
      LMA:       0x60000000
      ACCESS:    rw

histogram:
    - [LD, 2.0]
