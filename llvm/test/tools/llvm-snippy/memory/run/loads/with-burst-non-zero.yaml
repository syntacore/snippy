# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s -memory-section-file=%t11

# RUN: llvm-objcopy -O ihex -I binary %t11 %t1
# RUN: FileCheck %s --input-file=%t1

# COMM: This is the reference of splitmix32 generation for memory-seed=11
# CHECK: 330E1273299ED19A53102DED30FBF41C40

options:
  mtriple: riscv64
  num-instrs: 1000
  selfcheck: ""
  selfcheck-mem: true
  init-regs-in-elf: true
  init-memory: loads
  memory-seed: 11
  dump-memory-section: [2]

burst:
  mode: mixed
  min-size: 5
  max-size: 5
sections:
    - name:      1
      VMA:       0x70000000
      SIZE:      0x400000
      LMA:       0x70000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x00000040
      LMA:       0x80000000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x60000000
      SIZE:      0x100000
      LMA:       0x60000000
      ACCESS:    rw

histogram:
    - [LD, 2.0]
