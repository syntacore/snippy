# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s --init-memory-file=%S/Inputs/memory-map-unaligned.yaml \
# RUN:     --memory-section-file=%t1

# RUN: FileCheck %s --input-file=%t1

# CHECK:      Section {2}:
# CHECK-NEXT: 0x0:  11 22 33 44 55 66 77 88

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x000008
    LMA:       0x100000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10
  init-memory: ascii-file
  dump-memory-section: [2]
  dump-memory-as-ascii: true

  
histogram:
    - [LB, 2.0]
