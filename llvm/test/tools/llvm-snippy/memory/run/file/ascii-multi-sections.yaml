# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:   --init-memory=ascii-file --init-memory-file=%S/Inputs/memory-map.yaml \
# RUN:   --dump-memory-section=2,3,4  --memory-section-file=%t11 --dump-memory-as-ascii

# RUN: cat %t11 |& FileCheck %s

# CHECK:      Section {2}:
# CHECK-NEXT: 0x0:  11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11

# CHECK:      Section {3}:
# CHECK-NEXT: 0x0:  00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

# CHECK:      Section {4}:
# CHECK-NEXT: 0x0:  11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 

sections:
  - name:      1
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rx
  - name:      2
    VMA:       0x200000
    SIZE:      0x000010
    LMA:       0x200000
    ACCESS:    rw
  - name:      3
    VMA:       0x300000
    SIZE:      0x000010
    LMA:       0x300000
    ACCESS:    rw
  - name:      4
    VMA:       0x400000
    SIZE:      0x000010
    LMA:       0x400000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10

  
histogram:
    - [LB, 2.0]
