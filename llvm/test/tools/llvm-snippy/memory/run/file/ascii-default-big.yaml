# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:   --init-memory=ascii-file --init-memory-file=%S/Inputs/memory-map-big.yaml \
# RUN:   --dump-memory-section=2  --memory-section-file=%t1 --dump-memory-as-ascii

# RUN: cat %t1 |& FileCheck %s

# CHECK:      Section {2}:
# CHECK-NEXT: 0x00:  bf 00 11 6f 07 bf 11 49 aa 55 77 91 02 01 10 8f
# CHECK-NEXT: 0x10: 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x000020
    LMA:       0x100000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10
  
histogram:
    - [LB, 2.0]
