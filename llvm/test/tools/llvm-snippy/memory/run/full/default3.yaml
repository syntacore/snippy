# REQUIRES: riscv-snippy-model-any
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 50
  init-regs-in-elf: true
  selfcheck: ""
  enable-selfcheck-rvv: true
  selfcheck-mem: true
  init-memory: full

include:
- Inputs/rvv-unit-all.yaml

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0xC00000
      SIZE:      0x20000
      LMA:       0xC00000
      ACCESS:    rw


histogram: 
    - [VADD_VV, 1.0]
    - [VMV_V_V, 1.0]
    - [ADD, 2.0]
    - [SW, 1.0]
    - [LD, 2.0]

# CHECK: #===Simulation Start===

