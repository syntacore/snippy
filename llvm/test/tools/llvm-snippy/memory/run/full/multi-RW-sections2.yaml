# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 \
# RUN:     -num-instrs=30 -selfcheck -selfcheck-mem \
# RUN:     -init-memory=full -o %t

# RUN: llvm-readelf --hex-dump=.snippy.2.rw  %t.elf \
# RUN: llvm-readelf --hex-dump=.snippy.3.rw %t.elf \
# RUN: |& FileCheck %s --dump-input fail

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x1000
      LMA:       0x210000
      ACCESS:    rw
    - name:      3
      VMA:       0x211000
      SIZE:      0x1000
      LMA:       0x211000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw

histogram:
    - [LB, 2.0]
    - [SB, 1.0]
    - [SW, 1.0]
    - [ADD, 1.0]
    - [XOR, 1.0]
    - [AND, 1.0]
    - [SUB, 1.0]

# CHECK:      '.snippy.2.rw':
# CHECK-NEXT: 0x00000000
# CHECK-NOT:             00000000 00000000 00000000 00000000
# CHECK:      0x00000ff0
# CHECK-NOT:  0x00001000

# CHECK:      '.snippy.3.rw':
# CHECK-NEXT: 0x00000000
# CHECK-NOT:             00000000 00000000 00000000 00000000
# CHECK:      0x00000ff0 
# CHECK-NOT:  0x00001000
