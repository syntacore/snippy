# REQUIRES: riscv-snippy-model-any

# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  selfcheck: ""
  selfcheck-mem: true
  init-memory: full

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x3
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw

histogram:
    - [LB, 2.0]
    - [SB, 1.0]

# CHECK: error: Section 2 can't be emmitted due to misalignment
