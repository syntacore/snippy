# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --riscv-disable-misaligned-access \
# RUN:  --num-instrs=10000 --init-regs-in-elf --verify-mi \
# RUN:  |& FileCheck %s

include:
- ../Inputs/memory-unaligned.yaml

sections:
