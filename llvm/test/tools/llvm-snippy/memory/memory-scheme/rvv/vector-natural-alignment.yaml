   - ["VSSE(8|16|32|64)_V", 1.0]
   - ["VLUXEI(8|16|32|64)_V", 1.0]
   - ["VLOXEI(8|16|32|64)_V", 1.0]
   - ["VSUXEI(8|16|32|64)_V", 1.0]
   - ["VSOXEI(8|16|32|64)_V", 1.0]
   - ["VLE(8|16|32|64)FF_V", 1.0]
   - ["VLSEG[1-8]E(8|16|32|64)_V", 1.0]
   - ["VSSEG[1-8]E(8|16|32|64)_V", 1.0]
