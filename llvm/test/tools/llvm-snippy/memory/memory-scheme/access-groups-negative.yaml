# COM: This test verifies that field "weight" can not be less than zero

# RUN: not llvm-snippy %s %S/Inputs/default-layout.yaml \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100

access-groups:
  - weight: -2
    access-ranges:
      - start: 0x80002000
        size: 0x1000
        stride: 16
        first-offset: 1
        last-offset: 2
        weight: 1.5

# CHECK: access-groups-negative.yaml:11:5: error: Access-group weight can not be less than 0
