# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %S/../Inputs/loadstore-layout.yaml %s -mtriple=riscv64 \
# RUN:  -num-instrs=1000 \
# RUN: |& FileCheck %s

restricted-addresses:
    - plain:
          - addr: 0x80002000
            access-size: 1
access-evictions:
    - mask:  0x00000000
      fixed: 0x80002000
    - mask:  0x00000000
      fixed: 0x80002010

