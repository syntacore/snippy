# REQUIRES: riscv-snippy-model-spike
# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100
  riscv-disable-misaligned-access: true

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

access-ranges:
    - start: 0x80600000
      size: 0x20
      stride: 32
      first-offset: 0
      last-offset: 31

    - start: 0x80700000
      size: 0x40
      stride: 64
      first-offset: 0
      last-offset: 63
      misaligned-access: true

histogram:
   - [LW, 1.0]
   - [SW, 1.0]

# COM: In 0x80700000 range misaligned accesses are allowed, but simulator doesn't expect that
# COM: because of riscv-disable-misaligned-access=true

# CHECK: exception trap_{{store|load}}_address_misaligned
