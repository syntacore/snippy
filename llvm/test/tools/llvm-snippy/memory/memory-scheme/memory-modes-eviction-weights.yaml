# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s %S/Inputs/loadstore-layout-1b.yaml -seed=2 \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  riscv-disable-misaligned-access: ""

access-evictions:
    - mask:  0x00000000
      fixed: 0x80000100
      weight: 0
    - mask:  0x00000000
      fixed: 0x80000010
      weight: 0.01

# CHECK-NOT: 80000100
# CHECK-COUNT-10: 80000010
