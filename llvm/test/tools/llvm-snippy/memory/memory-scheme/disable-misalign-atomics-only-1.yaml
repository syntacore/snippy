# RUN: llvm-snippy %s -dump-memory-accesses=%t
# RUN: FileCheck %s --input-file=%t

options:
  mtriple: riscv64
  mattr: +a
  riscv-disable-misaligned-access: atomics-only
  num-instrs: 300

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

access-ranges:
    - start: 0x80600000
      size: 0x10
      stride: 8
      first-offset: 0
      last-offset: 1

histogram:
   - [AMOSWAP_D, 1.0]
   - [AMOADD_D, 1.0]
   - [AMOAND_D, 1.0]
   - [AMOOR_D, 1.0]
   - [AMOXOR_D, 1.0]
   - [AMOMAX_D, 1.0]
   - [AMOMAXU_D, 1.0]
   - [AMOMIN_D, 1.0]
   - [AMOMINU_D, 1.0]
   - [LR_D, 1.0]
   - [SC_D, 1.0]

# CHECK: - addr: 0x80600000
# CHECK: - addr: 0x80600008

# CHECK-NOT: {{0x806000(01|09)}}
