# RUN: llvm-snippy %s -dump-memory-accesses=%t
# RUN: FileCheck %s --input-file=%t

options:
  mtriple: riscv64
  mattr: +a
  riscv-disable-misaligned-access: atomics-only
  num-instrs: 300

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

access-ranges:
    - start: 0x80600000
      size: 0x10
      stride: 8
      first-offset: 0
      last-offset: 1

histogram:
   - [LW, 1.0]
   - [SW, 1.0]
   - [AMOSWAP_W, 1.0]
   - [AMOADD_W, 1.0]

# CHECK: - addr: 0x80600000
# CHECK: - addr: 0x80600001
# CHECK: - addr: 0x80600008
# CHECK: - addr: 0x80600009
