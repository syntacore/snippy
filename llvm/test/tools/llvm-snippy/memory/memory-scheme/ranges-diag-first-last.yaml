# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s %S/Inputs/loadstore-layout.yaml |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 1000

access-ranges:
    - start: 0x80002001
      size: 0x14
      stride: 5
      first-offset: 3
      last-offset: 1
    - start: 0x80002001
      size: 0x14
      stride: 5
      first-offset: 5
      last-offset: 5

# CHECK: error: Invalid memory access range: 'first-offset' (3) > 'last-offset' (1)
