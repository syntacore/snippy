# RUN: llvm-snippy %s %S/Inputs/loadstore-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 1000

restricted-addresses:
    - plain:
          - addr: 0x80002000
            access-size: 1
access-evictions:
    - mask:  0x00000000
      fixed: 0x80002000
    - mask:  0x00000000
      fixed: 0x80002010
