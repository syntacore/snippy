# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s %S/Inputs/loadstore-layout-1b.yaml \
# RUN:     -dump-memory-accesses=%t
# RUN: FileCheck --input-file=%t %s

# RUN: llvm-snippy %s %S/Inputs/loadstore-layout-1b.yaml \
# RUN:     -enable-address-value-hazards -backtrack \
# RUN:     -dump-memory-accesses=%t
# RUN: FileCheck --input-file=%t %s

# RUN: llvm-snippy %s %S/Inputs/atomic-layout.yaml -mattr=+a \
# RUN:     -enable-address-value-hazards -backtrack \
# RUN:     -dump-memory-accesses=%t
# RUN: FileCheck --input-file=%t %s

# RUN: llvm-snippy %s %S/Inputs/lr-sc.yaml -mattr=+a -dump-memory-accesses=%t
# RUN: FileCheck --input-file=%t %s


options:
  mtriple: riscv64
  num-instrs: 1000

access-evictions:
    - mask:  0x00000060
      fixed: 0x80100010

# CHECK-COUNT-1000: {{0x801000[1357]0}}
# CHECK-NOT: {{0x801000[1357]0}}
