# REQUIRES: riscv-snippy-model-any
# UNSUPPORTED: riscv-snippy-model-whisper

# RUN: llvm-snippy %s %S/../Inputs/loadstore-layout-8b.yaml \
# RUN: |& FileCheck %s --check-prefix ALL

# RUN: llvm-snippy %s %S/../Inputs/loadstore-layout-8b.yaml \
# RUN: |& FileCheck %s --check-prefix CNT

options:
  mtriple: riscv64
  riscv-disable-misaligned-access: ""
  num-instrs: 1000

access-evictions:
    - mask:  0x0000100c
      fixed: 0x80100000
burst:
  mode: mixed
  min-size: 30
  max-size: 30


# Check that we generated all possible addresses
# ALL: {{mem((\[((R|W),){0,1})| )0x0000000080100000}}
# ALL: {{mem((\[((R|W),){0,1})| )0x0000000080100008}}
# ALL: {{mem((\[((R|W),){0,1})| )0x0000000080101000}}
# ALL: {{mem((\[((R|W),){0,1})| )0x0000000080101008}}

