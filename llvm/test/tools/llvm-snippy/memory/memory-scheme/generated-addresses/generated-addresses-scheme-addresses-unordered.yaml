# REQUIRES: riscv-snippy-model-any
# UNSUPPORTED: riscv-snippy-model-whisper

# RUN: llvm-snippy %s %S/../Inputs/loadstore-layout-4b.yaml -trace-log %t

# RUN: FileCheck %s --input-file=%t

options:
  mtriple: riscv64
  riscv-disable-misaligned-access: ""
  num-instrs: 1000

access-addresses:
  - ordered: false
    plain:
      - addr: 0x80000001
      - addr: 0x80000002
      - addr: 0x80000004
      - addr: 0x80000008

# CHECK-COUNT-1000: {{0x000000008000000(4|8)}}
