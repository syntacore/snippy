# REQUIRES: riscv-snippy-model-any
# UNSUPPORTED: riscv-snippy-model-whisper

# RUN: llvm-snippy %s %S/../Inputs/loadstore-layout-1b.yaml -num-instrs=10 \
# RUN: |& FileCheck %s --check-prefix ORDER

# RUN: llvm-snippy %s %S/../Inputs/loadstore-layout-1b.yaml -num-instrs=1000 \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  riscv-disable-misaligned-access: ""

access-addresses:
  - ordered: true
    plain:
      - addr: 0x80002001
      - addr: 0x80000000
      - addr: 0x80001234
      - addr: 0x80000000
      - addr: 0x80000300

# ORDER: 0x0000000080002001
# ORDER: 0x0000000080000000
# ORDER: 0x0000000080001234
# ORDER: 0x0000000080000000
# ORDER: 0x0000000080000300
# second round
# ORDER: 0x0000000080002001
# ORDER: 0x0000000080000000
# ORDER: 0x0000000080001234
# ORDER: 0x0000000080000000
# ORDER: 0x0000000080000300

# CHECK-COUNT-1000: {{0x000000008000(2001|0000|1234|0300)}}
