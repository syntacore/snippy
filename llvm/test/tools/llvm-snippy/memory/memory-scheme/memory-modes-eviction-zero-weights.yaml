# RUN: not llvm-snippy %s %S/Inputs/loadstore-layout-1b.yaml \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  riscv-disable-misaligned-access: ""

access-evictions:
    - mask:  0x00000000
      fixed: 0x80000100
      weight: 0
    - mask:  0x00000000
      fixed: 0x80000010
      weight: 0

# CHECK: error: Cannot sample memory access for instruction
# CHECK: Memory schemes are to restrictive to generate access (size: 1, alignment: 1, stride: 0, number of elements: 1)
