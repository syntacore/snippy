# RUN: not llvm-snippy %s -model-plugin=None |& FileCheck %s
# RUN: not llvm-snippy %s -model-plugin=None --init-memory=runtime --init-regs-in-elf |& FileCheck %s

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x001000
    LMA:       0x100000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10

  init-memory-file: "boba"
  
histogram:
    - [LB, 2.0]

# CHECK: error: init-memory-file option needs memory init mode
# CHECK:             to be specified as file init
