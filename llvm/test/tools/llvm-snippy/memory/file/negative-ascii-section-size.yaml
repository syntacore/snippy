# RUN: not llvm-snippy %s -model-plugin=None \
# RUN:   --init-memory=ascii-file --init-memory-file=%S/Inputs/memory-map.yaml \
# RUN: |& FileCheck %s

sections:
  - name:      1
    VMA:       0x10000
    SIZE:      0x10000
    LMA:       0x10000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x001000
    LMA:       0x100000
    ACCESS:    rw
  - name:      4
    VMA:       0x400000
    SIZE:      0x000010
    LMA:       0x400000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10

  
histogram:
    - [LB, 2.0]
    - [ADD, 4.0]
    - [SW, 2.0]

# CHECK: error: Incorrect section size in memory init file: 2 expected 4096, got 16
