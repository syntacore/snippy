# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s \
# RUN:     --init-memory-file=%S/Inputs/memory-map-wrong-format.yaml \
# RUN: |& FileCheck %s

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x001000
    LMA:       0x100000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10
  init-memory: ascii-file

  
histogram:
    - [LB, 2.0]

# CHECK: error: [memory-map-wrong-format.yaml, 2] 
# CHECK: Wrong memory init file format: empty line specified
