# RUN: not llvm-snippy %s -model-plugin=None \
# RUN:   --init-memory=ascii-file \
# RUN:   --init-memory-file=%S/Inputs/memory-map-additional-symbols.yaml |& FileCheck %s    

sections:
  - name:      1
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rx
  - name:      2
    VMA:       0x200000
    SIZE:      0x000010
    LMA:       0x200000
    ACCESS:    rw
  - name:      3
    VMA:       0x300000
    SIZE:      0x000010
    LMA:       0x300000
    ACCESS:    rw
  - name:      4
    VMA:       0x400000
    SIZE:      0x000010
    LMA:       0x400000
    ACCESS:    rw

options:
  mtriple: "riscv64"
  mcpu: "generic-rv64"
  num-instrs: 10

  
histogram:
    - [LB, 2.0]

# CHECK: error: [memory-map-additional-symbols.yaml, 4] 
# CHECK: Wrong memory init file format: can't match section header
