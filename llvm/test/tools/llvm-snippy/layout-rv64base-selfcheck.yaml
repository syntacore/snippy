# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 \
# RUN:   -num-instrs=10000 \
# RUN:   -init-regs-in-elf -force-emit-linker-script \
# RUN:   -reserved-regs-list=X1,X2,X8 -last-instr=RET \
# RUN:   -selfcheck -selfcheck-gv -mattr=+c,+a,+m |& FileCheck %s

# CHECK: #===Simulation Start===

include:
- Inputs/memory-aligned.yaml

sections:
  - name:      0
    VMA:       0x200000
    SIZE:      0x1000
    LMA:       0x200000
    ACCESS:    r
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80002000
    SIZE:      0x100000
    LMA:       0x80002000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x310000
    SIZE:      0x1000000
    LMA:       0x310000
    ACCESS:    rw

branches:
  permutation: off

histogram:
  # branches ~ every 30 instructions
  - [BEQ, 3.7]
  - [BGE, 3.7]
  - [BGEU, 3.7]
  - [BLT, 3.7]
  - [BLTU, 3.7]
  - [BNE, 3.7]
  - [C_BEQZ, 3.7]
  - [C_BNEZ, 3.7]
  - [C_J, 3.7]
  # loads/stores ~ 2/3 instruction
  - [C_LD, 29]
  - [C_LW, 29]
  - [C_SD, 29]
  - [C_SW, 29]
  - [LB, 29]
  - [LBU, 29]
  - [LD, 29]
  - [LH, 29]
