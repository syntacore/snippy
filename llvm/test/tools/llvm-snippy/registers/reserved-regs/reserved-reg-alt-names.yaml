# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  init-regs-in-elf: true
  dump-mi: true
  num-instrs: 2000
  reserved-regs-list: [x4, s0, ra]

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x40000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]

# CHECK: Generated
# CHECK-NOT: $x4
# CHECK-NOT: $x8
# CHECK-NOT: $x1{{[^0-9]}}
