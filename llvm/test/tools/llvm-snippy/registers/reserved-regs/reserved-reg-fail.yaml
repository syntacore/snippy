# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s -redefine-sp=SP \
# RUN:    -reserved-regs-list=X0,X1,X2,X3,X4,X5,\
# RUN:X6,X7,X8,X9,X10,X11,X12,X13,X14,X15,X16,X17,X18,X19,X20,X21,X22,X23,X24,X25,X26,X27,\
# RUN:X28,X29,X30,X31 --redefine-ra=RA \
# RUN: |& FileCheck %s
# RUN: not llvm-snippy %s -reserved-regs-list=X0,X1,X2,XA,X4 \
# RUN: |& FileCheck --check-prefix=ILLEGAL %s

options:
  mtriple: riscv64
  dump-mi: true
  num-instrs: 20000
  last-instr: ""

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x1000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
# CHECK: error: No available register GPR: instruction generation
# ILLEGAL: error: Illegal register name XA is specified in --reserved-regs-list
