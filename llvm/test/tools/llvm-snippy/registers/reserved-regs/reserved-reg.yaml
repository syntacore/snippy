# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+d \
# RUN:    -dump-mi -num-instrs=2000 -reserved-regs-list=X4,X6,F1_D \
# RUN:    -last-instr= \
# RUN:    | FileCheck %s

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x40000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]

# CHECK: Generated
# CHECK-NOT: $x4
# CHECK-NOT: $x6
# CHECK-NOT: $F1_D
