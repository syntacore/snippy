# RUN: llvm-snippy %s -last-instr= \
# RUN: |& FileCheck %s

# RUN: not llvm-snippy %s "-last-instr= " \
# RUN: |& FileCheck %s -check-prefix=TRICKY-EMPTY

options:
  mtriple: riscv64
  mattr: -a,+m
  dump-mi: true
  num-instrs: 10

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x200
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x800200
      SIZE:      0x200
      LMA:       0x800200
      ACCESS:    rw
    - name:      3
      VMA:       0x800400
      SIZE:      0x200
      LMA:       0x800400
      ACCESS:    rw

histogram: 
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SW, 5.0]
      
# CHECK: Generated MI_{{[0-9]*}}: $x0 = ADDI $x0, 0, post-instr-symbol <mcsymbol __snippy_exit>  
# CHECK-NOT: Generated

# TRICKY-EMPTY: error: unknown opcode " " for last instruction generation
