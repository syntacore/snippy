# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+v -rvv-init-mode=loads -selfcheck --riscv-preference-for-rvv-mode-change=vsetvl\
# RUN:     -num-instrs=1 -init-regs-in-elf -selfcheck -dump-mf -enable-selfcheck-rvv \
# RUN:     -selfcheck-mem \
# RUN: |& FileCheck %s --dump-input always

include:
- "../rvv-config-histogram/Inputs/rvv-unit-sew8-lmul4-max_encodable-bias.yaml"

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x40000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw
    - name:      stack
      VMA:       0x410000
      SIZE:      0x100000
      LMA:       0x410000
      ACCESS:    rw

histogram:
    - [VADD_VV, 10000.0]

# CHECK: [[REG:\$v[0-9]+]] = VADD_VV
# CHECK-COUNT-8: VS1R_V
# CHECK: EBREAK


