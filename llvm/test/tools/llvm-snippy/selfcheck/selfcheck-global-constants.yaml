# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=-c \
# RUN:    -num-instrs=1000 -init-regs-in-elf -selfcheck \
# RUN:    -selfcheck-gv -o %t
# RUN:    llvm-objdump -t %t.elf \
# RUN: |& FileCheck %s --check-prefix=UNMANGLED
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=-c \
# RUN:    -num-instrs=1000 -init-regs-in-elf -selfcheck \
# RUN:    --entry-point=Test -mangle-exported-names \
# RUN:    -selfcheck-gv -o %t
# RUN:    llvm-objdump -t %t.elf \
# RUN: |& FileCheck %s --check-prefix=MANGLED
sections:
  - name:      1
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    r
  - name:      2
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      3
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x610000
    SIZE:      0x100000
    LMA:       0x610000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [SRA, 1.0]
    - [SRAI, 1.0]
    - [SRL, 1.0]
    - [SRLI, 1.0]
    - [SLL, 1.0]
    - [SLLI, 1.0]
    - [AND, 1.0]
    - [ANDI, 1.0]
    - [OR, 1.0]
    - [ORI, 1.0]
    - [XOR, 1.0]
    - [XORI, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]

# UNMANGLED: __snippy_selfcheck_section_address
# UNMANGLED: __snippy_selfcheck_section_size
# UNMANGLED: __snippy_selfcheck_data_byte_stride

# MANGLED: __snippy_Test_selfcheck_section_address
# MANGLED: __snippy_Test_selfcheck_section_size
# MANGLED: __snippy_Test_selfcheck_data_byte_stride
