# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100
  dump-mf: on

include:
  - Inputs/sections.yaml

histogram:
  - [SUB, 1.0]
  - [BLT, 1.0]

branches:
  loop-ratio: 1.0
  loop-counters:
    place-on-stack: on
  number-of-loop-iterations:
    min: 10
    max: 10

access-ranges:
  - start: 0x400000000
    size: 16
    stride: 8
    first-offset: 0
    last-offset: 0
  - start: 0x400001000
    size: 8
    stride: 8
    first-offset: 0
    last-offset: 0

#Com: preheader block
#
#Com: CounterReg spilling
#CHECK: [[SP:\$x[[:digit:]]+]] = ADDI [[SP]], -16
#CHECK-NEXT: SD $x{{[[:digit:]]+}}, [[SP]], 0
#Com: LimitReg spilling
#CHECK: [[SP]] = ADDI [[SP]], -16
#CHECK-NEXT: SD $x{{[[:digit:]]+}}, [[SP]], 0
#
#Com: exiting block
#Com: LimitReg reloading
#CHECK: [[LIMIT_REG:\$x[[:digit:]]+]] = LD [[SP]], 0
#CHECK-NEXT: [[SP]] = ADDI [[SP]], 16
#Com: CounterReg reloading
#CHECK: [[COUNTER_REG:\$x[[:digit:]]+]] = LD [[SP]], 0
#CHECK-NEXT: [[SP]] = ADDI [[SP]], 16
#
#Com: CounterReg spilling
#CHECK: [[SP]] = ADDI [[SP]], -16
#CHECK-NEXT: SD [[COUNTER_REG]], [[SP]], 0
#Com: LimitReg spilling
#CHECK: [[SP]] = ADDI [[SP]], -16
#CHECK-NEXT: SD [[LIMIT_REG]], [[SP]], 0
#CHECK-NEXT: BLT [[COUNTER_REG]], [[LIMIT_REG]]
