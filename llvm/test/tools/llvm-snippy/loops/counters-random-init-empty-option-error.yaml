# REQUIRES: riscv-snippy-model-None
# RUN: timeout 300 not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100

include:
  - Inputs/sections.yaml

histogram:
  - [LD, 10.0]

branches:
  loop-counters:
    random-init:

access-ranges:
  - start: 0x400000000
    size: 64
    stride: 8
    first-offset: 0
    last-offset: 0
  - start: 0x400001000
    size: 8
    stride: 8
    first-offset: 0
    last-offset: 0

# CHECK: error: loop-counters: random-init option requires at least one of the
# CHECK-SAME: following attributes: enabled, min, max. But none of them was
# CHECK-SAME: provided.
