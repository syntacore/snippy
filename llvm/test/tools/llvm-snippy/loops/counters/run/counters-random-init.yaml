# RUN: timeout 300 llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  dump-mf: true

include:
  - ../../../loops/Inputs/sections.yaml

histogram:
  - [BNE, 1.0]
  - [BGE, 1.0]

branches:
  loop-ratio: 1.0
  loop-counters:
    random-init:
      min: 10
      max: 100000000

access-ranges:
  - start: 0x400000000
    size: 64
    stride: 8
    first-offset: 0
    last-offset: 0
  - start: 0x400001000
    size: 8
    stride: 8
    first-offset: 0
    last-offset: 0

# CHECK: BNE $x{{[[:digit:]]+}}, $x{{[[:digit:]]+}}
# CHECK: BGE $x{{[[:digit:]]+}}, $x{{[[:digit:]]+}}
