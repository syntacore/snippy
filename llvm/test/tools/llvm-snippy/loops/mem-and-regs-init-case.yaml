# RUN: llvm-snippy %s -mtriple=riscv64 -num-instrs=3 \
# RUN: -init-regs-in-elf -init-memory=runtime --dump-mf |& FileCheck %s

options:
  trace-log: "/dev/null"
branches:
  loop-ratio: 1
sections:
    - name:      1
      VMA:       0x1000
      SIZE:      0x10000
      LMA:       0x1000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x4000
      LMA:       0x80000000
      ACCESS:    rw

histogram:
    - [BLT, 1.0]
    - [SH, 1.0]

# COM: Memory block
# CHECK bb.3:
# CHECK successors: %bb.4(0x80000000); %bb.4(100.00%)

