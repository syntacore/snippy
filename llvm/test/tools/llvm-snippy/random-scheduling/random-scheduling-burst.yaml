# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  mattr: "+m,+v"
  num-instrs: 10000
  dump-mf: on
  verify-gen-histogram: on
  histogram-must-succeed: on

include:
  - ../RISCV/rvv/Inputs/rvv-sections.yaml

scheduling:
  enabled: on

burst:
  mode: custom
  min-size: 2
  max-size: 2
  groupings:
    - [LD]
    - [SD]
    - [LW]
    - [SW]
    - [VLE8_V]
    - [VADD_VX]
    - [VLSEG2E32_V]
    - [VL2RE8_V]
    - [VS2R_V]

histogram:
    - [LD, 1.0]
    - [SD, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]
    - [VSETVL, 0.5]
    - [VLE8_V, 1.0]
    - [VADD_VX, 1.0]
    - [VLSEG2E32_V, 1.0]
    - [VL2RE8_V, 1.0]
    - [VS2R_V, 1.0]
    - [MUL, 1.0]
    - [DIV, 1.0]
    - [SUB, 1.0]

# CHECK: {{((LD.*[[:space:]].*){2})}}
# CHECK: {{((SD.*[[:space:]].*){2})}}
# CHECK: {{((LW.*[[:space:]].*){2})}}
# CHECK: {{((SW.*[[:space:]].*){2})}}
# CHECK: {{((VL2RE8_V.*[[:space:]].*){2})}}
# CHECK: {{((VLE8_V.*[[:space:]].*){2})}}
# CHECK: {{((VADD_V.*[[:space:]].*){2})}}
# CHECK: {{((VLSEG2E32_V.*[[:space:]].*){2})}}
# CHECK: {{((VS2R_V.*[[:space:]].*){2})}}

# CHECK: MUL
# CHECK: DIV
# CHECK: SUB

