# REQUIRES: asserts

# RUN: llvm-snippy %s \
# RUN:     -initial-regs=%S/../initialization/Inputs/initial_state_rv64i.yaml \
# RUN:     -o %t_1

# RUN: llvm-snippy %s -debug-only=snippy-riscv \
# RUN:     -initial-regs=%S/../initialization/Inputs/initial_state_rv64i.yaml \
# RUN:     -o %t_2 -random-scheduling \
# RUN: |& FileCheck %s

# RUN: not diff -q %t_1.elf %t_2.elf

include:
  - ../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  enable-static-stack: false
  num-instrs: 10000
  mattr: +c

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - fun1
        - fun2
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3

# CHECK: Currently unsupported scheduling instruction : ${{[a-z0-9]+}} = PseudoJALCall
