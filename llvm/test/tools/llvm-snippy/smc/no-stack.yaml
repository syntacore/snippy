# RUN: not llvm-snippy %s -model-plugin None \
# RUN: |& FileCheck %s --check-prefix=NO-STACK

# RUN: llvm-snippy %s -model-plugin None -external-stack \
# RUN: |& FileCheck %s --check-prefix=EXT-STACK

# NO-STACK: error: SMC mode expects stack section provided

# EXT-STACK: $[[TMP1:[a-z0-9]+]] = AUIPC target-flags(riscv-pcrel-hi) @__snippy_smc_memcpy, pre-instr-symbol <mcsymbol .[[TMP_SYM1:[a-zA-Z0-9_]+]]>
# EXT-STACK-NEXT: $[[RA:[a-z0-9]+]] = PseudoJALRCall $[[TMP1]], target-flags(riscv-pcrel-lo) <mcsymbol .[[TMP_SYM1]]>
# EXT-STACK-NEXT:  FENCE_I
# EXT-STACK-NEXT: $[[TMP2:[a-z0-9]+]] = AUIPC target-flags(riscv-pcrel-hi) @__snippy_smc_target, pre-instr-symbol <mcsymbol .[[TMP_SYM2:[a-zA-Z0-9_]+]]>
# EXT-STACK-NEXT: $[[RA]] = PseudoJALRCall $[[TMP2]], target-flags(riscv-pcrel-lo) <mcsymbol .[[TMP_SYM2]]>

options:
  mattr: +m,+zifencei
  mtriple: riscv64
  num-instrs: 500
  dump-mf: on

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x50000
    LMA:       0x100000
    ACCESS:    rw
  - name:      3     # SMC requires read-only section
    VMA:       0x310000
    SIZE:      0x50000
    LMA:       0x310000
    ACCESS:    r

histogram:
    - [BNE, 2.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [MUL, 1.0]

include:
  - Inputs/branchegram.yaml
  - Inputs/smcgram.yaml
  - Inputs/code-layout.yaml
