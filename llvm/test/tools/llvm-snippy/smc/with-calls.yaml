# RUN: llvm-snippy %s -mtriple=riscv64 -model-plugin None \
# RUN: |& FileCheck %s

# RUN: llvm-snippy %s -mtriple=riscv32 -model-plugin None \
# RUN: |& FileCheck %s

# CHECK: $[[TMP1:[a-z0-9]+]] = AUIPC target-flags(riscv-pcrel-hi) @__snippy_smc_memcpy, pre-instr-symbol <mcsymbol .[[TMP_SYM1:[a-zA-Z0-9_]+]]>
# CHECK-NEXT: $[[RA:[a-z0-9]+]] = PseudoJALRCall $[[TMP1]], target-flags(riscv-pcrel-lo) <mcsymbol .[[TMP_SYM1]]>
# CHECK-NEXT:  FENCE_I
# CHECK-NEXT: $[[TMP2:[a-z0-9]+]] = AUIPC target-flags(riscv-pcrel-hi) @__snippy_smc_target, pre-instr-symbol <mcsymbol .[[TMP_SYM2:[a-zA-Z0-9_]+]]>
# CHECK-NEXT: $[[RA]] = PseudoJALRCall $[[TMP2]], target-flags(riscv-pcrel-lo) <mcsymbol .[[TMP_SYM2]]>
# CHECK: $[[RA]] = PseudoJALCall @fun

options:
  mattr: +m,+zifencei,+c
  num-instrs: 500
  function-layers: 3
  function-number: 10
  num-instr-ancil: 50
  dump-mf: on

histogram:
    - [BNE, 2.0]
    - [C_BEQZ, 2.0]
    - [C_BNEZ, 2.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [MUL, 1.0]
    - [JAL, 5.0]
    - [C_J, 1.25]
    - [PseudoC_JRB, 1.25]
    - [C_JALR, 1.25]

include:
  - Inputs/branchegram.yaml
  - Inputs/sections.yaml
  - Inputs/smcgram.yaml
  - Inputs/code-layout.yaml
