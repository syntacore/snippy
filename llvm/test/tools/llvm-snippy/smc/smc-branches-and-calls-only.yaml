# COM: This test checks that SMC works with only calls and branches.

# RUN: llvm-snippy %s -mtriple=riscv64
# RUN: llvm-snippy %s -mtriple=riscv32

options:
  mattr: +zifencei
  num-instrs: 100
  function-layers: 5
  function-number: 5
  num-instr-ancil: 10

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x50000
    LMA:       0x100000
    ACCESS:    rw
  - name:      3     # SMC requires read-only section
    VMA:       0x310000
    SIZE:      0x50000
    LMA:       0x310000
    ACCESS:    r
  - name:      stack # SMC requires internal or external stack enabled
    VMA:       0x150000
    SIZE:      0x50000
    LMA:       0x150000
    ACCESS:    rw

histogram:
    - [BEQ, 1.0]
    - [BNE, 1.0]
    - [BLT, 1.0]
    - [BGE, 1.0]
    - [BLTU, 1.0]
    - [BGEU, 1.0]
    - [JAL, 1.0]
    - [JALR, 1.0]

code-layout:
  ranges:
    - start: 0x210000
      size: 0x100000
      stride: 0x1
      first-offset: 0
      last-offset: 0x0
include:
  - Inputs/smc-branchegram.yaml

smcgram:
  smc-tgt-blocks: 0.5 # 0.5 by default
  smc-overwriters:
    min: 1
    max: 1
  smc-mode: immediate # Trigger SMC immediately after overwritting
