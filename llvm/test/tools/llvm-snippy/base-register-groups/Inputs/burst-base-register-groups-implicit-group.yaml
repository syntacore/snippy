options:
    mtriple: riscv64
    dump-mf: on
    num-instrs: 200
    mattr: +zicbom

include:
  - ../../Inputs/sections.yaml

histogram:
    - [CBO_INVAL, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]

burst:
    mode: custom
    min-size: 200
    max-size: 200
    groupings:
      - [CBO_INVAL, LW, SW]
    base-register-groups:
      - [CBO_INVAL, SW]