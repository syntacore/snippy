# RUN: not llvm-snippy %s \
# RUN:    -initial-regs-yaml=%S/Inputs/d-too-wide-freg-values.yaml \
# RUN:    -model-plugin=None \
# RUN: |& FileCheck %s

options:
  mtriple: riscv32
  mattr: +d
  num-instrs: 1
  init-regs-in-elf: true

include:
  - ../../../../Inputs/sections.yaml

histogram:
    - [ADD, 1.0]

