# UNSUPPORTED: riscv-snippy-model-None

# RUN: llvm-snippy %s \
# RUN:    -initial-regs-yaml=%S/Inputs/d.yaml -trace-SNTF %t.trace.dump
# RUN: FileCheck %s --input-file %t.trace.dump

options:
  mtriple: riscv32
  mattr: +d
  num-instrs: 10
  init-regs-in-elf: true

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]

