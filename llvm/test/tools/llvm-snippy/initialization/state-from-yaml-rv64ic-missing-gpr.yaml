# UNSUPPORTED: riscv-snippy-model-None
# COM: test checks that if some GPR is missing we report an error

# RUN: not llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+c \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/initial_state_rv64i-missing-gpr.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml \
# RUN: |& FileCheck %s

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

# CHECK: initial_state_rv64i-missing-gpr.yaml:3:3: error: Non-consecutive register group detected starting from X26
