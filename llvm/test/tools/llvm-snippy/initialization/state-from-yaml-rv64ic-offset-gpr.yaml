# UNSUPPORTED: riscv-snippy-model-None
# COM: test checks that if we have 32 GPR, but they somehow use incorrect
# COM: names (like [X2 - X33]) we still detect an error

# RUN: not llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+c \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/initial_state_rv64i-offset-gpr.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml \
# RUN: |& FileCheck %s

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

# CHECK: initial_state_rv64i-offset-gpr.yaml:3:3: error: Register group "X" does not start with X0
