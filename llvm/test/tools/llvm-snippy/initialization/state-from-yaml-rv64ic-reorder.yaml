# UNSUPPORTED: riscv-snippy-model-None
# COM: test checks that reordered inputs can be read properly (no FP, no RVV)

# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+c \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/initial_state_rv64i-reorder.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml
# RUN: FileCheck %s --input-file %t.regs.yaml

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

# CHECK: registers:
# CHECK-NEXT:  - [ X0, 0x0000000000000000 ]
# CHECK-NEXT:  - [ X1, 0x0B00000000000010 ]
# CHECK-NEXT:  - [ X2, 0x00C0000000000100 ]
