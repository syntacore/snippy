# UNSUPPORTED: riscv-snippy-model-None

# RUN: llvm-snippy %s \
# RUN:    -initial-regs-yaml=%S/Inputs/histogram_negative_big.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml
# RUN: FileCheck %s --input-file %t.regs.yaml

options:
  mtriple: riscv64
  mattr: +c
  num-instrs: 10
sections:
  - name: 1
    VMA: 0x800000
    SIZE: 0x4000
    LMA: 0x800000
    ACCESS: rx
  - name: 2
    VMA: 0x806000
    SIZE: 0x4000
    LMA: 0x806000
    ACCESS: rw
histogram:
  - [C_NOP, 1.0]

# CHECK: registers:
# CHECK-NEXT:  - [ X0, 0x0000000000000000 ]
# CHECK-NEXT:  - [ X1, 0x8000000000000001 ]
# CHECK-NEXT:  - [ X2, 0x8000000000000001 ]
# CHECK-NEXT:  - [ X3, 0x8000000000000001 ]
# CHECK-NEXT:  - [ X4, 0x8000000000000001 ]
