# UNSUPPORTED: riscv-snippy-model-None
# COM: Check that if there is a minus before the number in valuegram and radix is not equal to 10 - this is an error

# RUN: not llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+c \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/histogram_incorrect_value.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml \
# RUN: |& FileCheck %s

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

# CHECK: histogram_incorrect_value.yaml:15:10: error: Value '-0xFF' is negative, but the radix is not equal to 10
