# UNSUPPORTED: riscv-snippy-model-None
# COM: Check that specifying patterns in the register value histogram works

# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+m,+a,+f,+d,+c \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/histogram_patterns_rv64g.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml
# RUN: FileCheck %s --input-file %t.regs.yaml

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

