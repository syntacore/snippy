# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v,+c,+f,+d
  num-instrs: 100
  dump-mf: true
  init-regs-in-elf: true
  rvv-init-mode: loads
  verify-mi: true
  verify-gen-histogram: true
  histogram-must-succeed: true
  histogram-max-deviation: 2.5

sections:
    - name:      0
      VMA:       0x200000
      SIZE:      0x100000
      LMA:       0x200000
      ACCESS:    r
    - name:      1
      VMA:       0x400000
      SIZE:      0x100000
      LMA:       0x400000
      ACCESS:    rx
    - name:      2
      VMA:       0x600000
      SIZE:      0x100000
      LMA:       0x600000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

# CHECK: #===Simulation Start===
# CHECK: vl1re8.v
# CHECK-NEXT mem 0x0000000000200000
