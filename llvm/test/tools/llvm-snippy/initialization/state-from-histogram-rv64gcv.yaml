# UNSUPPORTED: riscv-snippy-model-None
# COM: Check that registers contain only values that were specified in the histogram

# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+m,+a,+f,+d,+c,+v \
# RUN:    -num-instrs=10 \
# RUN:    -initial-regs-yaml=%S/Inputs/histogram_rv64gv.yaml \
# RUN:    -dump-registers-yaml=%t.regs.yaml
# RUN: FileCheck %s --input-file %t.regs.yaml

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [C_NOP, 1.0]

