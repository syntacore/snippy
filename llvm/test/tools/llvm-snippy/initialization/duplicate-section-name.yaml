# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10

sections:
    - name:        name
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      name
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]

# CHECK: error: Incorrect list of sections: List contains duplicate section IDs
