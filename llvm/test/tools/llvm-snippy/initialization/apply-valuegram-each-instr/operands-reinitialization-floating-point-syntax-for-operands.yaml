# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/sections.yaml

options:
    mtriple: riscv64
    mattr: +f
    dump-mf: on
    num-instrs: 100

histogram:
    - [FADD_S, 1.0]

operands-reinitialization:
    - type: valuegram
      weight: 1.0
      opcodes:
        - "FADD_S":
            - type: operands
              values: [+0x1.0p-1f, -0.1h]

#          An example of what we're matching:
#                       _
#                      |      $x24 = LUI 258048, pcsections <0x561cca98cbc8>
#                      |      $f5_f = FMV_W_X $x24, pcsections <0x56292cc11bb8>
#                      |      $x4 = LUI 11, pcsections <0x56292cc11bb8>
# [+0x1.0p-1f, -0.1h] <       $x4 = ADDI $x4, -410, pcsections <0x56292cc11bb8>
#                      |      $f14_f = FMV_W_X $x4, pcsections <0x56292cc11bb8>
#                      |_     $f17_f = FADD_S $f5_f, $f14_f, 1

# CHECK: [[XREG1:\$x[0-9]+]] = LUI 258048{{.*[[:space:]].*}}[[FREG1:\$f[0-9]+_f]] = FMV_W_X [[XREG1]]{{.*[[:space:]].*}}[[XREG2:\$x[0-9]+]] = LUI 11{{.*[[:space:]].*}}[[XREG2]] = ADDI [[XREG2]], -410{{.*[[:space:]].*}}[[FREG2:\$f[0-9]+_f]] = FMV_W_X [[XREG2]]{{.*[[:space:]].*}}[[FREG3:\$f[0-9]+_f]] = FADD_S [[FREG1]], [[FREG2]]{{.*}}
