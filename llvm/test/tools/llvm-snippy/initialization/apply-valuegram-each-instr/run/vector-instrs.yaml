# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike
# COM: This test checks that before each instruction (RVV),
# COM: the registers it uses are initialized. They are initialized only according to the histogram.

# RUN: llvm-snippy %s \
# RUN:    -valuegram-operands-regs=%S/../Inputs/histograms.yaml \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: +v
  dump-mf: true
  num-instrs: 100
  valuegram-operands-regs-init-outputs: on
  rvv-init-mode: loads

sections:
    - name:      0
      VMA:       0x10000
      SIZE:      0x80000
      LMA:       0x10000
      ACCESS:    r
    - name:      1
      VMA:       0x100000
      SIZE:      0x1000000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x2100000
      SIZE:      0x100000
      LMA:       0x2100000
      ACCESS:    rw

riscv-vector-unit:
  mode-change-bias:
    P: 0.1
  mode-distribution:
    VM:
      - [all_ones, 2.0]
      - [any_legal, 1.0]
    VL:
      - [max_encodable, 2.0]
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_8: 1.0
        sew_16: 1.0
        sew_32: 1.0
        sew_64: 1.0
      LMUL:
          m8: 1.0
          m4: 1.0
          m2: 1.0
          m1: 1.0
          mf2: 1.0
          mf4: 1.0
          mf8: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0

histogram:
       - [VADD_VV, 1.0]
       - [VAADDU_VV, 1.0]
       - [VAADD_VV, 1.0]
       - [VAADD_VX, 1.0]
       - [VADC_VIM, 1.0]
       - [VADC_VXM, 1.0]
       - [VAND_VV, 1.0]
       - [VASUBU_VV, 1.0]
       - [VASUBU_VX, 1.0]
       - [VASUB_VV, 1.0]
       - [VASUB_VX, 1.0]
       - [VCPOP_M, 1.0]
       - [VDIVU_VV, 1.0]
       - [VDIVU_VX, 1.0]
       - [VDIV_VV, 1.0]
       - [VFADD_VV, 1.0]
       - [VFCLASS_V, 1.0]
       - [VFNMSAC_VV, 1.0]
       - [VXOR_VI, 1.0]
       - [VXOR_VV, 1.0]
       - [VXOR_VX, 1.0]

#          Valuegram values:
#                     X: 0, 1, 255.
#                     V: 3, 4.
#                     We want to see them in initialization
#
# We check that loading sequencies are present and that values from the histograms.yaml are encountered during model execution.
#
#          An example of what we're matching:
#                     $x22 = LUI 16, pcsections <0x56090117dcc8>
#                     $x22 = ADDIW $x22, 128, pcsections <0x56090117dcc8>
#                     $v6 = VL1RE8_V $x22, pcsections <0x56090117dcc8>

# COM: All instructions in histogram have at least 1 input and 1 output vector register and
# COM: we should see a value from the valuegram once per operand initialization.

# CHECK-COUNT-200: [[REG:\$x[0-9]+]] = LUI{{.+[[:space:]]+}}[[REG]] = ADDI [[REG]]{{.+[[:space:]]+\$v[0-9]+}} = VL1RE8_V [[REG]]
# CHECK: ===Simulation Start===
# CHECK-COUNT-200: 0x0000000000000000000000000000000{{3|4}}
