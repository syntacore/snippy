# RUN: llvm-snippy %s -mtriple=riscv64 \
# RUN:     |& FileCheck %s --check-prefix=MARCH-AS-TRIPLE
# RUN: llvm-snippy %s -mtriple=riscv64
# RUN: not llvm-snippy %s -march=rv64i |& FileCheck %s --check-prefix=NO-TRIPLE

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]

# MARCH-AS-TRIPLE: warning:
# NO-TRIPLE: warning:
# NO-TRIPLE-SAME: 'march' specified without 'mtriple': deduced triple is "{{.*}}"
# NO-TRIPLE: error: Invalid march: march "rv64i" is not implemented for the given target
