# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s -dump-mi -seed=0 -num-instrs=150 -last-instr= \
# RUN: | FileCheck %s

# RUN: llvm-snippy %s -dump-mi -seed=1 -num-instrs=150 -last-instr= \
# RUN: | FileCheck %s

# RUN: llvm-snippy %s -dump-mi -seed=1673611405 -num-instrs=150 -last-instr= \
# RUN: | FileCheck %s

# RUN: llvm-snippy %s -verbose -seed=0 \
# RUN: |& FileCheck %s --check-prefix=SEED-0
# RUN: llvm-snippy %s -verbose -seed=300 \
# RUN: |& FileCheck %s --check-prefix=SEED-300

# RUN: not llvm-snippy %s \
# RUN:     -seed=14u >& %t
# RUN: FileCheck %s --input-file=%t --check-prefix=WRONG-SEED1

# RUN: not llvm-snippy %s \
# RUN:     -seed=1.4 >& %t
# RUN: FileCheck %s --input-file=%t --check-prefix=WRONG-SEED2

# RUN: not llvm-snippy %s \
# RUN:     -seed=-1 >& %t
# RUN: FileCheck %s --input-file=%t --check-prefix=WRONG-SEED3

# RUN: llvm-snippy %s -seed= \
# RUN: |& FileCheck %s --check-prefix=RAND-SEED

options:
  mtriple: riscv64

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram: 
    - [ADD, 1.0]
    - [ADDI, 1.0]
      
# CHECK-COUNT-150: {{(\$x[0-9]+ = \ADD \$x[0-9]+\, \$x[0-9]+)|(\$x[0-9]+ = \ADDI \$x[0-9]+\, (-)?[0-9]+)}} 
# CHECK-NEXT: $x0 = ADDI $x0, 0, post-instr-symbol <mcsymbol __snippy_exit>  

# SEED-0: Used seed: 0
# SEED-300: Used seed: 300
# WRONG-SEED1: error: Provided instructions seed is not convertible to numeric value.
# WRONG-SEED2: error: Provided instructions seed is not convertible to numeric value.
# WRONG-SEED3: error: Provided instructions seed is not convertible to numeric value.
# RAND-SEED: warning: (seed-not-specified) no instructions seed specified, using auto-generated one: {{[0-9]+$}}
