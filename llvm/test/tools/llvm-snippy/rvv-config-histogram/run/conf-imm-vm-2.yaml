# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike

# COM: This test checks that only compatible with VL::max_encodable=4 immediate 
#      VMs are encountered.

# RUN: llvm-snippy %s -model-plugin spike \ 
# RUN: |& FileCheck %s 

options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: +v
  dump-mf: true
  riscv-dump-rvv-config: ""
  num-instrs: 10000

include:
- "../Inputs/sections.yaml"

riscv-vector-unit:
  mode-distribution:
    VM:
      - [15, 1.0] #  0b1111
      - [10, 1.0] #  0b1010
      - [16, 1.0] # 0b10000
    VL:
      - [max_encodable, 1.0] 
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0
 
histogram:
       - [VSETIVLI, 1.0]
       - [VADD_VV, 1.0]
         
# CHECK:       - VL Selection Rules:
# CHECK-NEXT:    P: 1 <max_encodable>
# CHECK-NEXT:  - VM Selection Rules:
# CHECK-NEXT:    P: 0.5 <imm_15>
# CHECK-NEXT:    P: 0.5 <imm_10>

# 15
# CHECK: v0  0x0000000000000000000000000000000f
# 10
# CHECK: v0  0x0000000000000000000000000000000a
# 16
# CHECK-NOT: v0  0x00000000000000000000000000000010

