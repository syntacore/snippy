# RUN: not llvm-snippy %s -mtriple=riscv64 -model-plugin None |& FileCheck %s
# RUN: not llvm-snippy %s -mtriple=riscv32 -model-plugin None |& FileCheck %s

# CHECK: error: Failed to get GP for jump table creation: ROM section is not configured

options:
    mattr: +zcmt
    num-instrs: 100
    function-layers: 3
    function-number: 9
    num-instr-ancil: 10

include:
  - ../Inputs/sections-with-stack.yaml

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [CM_JALT, 10.0]

