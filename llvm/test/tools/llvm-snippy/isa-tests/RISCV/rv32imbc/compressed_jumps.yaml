# RUN: llvm-snippy --model-plugin=None %s

sections:
  - name:      text
    VMA:       0x80040000
    SIZE:      0x800
    LMA:       0x80040000
    ACCESS:    rx
  - name:      data
    VMA:       0x800A0000
    SIZE:      0x10000
    LMA:       0x800A0000
    ACCESS:    rw
  - name:      stack
    VMA:       0x800B0000
    SIZE:      0x10000
    LMA:       0x800B0000
    ACCESS:    rw
  - name:      rodata
    VMA:       0x800C0000
    SIZE:      0x10000
    LMA:       0x800C0000
    ACCESS:    r

options:
    mtriple: "riscv32"
    mcpu: generic-rv32
    march: "rv32imc_zba_zbb_zbc_zbs_zicsr"
    preserve-ra: true
    num-instrs: 100
    init-memory: full
    redefine-ra: RA
    function-number: 3
    function-layers: 3
    enable-static-stack: false

histogram:
  - [PseudoC_JRB, 5.0]
  - [C_JAL, 5.0]
  - [C_JALR, 5.0]
