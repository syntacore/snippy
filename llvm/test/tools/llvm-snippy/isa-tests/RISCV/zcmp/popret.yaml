# COM: This test checks that popret instructions are generated.
# RUN: llvm-snippy %s -mtriple=riscv64 -model-plugin None |& FileCheck %s
# RUN: llvm-snippy %s -mtriple=riscv32 -model-plugin None |& FileCheck %s

options:
  num-instrs: 1000
  mattr: +zcmp
  honor-target-abi: on
  function-number: 40
  function-layers: 5
  redefine-sp: SP
  dump-mf: on

include:
  - ../Inputs/sections-with-stack.yaml

histogram:
  - [CM_POPRET, 1.0]
  - [CM_POPRETZ, 1.0]
  - [JAL, 1.0]
  - [ADD, 1.0]

# CHECK-COUNT-3: CM_POPRETZ
# CHECK-COUNT-3: CM_POPRET

