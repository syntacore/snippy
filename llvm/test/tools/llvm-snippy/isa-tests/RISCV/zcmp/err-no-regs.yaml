# RUN: not llvm-snippy %s -model-plugin None \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 1000
  mattr: +zcmp
  # Reserve all except X10 and X11
  reserved-regs-list: [X0,X2,X3,X4,X5,X6,X7,X8,X9,X12,X13,X14,X15,X16,X17,X18,X19,X20,X21,X22,X23,X24,X25,X26,X27,X28,X29,X30,X31]

include:
  - ../Inputs/sections-with-stack.yaml

histogram:
  # This instruction overwrites registers X10 and X11, so they cannot be used
  # as SP and RA
  - [CM_MVA01S, 1.0]

# CHECK: error: No available register: stack pointer

