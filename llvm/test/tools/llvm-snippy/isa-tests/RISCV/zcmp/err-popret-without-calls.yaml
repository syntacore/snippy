# RUN: not llvm-snippy %s -model-plugin None |& FileCheck %s

options:
  march: riscv64
  num-instrs: 1000
  honor-target-abi: on
  mattr: +zcmp
  redefine-sp: SP

include:
  - ../Inputs/sections-with-stack.yaml

histogram:
  - [CM_POPRET, 1.0]
  - [ADD, 1.0]

# CHECK: error: The generation CM_POPRET and CM_POPRETZ instructions from the Zcmp extension without calls is not possible.

