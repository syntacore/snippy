# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s |& FileCheck %s

include:
  - Inputs/full.yaml

options:
  mtriple: riscv64
  dump-mf: true
  num-instrs: 150

# CHECK-COUNT-149: {{(\$x[0-9]+ = ADD \$x[0-9]+, \$x[0-9]+)|(\$x[0-9]+ = ADDI \$x[0-9]+, (-)?[0-9]+)}}
# CHECK: EBREAK
# CHECK-NOT: {{(\$x[0-9]+ = ADD \$x[0-9]+, \$x[0-9]+)|(\$x[0-9]+ = ADDI \$x[0-9]+, (-)?[0-9]+)}}
