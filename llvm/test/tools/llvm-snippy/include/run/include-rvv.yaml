# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv

# COM: this is the test for checking the possibility to include rvv-config
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --num-instrs=10 |& FileCheck %s

include:
  - ../Inputs/rvv-unit-all.yaml

sections:
  - name:      3
    VMA:       0x7ffff000
    SIZE:      0x1000
    LMA:       0x7ffff000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:

    - [VSETIVLI, 1.0]
    - [VSETVLI, 1.0]
    - [VSETVL, 1.0]
    - [VADD_VV, 1.0]

# CHECK: #===Simulation Start===
