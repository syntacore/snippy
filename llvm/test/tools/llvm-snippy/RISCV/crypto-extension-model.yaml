# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s

include:
  - Inputs/sections.yaml

options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: "+zbkb,+zbkc,+zbkx,+zknd,+zkne,+zknh,+zksed,+zksh,+zkr,+zkn,+zks,+zkt"
  num-instrs: 400
  dump-mf: true

histogram:
  - [ BREV8, 1.0 ]
  - [ PACK, 1.0 ]
  - [ PACKH, 1.0 ]
  - [ PACKW, 1.0 ]
  - [ XPERM4, 1.0 ]
  - [ XPERM8, 1.0 ]
  - [ AES64DS, 1.0 ]
  - [ AES64DSM, 1.0 ]
  - [ AES64ES, 1.0 ]
  - [ AES64ESM, 1.0 ]
  - [ AES64IM, 1.0 ]
  - [ AES64KS1I, 1.0 ]
  - [ AES64KS2, 1.0 ]
  - [ ANDN, 1.0 ]
  - [ CLMUL, 1.0 ]
  - [ CLMULH, 1.0 ]
  - [ ORN, 1.0 ]
  - [ ROL, 1.0 ]
  - [ ROLW, 1.0 ]
  - [ ROR, 1.0 ]
  - [ RORI, 1.0 ]
  - [ RORIW, 1.0 ]
  - [ RORW, 1.0 ]
  - [ SHA256SIG0, 1.0 ]
  - [ SHA256SIG1, 1.0 ]
  - [ SHA256SUM0, 1.0 ]
  - [ SHA256SUM1, 1.0 ]
  - [ SHA512SIG0, 1.0 ]
  - [ SHA512SIG1, 1.0 ]
  - [ SHA512SUM0, 1.0 ]
  - [ SHA512SUM1, 1.0 ]
  - [ SM3P0, 1.0 ]
  - [ SM3P1, 1.0 ]
  - [ SM4ED, 1.0 ]
