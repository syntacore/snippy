# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --num-instrs=10 -o %t \
# RUN:  -riscv-dump-rvv-config \
# RUN: |& FileCheck %s

# COM: With -riscv-rvv-use-uniform-distribution and no explicit riscv-vector-unit, the
# COM: default configuration space is broadened from the single { e64, m1, tu,
# COM: mu, vxrm: rnu } bag to a uniform set of SEW/LMUL/VL/VM/
# COM: vxrm configurations. This documents the flag behaviour used to strengthen
# COM: the test suite while keeping the user-facing default unchanged.

include:
  - ../Inputs/rvv-sections.yaml

histogram:
    - [VSETIVLI, 1.0]
    - [VSETVLI, 1.0]
    - [VSETVL, 1.0]
    - [VADD_VV, 1.0]

# CHECK: --- RVV Configuration Info ---
# CHECK:  - VL Selection Rules:
# CHECK:    P: 1 <any_legal>
# CHECK:  - VM Selection Rules:
# CHECK:    P: 1 <any_legal>
# CHECK:  - Configuration Bag Listing:
# CHECK-DAG: Conf: { e8, m1, tu, mu, vxrm: rnu }
# CHECK-DAG: Conf: { e32, mf2, ta, ma, vxrm: rne }
# CHECK-DAG: Conf: { e64, m8, tu, mu, vxrm: rnu }
# CHECK:  - Configuration Bag Size: 352
# CHECK: --- RVV Configuration End  ---
