# REQUIRES: riscv-rvv
# COM: This test checks that if all vlmax values > max possible value for
#      VSETIVLI (31), vlmax generator is discarded.

# RUN: not llvm-snippy %s \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10

include:
- "Inputs/sections.yaml"

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [vlmax, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m8: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
       - [VSETIVLI, 1.0]
       - [VADD_VV, 1.0]

# CHECK: error: riscv-vector-unit: Could not find any applicable VL generators
