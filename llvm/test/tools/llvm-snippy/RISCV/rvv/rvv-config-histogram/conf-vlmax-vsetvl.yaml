# REQUIRES: riscv-rvv
# COM: This test checks that VSETVL works fine with vlmax generator
#      when we have VL value greater than 31.

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100
  dump-mf: on

include:
- Inputs/sections.yaml

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [vlmax, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_16: 1.0
      LMUL:
        m8: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
       - [VSETVL, 1.0]
       - [VADD_VV, 1.0]

# vlmax = VLEN * LMUL / SEW = 128 * 8 / 16 = 64 > 31
