# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s -riscv-dump-rvv-config \
# RUN: |& FileCheck %s

# COM: this just ensures that we still have proper execution
# RUN: llvm-snippy %s -riscv-dump-rvv-config

# RUN: llvm-snippy %s -riscv-dump-rvv-config=%t.rvv.config.info
# RUN: FileCheck --input-file=%t.rvv.config.info %s

# COM: this just ensures that we still have proper execution
# RUN: llvm-snippy %s -riscv-dump-rvv-config=%t.rvv.config.info

include:
  - ../Inputs/rvv-sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10

histogram:

    - [VSETIVLI, 1.0]
    - [VSETVLI, 1.0]
    - [VSETVL, 1.0]
    - [VADD_VV, 1.0]

# CHECK: --- RVV Configuration Info ---
# CHECK:  - VL Selection Rules:
# CHECK:    P: 1 <any_legal>
# CHECK:  - VM Selection Rules:
# CHECK:    P: 1 <any_legal>
# CHECK:  - Configuration Bag Listing:
# CHECK-DAG: Conf: { e8, m1, tu, mu, vxrm: rnu }
# CHECK-DAG: Conf: { e32, mf2, ta, ma, vxrm: rne }
# CHECK-DAG: Conf: { e64, m8, tu, mu, vxrm: rnu }
# CHECK:  - Configuration Bag Size: 352
# CHECK: --- RVV Configuration End  ---
