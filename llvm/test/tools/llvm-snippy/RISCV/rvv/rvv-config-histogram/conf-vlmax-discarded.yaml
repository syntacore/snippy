# REQUIRES: riscv-rvv
# COM: This test checks that if all vlmax values > max possible value for
#      VSETIVLI (31), vlmax generator is discarded.

# RUN: llvm-snippy %s \
# RUN:     -riscv-dump-discarded-rvv-configurations=%t_rvv.discarded \
# RUN: |& FileCheck --check-prefix=NO_VLMAX %s
# RUN: FileCheck --input-file=%t_rvv.discarded %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100
  riscv-dump-rvv-config: ""

include:
- Inputs/sections.yaml

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [vlmax, 1.0]
      - [max_encodable, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m8: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
       - [VSETIVLI, 1.0]
       - [VADD_VV, 1.0]

# <vlmax> discarded because vlmax = VLEN * LMUL / SEW = 128 * 8 / 32 = 32 > 31
# CHECK:      --- RVV Unit Discarded Info ---
# CHECK-NEXT:   - VM Generators:
# CHECK-NEXT:   - VL Generators:
# CHECK-NEXT:     <vlmax>
# CHECK-NEXT:   - Configuration Bag Listing:
# CHECK-NEXT: --- RVV Unit Discarded End  ---

# NO_VLMAX:       - VL Selection Rules:
# NO_VLMAX-NEXT:    P: 1 <max_encodable>
# NO_VLMAX-NEXT:  - VM Selection Rules:

