# REQUIRES: riscv-rvv
# COM: This test checks that if all VMs are not compatible with all VLs, this 
#      is an error.

# RUN: not llvm-snippy %s \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: +v
  num-instrs: 100

include:
- "Inputs/sections.yaml"

riscv-vector-unit:
  mode-distribution:
    VM:
      - [48, 1.0] # 0b110000
      - [47, 1.0] # 0b101111
    VL:
      - [5, 1.0] 
      - [4, 1.0] 
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m8: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0
 
histogram:
       - [VADD_VV, 1.0]
       - [VSETVL, 1.0]

# CHECK: error: riscv-vector-unit: Could not find any applicable VL generators
