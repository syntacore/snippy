# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s -mattr=+v,+zvknha
# RUN: llvm-snippy %s -mattr=+v,+zvknhb

options:
  mtriple: riscv64
  num-instrs: 1000
  init-regs-in-elf: true
  verify-mi: true
  verify-gen-histogram: true

include:
- ../../../Inputs/memory-unaligned.yaml
- ../rvv-config-histogram/Inputs/rvv-unit-sew_32-m1-max_encodable.yaml
sections:
  - name:      0
    VMA:       0x8000
    SIZE:      0x4000
    LMA:       0x8000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:
  - [VMV1R_V, 1.0]
  - [VMV2R_V, 1.0]
  - [VMV4R_V, 1.0]
  - [VMV8R_V, 1.0]
  - [VMV_V_V, 1.0]
  - [VSHA2CH_VV, 1.0]
  - [VSHA2CL_VV, 1.0]
  - [VSHA2MS_VV, 1.0]
  - [VSETVL, 0.1]
