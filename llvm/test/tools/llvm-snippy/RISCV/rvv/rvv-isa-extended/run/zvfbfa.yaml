# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-snippy-model-spike
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v,+experimental-zvfbfa \
# RUN:  -o %t --num-instrs=1000 --init-regs-in-elf \
# RUN:  |& FileCheck %s

sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x10000
    ACCESS: rw
  - name: 3
    VMA: 0x30000
    LMA: 0x30000
    SIZE: 0x1000
    ACCESS: r

histogram:
  - [VFADD_VV, 1.0]
  - [VFADD_VF, 1.0]
  - [VFSUB_VV, 1.0]
  - [VFMUL_VV, 1.0]
  - [VFWMACC_VV, 1.0]
  - [VFWMACC_VF, 1.0]
  - [VFMIN_VV, 1.0]
  - [VFSGNJ_VV, 1.0]
  - [VMFEQ_VV, 1.0]
  - [VFCLASS_V, 1.0]
  - [VFMERGE_VFM, 1.0]
  - [VFMV_V_F, 1.0]
  - [VFWCVT_F_F_V, 1.0]
  - [VFNCVT_F_F_W, 1.0]
  - [VFNCVT_XU_F_W, 1.0]
  - [VFRSQRT7_V, 1.0]
  - [VFMV_F_S, 1.0]
  - [VFSLIDE1UP_VF, 1.0]
  - [VSETVL, 1.0]

riscv-vector-unit:
  mode-change-bias:
    P: deduced
  mode-distribution:
    VM:
      - [all_ones, 2.0]
      - [any_legal, 1.0]
    VL:
      - [max_encodable, 2.0]
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_16: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0

# CHECK: #===Simulation Start===