# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  mattr: +v,+zvfhmin
  num-instrs: 100
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
- ../../rvv-config-biased/Inputs/rvv-unit-all.yaml

sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x10000
    ACCESS: rw
  - name: 3
    VMA: 0x30000
    LMA: 0x30000
    SIZE: 0x1000
    ACCESS: r

histogram:
  - [VFNCVT_F_F_W, 1.0]
  - [VFWCVT_F_F_V, 1.0]
