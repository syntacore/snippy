# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  mattr: +v,+zvbc
  num-instrs: 1000
  init-regs-in-elf: true
  verify-mi: true
  verify-gen-histogram: true
  histogram-max-deviation: 5

include:
- ../../../Inputs/memory-unaligned.yaml
- ../rvv-config-histogram/Inputs/rvv-unit-all.yaml

sections:
  - name:      0
    VMA:       0x8000
    SIZE:      0x4000
    LMA:       0x8000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
  - [VMV1R_V, 1.0]
  - [VMV2R_V, 1.0]
  - [VMV4R_V, 1.0]
  - [VMV8R_V, 1.0]
  - [VMV_V_V, 1.0]
  - [VCLMUL_VV, 1.0]
  - [VCLMUL_VX, 1.0]
  - [VCLMULH_VV, 1.0]
  - [VCLMULH_VX, 1.0]
  - [VSETVL, 2.0]
