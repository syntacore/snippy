# REQUIRES: riscv-snippy-model-any
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10
  init-regs-in-elf: true
  entry-point: start
  selfcheck: 1
  enable-selfcheck-rvv: true
  rvv-init-mode: loads

include:
- "../../../Inputs/memory-unaligned.yaml"
- Inputs/rvv-unit-sew_16-m2.yaml

sections:
  - name:      0
    VMA:       0x2000000
    SIZE:      0x1000000
    LMA:       0x2000000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x81000000
    SIZE:      0x100000
    LMA:       0x81000000
    ACCESS:    rw
histogram:
    - [VLOXEI32_V, 1.0]


