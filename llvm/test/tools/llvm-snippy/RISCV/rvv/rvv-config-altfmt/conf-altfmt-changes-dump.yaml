# REQUIRES: riscv-snippy-model-None
# REQUIRES: riscv-rvv
# COM: This test verifies that requesting `sew_16alt` (always bfloat16
# COM: elements, vtype altfmt bit set) with probability 1.0 actually changes the
# COM: generated machine function.
# COM:
# COM: With `-mattr=+experimental-zvfbfa` and SEW=16/LMUL=1/VTA=tu/VMA=mu, the
# COM: altfmt (vtype bit 8, value 0x100) is only emitted when SEW is `sew_16alt`.
# COM: The resulting vtype immediate differs between the two configs:
# COM:   sew_16alt -> 0x108 == 264 (altfmt bit set)
# COM:   sew_16    -> 0x008 == 8   (altfmt bit cleared)
# COM: We therefore require 264 to be present in the dump-mf trace for the
# COM: `sew_16alt` config, and to be absent for the `sew_16` config.

# RUN: sed -e s/@SEW@/sew_16alt/ %s > %t.on.yaml
# RUN: llvm-snippy %t.on.yaml %S/../rvv-config-histogram/Inputs/sections.yaml \
# RUN:   --seed=12345 --dump-mf |& FileCheck %s --check-prefix=CHECK-ON
# RUN: sed -e s/@SEW@/sew_16/ %s > %t.off.yaml
# RUN: llvm-snippy %t.off.yaml %S/../rvv-config-histogram/Inputs/sections.yaml \
# RUN:   --seed=12345 --dump-mf |& FileCheck %s --check-prefix=CHECK-OFF

options:
  mtriple: riscv64
  mattr: +v,+experimental-zvfbfa
  num-instrs: 40

riscv-vector-unit:
  mode-change-bias:
    P: deduced
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [max_encodable, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        @SEW@: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VFADD_VV, 1.0]
    - [VSETVL, 1.0]

# COM: vtype with the altfmt bit set (0x108) is loaded before the mode change.
# CHECK-ON: ADDI $x0, 264
#
# COM: Without altfmt the vtype is 0x008 (== 8), so the altfmt immediate must not
# COM: appear in the generated machine function.
# CHECK-OFF-NOT: ADDI $x0, 264