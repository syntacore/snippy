# COM: SEW must have at least one positive weight. Setting `sew_16alt` (and all
# COM: other SEW variants) to zero is invalid.
#
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../rvv-config-histogram/Inputs/sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100

riscv-vector-unit:
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_16: 0.0
        sew_16alt: 0.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VADD_VV, 0.1]
    - [VSETVL, 1.0]

# CHECK: error: SEW: at least one weight must be positive!