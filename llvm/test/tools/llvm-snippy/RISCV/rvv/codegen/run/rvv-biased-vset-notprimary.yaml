# REQUIRES: riscv-snippy-model-any
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100
  histogram-must-succeed: false
  verify-gen-histogram: true

include:
- ../Inputs/rvv-lmul1-sew32-vlany.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
    - [VADD_VV, 1.0]

# CHECK-COUNT-90: vadd.vv
