# REQUIRES: riscv-rvv
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  -o %t --num-instrs=1000 \
# RUN:  --init-regs-in-elf --verify-mi \
# RUN:  --entry-point=start \
# RUN:  -rvv-init-mode=loads

include:
- ../Inputs/rvv-lmul1-sewX-nobias.yaml

sections:
  - name:      0
    VMA:       0x2000000
    SIZE:      0x1000000
    LMA:       0x2000000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VSETIVLI, 1.0]
    - [VSETVL, 1.0]
    - [VSETVLI, 1.0]
