# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
- Inputs/rvv-unit-all.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:
    - [VADD_VV, 1.0]

# CHECK: error: Failed to allocate global constant for RVV register value load: 
# CHECK-SAME: ROM section is not configured
