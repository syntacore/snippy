# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

# XFAIL: *

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([2-9]|1[0-9]|2[0-9]|3[0-1])"]

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-lmul1.yaml

histogram:
  - [VMSEQ_VV, 1.0]
  - [VMSNE_VV, 1.0]
  - [VMFEQ_VV, 1.0]
  - [VMFGT_VF, 1.0]

# FIXME: It's not possible now, but we have to be able to do it.
# CHECK-DAG: $v0 = VMSEQ_VV $v{{.*}}, $v{{.*}}, $v0
# CHECK-DAG: $v0 = VMSNE_VV $v{{.*}}, $v{{.*}}, $v0
# CHECK-DAG: $v0 = VMFEQ_VV $v{{.*}}, $v{{.*}}, $v0
# CHECK-DAG: $v0 = VMFGT_VF $v{{.*}}, $f{{.*}}, $v0
