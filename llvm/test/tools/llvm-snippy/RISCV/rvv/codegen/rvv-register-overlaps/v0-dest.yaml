# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([2-9]|1[0-9]|2[0-9]|3[0-1])"]

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-lmul1.yaml

histogram:
  - [VADD_VV, 1.0]

# COM: Check that v0 can be destination.
# CHECK-DAG: $v0 = VADD_VV $v0, $v0, $noreg
# CHECK-DAG: $v1 = VADD_VV $v1, $v1, $noreg
