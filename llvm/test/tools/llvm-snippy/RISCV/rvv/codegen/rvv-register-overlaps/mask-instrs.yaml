# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([2-9]|1[0-9]|2[0-9]|3[0-1])"]

include:
  - Inputs/sections.yaml
  - Inputs/rvv-unit-lmul1.yaml

histogram:
  - [VIOTA_M, 1.0]
  - [VMSIF_M, 1.0]
  - [VMSOF_M, 1.0]
  - [VMSBF_M, 1.0]
  - [VCPOP_M, 1.0]
  - [VFIRST_M, 1.0]

# COM: Check that source register groups can overlaps with v0, because EEW = 1.
# CHECK-DAG: VIOTA_M $v0, $v0
# CHECK-DAG: VMSIF_M $v0, $v0
# CHECK-DAG: VMSOF_M $v0, $v0
# CHECK-DAG: VMSBF_M $v0, $v0
# CHECK-DAG: VCPOP_M $v0, $v0
# CHECK-DAG: VFIRST_M $v0, $v0
