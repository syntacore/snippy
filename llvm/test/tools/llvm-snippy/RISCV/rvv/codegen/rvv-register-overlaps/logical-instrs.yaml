# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([2-9]|1[0-9]|2[0-9]|3[0-1])"]

include:
  - Inputs/sections.yaml
  - ../Inputs/rvv-unit-all.yaml

histogram:
  - [VMAND_MM, 1.0]
  - [VMNAND_MM, 1.0]
  - [VMANDN_MM, 1.0]
  - [VMXOR_MM, 1.0]
  - [VMOR_MM, 1.0]
  - [VMNOR_MM, 1.0]
  - [VMORN_MM, 1.0]
  - [VMXNOR_MM, 1.0]

# COM: Check that v0 can be destination.
# CHECK-DAG: $v0 = VMAND_MM $v0, $v0
# CHECK-DAG: $v0 = VMXOR_MM $v0, $v0
# CHECK-DAG: $v0 = VMXNOR_MM $v0, $v0
# CHECK-DAG: $v0 = VMNAND_MM $v0, $v0
