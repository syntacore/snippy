# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([0-9]|1[0-9]|2[0-9])"]

include:
  - Inputs/sections.yaml

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
        sew_16: 1.0
      LMUL:
        m4: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
  - [VSETIVLI, 1.0]
  - [VFMV_F_S, 1.0]
  - [VFMV_S_F, 1.0]
  - [VMV_X_S, 1.0]
  - [VMV_S_X, 1.0]

# COM: Check that for Scalar Move Instructions EMUL = 1.
# CHECK-DAG: VFMV_F_S $v30
# CHECK-DAG: $v30 = VFMV_S_F
# CHECK-DAG: VMV_X_S $v30
# CHECK-DAG: $v30 = VMV_S_X
