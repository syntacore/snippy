# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike
# COM: This test verifies that rvv-init-mode=slides works fine
# COM: with illegal RVV modes (Pvill=1).

# RUN: llvm-snippy %s

include:
- "../rvv-config-biased/Inputs/rvv-unit-pvill-1.yaml"

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  init-regs-in-elf: true
  rvv-init-mode: slides

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
# COM: Legal when vill install
    - [VL1RE16_V, 1.0]
    - [VL1RE32_V, 1.0]
    - [VL1RE64_V, 1.0]
    - [VL1RE8_V, 1.0]
    - [VS1R_V, 1.0]
    - [VS2R_V, 1.0]
    - [VS4R_V, 1.0]
    - [VS8R_V, 1.0]
