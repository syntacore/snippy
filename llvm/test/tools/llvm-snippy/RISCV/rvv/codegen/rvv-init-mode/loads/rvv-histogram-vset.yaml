# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  init-regs-in-elf: true
  verify-mi: true
  entry-point: start
  verify-gen-histogram: true
  histogram-must-succeed: false
  rvv-init-mode: loads

include:
- ../../Inputs/rvv-lmul1-sewX-nobias.yaml

sections:
  - name:      0
    VMA:       0x2000000
    SIZE:      0x1000000
    LMA:       0x2000000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VSETIVLI, 1.0]
    - [VSETVL, 1.0]
    - [VSETVLI, 1.0]
# CHECK-NOT: Machine Verifier Pass report
# CHECK: Start Verification for function: start:
# CHECK: End Verification for function: start
