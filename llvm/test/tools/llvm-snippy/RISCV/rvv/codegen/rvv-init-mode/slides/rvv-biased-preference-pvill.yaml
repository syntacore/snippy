# COM: This test just checks that option
# COM: "riscv-preference-for-rvv-mode-change" works with the pvill setting.

# RUN: llvm-snippy %s \
# RUN:   --riscv-preference-for-rvv-mode-change=vsetvl \
# RUN: |& FileCheck %s --check-prefix=CHECK-VSETVL

# RUN: llvm-snippy %s \
# RUN:   --riscv-preference-for-rvv-mode-change=vsetvli \
# RUN: |& FileCheck %s --check-prefix=CHECK-VSETVLI

# RUN: llvm-snippy %s \
# RUN:   --riscv-preference-for-rvv-mode-change=vsetivli \
# RUN: |& FileCheck %s --check-prefix=CHECK-VSETIVLI

# RUN: llvm-snippy %s \
# RUN:   --riscv-preference-for-rvv-mode-change=any \
# RUN: |& FileCheck %s --check-prefix=CHECK-ANY

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  rvv-init-mode: slides
  dump-mf: on

include:
- "../../../rvv-config-biased/Inputs/rvv-unit-pvill-1.yaml"

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
    - [VL1RE16_V, 1.0]

# CHECK-VSETVL: VL1RE16_V
# CHECK-VSETVL: VSETVL
# CHECK-VSETVL-NOT: VSETIVLI
# CHECK-VSETVL-NOT: VSETVLI

# CHECK-VSETVLI: VL1RE16_V
# CHECK-VSETVLI: VSETVLI
# CHECK-VSETVLI-NOT: VSETIVLI
# CHECK-VSETVLI-NOT: {{VSETVL }}

# CHECK-VSETIVLI: VL1RE16_V
# CHECK-VSETIVLI: VSETIVLI
# CHECK-VSETIVLI-NOT: VSETVL
# CHECK-VSETIVLI-NOT: VSETVLI

# CHECK-ANY: VL1RE16_V
# CHECK-ANY: VSETIVLI
# CHECK-ANY: VSETVL
# CHECK-ANY: VSETVLI
