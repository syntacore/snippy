# REQUIRES: riscv-snippy-model-None
# COM: the test checks for bias-based RVV mode switches

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  dump-mf: true
  num-instrs: 10000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
- Inputs/rvv-lmul1-sewX-nobias.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VADD_VV, 1.0]
    - [VSETVL, 1.0]

# CHECK: VSETVL $x
# CHECK-NOT: VSETVLI
# CHECK-NOT: VSETIVLI
