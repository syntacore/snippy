# COM: This test checks that if there is no opcodes available for any rvv mode
# and configurations are generated in histogram mode, then this is not an error.

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v,+d
  num-instrs: 100
  dump-mf: on
  riscv-dump-rvv-config: ""

include:
  - ../Inputs/rvv-sections.yaml

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rdn: 1.0
    VTYPE:
     SEW:
       sew_8: 1.0
       sew_16: 1.0
     LMUL:
       m1: 1.0
     VMA:
       mu: 1.0
     VTA:
       tu: 1.0

histogram:
  - [VFADD_VF, 1.0]
  - [VSETIVLI, 1.0]

# CHECK: Conf: { e8
# CHECK: Conf: { e16

# CHECK-NOT: VFADD_VF
# CHECK: VSETIVLI
# CHECK-NOT: VFADD_VF
