# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10000
  verify-gen-histogram: true
  histogram-must-succeed: true

include:
- Inputs/rvv-unit-all.yaml

sections:
  - name:      0
    VMA:       0x10
    SIZE:      0x40
    LMA:       0x10
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:
    - [VADD_VV, 1.0]

# CHECK: error: Failed to create global constant (This is needed for updating of RVV register): 
# CHECK-SAME: Out of space when allocating 16 bytes (align 16) in section '0' of size 64. 16 bytes overflow
# CHECK-NEXT: Please, provide more space in specified section or select another section to emit global constants to. 
