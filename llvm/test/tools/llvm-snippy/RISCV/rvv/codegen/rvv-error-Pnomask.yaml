# REQUIRES: riscv-snippy-model-None
# RUN: sed -e s/PROB/-1/ %s > %t.1.yaml
# RUN: not llvm-snippy %t.1.yaml \
# RUN: |& FileCheck %s

# RUN: sed -e s/PROB/1.3/ %s > %t.2.yaml
# RUN: not llvm-snippy %t.2.yaml \
# RUN: |& FileCheck %s

# RUN: sed -e s/PROB/lala/ %s > %t.3.yaml
# RUN: not llvm-snippy %t.3.yaml \
# RUN: |& FileCheck %s --check-prefix=NOT-FP

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000

riscv-vector-unit:
  mode-change-bias:
    P: 0.1
    Pnomask: PROB
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [max_encodable, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_64: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
  - [VADD_VV, 10.0]

# CHECK: error: riscv-vector-unit: Pnomask probability should be from [0.0;1.0]
# NOT-FP: error: invalid floating point number
