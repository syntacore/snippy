# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv32

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x50000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [FENCE_I, 2.0]

# CHECK: error: Illegal opcode for specified cpu: FENCE_I
