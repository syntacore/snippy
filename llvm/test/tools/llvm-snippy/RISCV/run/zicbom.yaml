# UNSUPPORTED: riscv-snippy-model-None
# RUN: timeout 10 llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  mattr: +zicbom
  num-instrs: 1000
  verify-gen-histogram: true
  histogram-must-succeed: true
  dump-mf: true

sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x10000
    ACCESS: rw

histogram:
  - [CBO_CLEAN, 1.0]
  - [CBO_FLUSH, 1.0]
  - [CBO_INVAL, 1.0]

# CHECK-DAG: cbo.clean
# CHECK-DAG: cbo.flush
# CHECK-DAG: cbo.inval
