# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s | FileCheck %s
options:
  mtriple: riscv64
  num-instrs: 100
  mattr: -a,+m,-c,+zca,+zcb,+zba,+zbb
  verify-gen-histogram: true
  histogram-must-succeed: true
  init-regs-in-elf: true
  dump-mf: true

sections:
- name: 1
  VMA: 0x1000
  LMA: 0x1000
  SIZE: 0x1000
  ACCESS: rx
- name: 2
  VMA: 0x2000
  LMA: 0x2000
  SIZE: 0x1000
  ACCESS: rw

histogram:
  - [C_LBU, 1.0]
  - [C_LHU, 1.0]
  - [C_LH, 1.0]
  - [C_SB, 1.0]
  - [C_SH, 1.0]
  - [C_ZEXT_B, 1.0]
  - [C_SEXT_B, 1.0]
  - [C_ZEXT_H, 1.0]
  - [C_SEXT_H, 1.0]
  - [C_ZEXT_W, 1.0]
  - [C_NOT, 1.0]
  - [C_MUL, 1.0]

# CHECK-DAG: c.lbu
# CHECK-DAG: c.lhu
# CHECK-DAG: c.lh
# CHECK-DAG: c.sb
# CHECK-DAG: c.sh
# CHECK-DAG: c.zext.b
# CHECK-DAG: c.sext.b
# CHECK-DAG: c.zext.h
# CHECK-DAG: c.sext.h
# CHECK-DAG: c.zext.w
# CHECK-DAG: c.not
# CHECK-DAG: c.mul
