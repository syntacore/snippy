# RUN: llvm-snippy %s

include:
- ../../Inputs/sections.yaml

options:
  march: rv32i_zcb_zca_zmmul_zbb_zba
  mtriple: riscv32
  num-instrs: 1000
  dump-mf: true
  verify-gen-histogram: true
  histogram-must-succeed: true
  init-regs-in-elf: on

histogram:
  - [C_MUL, 1.0]
  - [MUL, 1.0]
  - [MULH, 1.0]
  - [MULHU, 1.0]
  - [MULHSU, 1.0]

