# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s |& FileCheck %s
options:
  mtriple: riscv32
  num-instrs: 100
  verify-gen-histogram: true
  histogram-must-succeed: true
  mattr: -a,-m,-c,+f,+zca,+zcf
  dump-mf: true

sections:
- name: 1
  VMA: 0x1000
  LMA: 0x1000
  SIZE: 0x1000
  ACCESS: rx
- name: 2
  VMA: 0x2000
  LMA: 0x2000
  SIZE: 0x1000
  ACCESS: rw

histogram:
  - [C_FLW, 1.0]
  - [C_FSW, 1.0]

# CHECK-DAG: c.flw
# CHECK-DAG: c.fsw
