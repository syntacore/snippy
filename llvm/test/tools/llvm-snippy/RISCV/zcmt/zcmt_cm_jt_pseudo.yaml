# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s |& FileCheck %s

# CHECK: error: PseudoSnippyCM_JT is not supported, use CM_JT instead

options:
    mattr: +zcmt
    num-instrs: 500
    mtriple: riscv64

include:
  - ../Inputs/sections-with-ro.yaml

histogram:
    - [ADDI, 1.0]
    - [PseudoSnippyCM_JT, 10.0]

