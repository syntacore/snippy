# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64
# RUN: llvm-snippy %s -mtriple=riscv32

options:
    mattr: +zcmt
    num-instrs: 500
    verify-gen-histogram: True
    histogram-must-succeed: True

include:
  - ../Inputs/sections-with-ro.yaml

histogram:
    - [ADDI, 1.0]
    - [CM_JT, 10.0]

