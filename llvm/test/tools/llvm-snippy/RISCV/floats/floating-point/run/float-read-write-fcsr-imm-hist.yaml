# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s -mattr +f,-d -trace-log %t.f
# RUN: FileCheck %s -input-file %t.f -dump-input fail
# RUN: llvm-snippy %s -mattr +d -trace-log %t.fd
# RUN: FileCheck %s -input-file %t.fd -dump-input fail
include:
  - ../../../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  num-instrs: 2000
histogram:
  - [WriteFCSRImm, 1.0]
  - [SwapFCSRImm, 1.0]
  - [ReadFCSR, 0.2]
imm-hist:
  opcodes:
    - "WriteFCSRImm|SwapFCSRImm": uniform


# CHECK-DAG: csrwi fcsr, {{([[:digit:]][[:digit:]])|([[:digit:]])}}
# CHECK-DAG: csrr {{[sat][[:digit:]]+}}, fcsr
# CHECK-DAG: csrrwi {{[sat][[:digit:]]+}}, fcsr, {{[[:digit:]][[:digit:]]?}}

# CHECK-NOT: csrwi fcsr, {{(3[2-9])|([4-9][[:digit:]])|([[:digit:]][[:digit:]][[:digit:]]+)}}
# CHECK-NOT: csrwi {{[sat][[:digit:]]+}}, fcsr, {{(3[2-9])|([4-9][[:digit:]])|([[:digit:]][[:digit:]][[:digit:]]+)}}