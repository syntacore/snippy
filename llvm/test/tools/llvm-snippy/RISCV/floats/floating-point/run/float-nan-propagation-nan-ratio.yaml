# REQUIRES: riscv-snippy-model-spike

# RUN: llvm-snippy %s > %t.spike
# RUN: %S/Inputs/NaN-overwrite-check.rb %t.spike 0.3 --mattrs +d,+f,+zfh\
# RUN: --instructions fdiv.s,fmul.s,fdiv.h,fmul.h

include:
  - ../../../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  dump-mf: on
  mattr: "+d,+f,+zfh"
  num-instrs: 1000
fpu-config:
  overwrite:
    range:
      min: -1
      max:  1
    nan-rewrite-ratio: 0.3
histogram:
  - [FDIV_D, 1.0]
  - [FDIV_S, 1.0]
  - [FDIV_H, 1.0]
  - [FMUL_D, 1.0]
  - [FMUL_S, 1.0]
  - [FMUL_H, 1.0]
