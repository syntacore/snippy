# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: "+f,-d"
  num-instrs: 10
fpu-config:
  overwrite:
    ieee-single:
      valuegram:
        - type: bitrange
          min: 0xffffffffffffffff
          max: 0xffffffffffffffff
histogram:
  - [FMUL_S, 1.0]

# CHECK: float-nan-propagation-error-ranges-too-large.yaml:{{[0-9]+}}:{{[0-9]+}}: error: '0xffffffffffffffff' is too wide to fit in 32 bits
