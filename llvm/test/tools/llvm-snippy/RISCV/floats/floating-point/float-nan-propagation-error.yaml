# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: "+d"
  num-instrs: 10
fpu-config:
  overwrite:
    range:
      min: 3
      max: 1
histogram:
  - [FMUL_D, 1.0]

# CHECK: float-nan-propagation-error.yaml:{{[0-9]+}}:{{[0-9]+}}: error: 'max' should be greater or equal to 'min'
