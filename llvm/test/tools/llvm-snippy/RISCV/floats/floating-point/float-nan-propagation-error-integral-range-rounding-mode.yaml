# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/sections.yaml
options:
  mtriple: riscv64
  mcpu: generic-rv64
  mattr: "+d"
  num-instrs: 10
fpu-config:
  overwrite:
    range:
      min: 0
      max: 0
      rounding-mode: really-not-a-rounding-mode
histogram:
  - [ADDI, 1.0]

# CHECK: float-nan-propagation-error-integral-range-rounding-mode.yaml:{{[0-9]+}}:{{[0-9]+}}: error: unknown enumerated scalar
