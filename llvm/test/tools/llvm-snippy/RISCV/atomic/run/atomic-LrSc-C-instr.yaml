# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 500
  mattr: +c,+a
  init-regs-in-elf: true
  verify-mi: true

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [C_LD, 10.0]
    - [C_LW, 10.0]
    - [C_SD, 10.0]
    - [C_SW, 10.0]
    - [LR_W, 3.0]
    - [SC_W, 3.0]

# CHECK: #===Simulation Start===
