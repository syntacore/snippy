# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  num-instrs: 500
  mattr: +a
  init-regs-in-elf: true
  verify-mi: true

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [LR_D, 3.0]
    - [SC_D, 3.0]
