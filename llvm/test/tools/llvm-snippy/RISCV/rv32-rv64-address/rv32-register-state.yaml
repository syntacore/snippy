# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv32 -mattr=-c \
# RUN:    -num-instrs=10000 -init-regs-in-elf -dump-registers-yaml=%t_regs

# RUN: FileCheck %s --input-file=%t_regs --dump-input always

include:
- ../../Inputs/memory32.yaml

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [SRA, 1.0]
    - [SRAI, 1.0]
    - [SRL, 1.0]
    - [SRLI, 1.0]
    - [SLL, 1.0]
    - [SLLI, 1.0]
    - [AND, 1.0]
    - [ANDI, 1.0]
    - [OR, 1.0]
    - [ORI, 1.0]
    - [XOR, 1.0]
    - [XORI, 1.0]
    - [LW, 10.0]
    - [SW, 10.0]

