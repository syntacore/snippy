# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s -mtriple=riscv64 \
# RUN: |& FileCheck %s

sections:
    - name:      1
      VMA:       0xFFF1001000
      SIZE:      0x400000
      LMA:       0xFFF1001000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]

