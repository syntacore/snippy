options:
  mtriple: riscv64
  function-number: 20
  function-layers: 5
  num-instrs: 1000
  num-instr-ancil: 50
  verify-mi: on
  dump-mf: on

include:
  - Inputs/sections-with-stack.yaml

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [JAL, 1.0]

