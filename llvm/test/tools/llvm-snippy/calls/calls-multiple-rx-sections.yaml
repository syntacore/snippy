# RUN: llvm-snippy %s -num-instrs=1000 \
# RUN: --chained-rx-sections-fill --num-instr-ancil=50 -o %t
# RUN: llvm-objdump %t.elf --disassembler-options=no-aliases -d |& FileCheck %s --check-prefix=ENABLED
