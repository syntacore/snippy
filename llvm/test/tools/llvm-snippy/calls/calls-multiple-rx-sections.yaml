# RUN: --chained-rx-sections-fill --num-instr-ancil=200 |& \
# RUN: FileCheck %s --check-prefix=ROOT-ERROR

options:
  mtriple: riscv64
  enable-static-stack: off

sections:
  - name:      3
    VMA:       0x210000
    SIZE:      0x1000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      "stack"
    VMA:       0x200000
    SIZE:      0x10000
    LMA:       0x200000
    ACCESS:    rw
  - name:      1
    VMA:       0x220000
    SIZE:      0x1000
    LMA:       0x220000
    ACCESS:    rx
  - name:      4
    VMA:       0x260000
    SIZE:      0x1000
    LMA:       0x260000
    ACCESS:    rx

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [JAL, 0.1]
function-layers: 3
function-number: 9

# DISABLED-NOT:  jalr    zero, 0x0({{[a-z0-9]+}}) <
# DISABLED: ebreak
# DISABLED-NOT:  jalr    zero, 0x0({{[a-z0-9]+}}) <
#
# ENABLED-DAG: jalr    zero, 0x0({{[a-z0-9]+}}) <
# ENABLED-DAG: ebreak
# ENABLED-DAG: jalr    zero, 0x0({{[a-z0-9]+}}) <
#
# SORTED-COUNT-2: jalr    zero, 0x0({{[a-z0-9]+}}) <
# SORTED-NOT: jalr    zero, 0x0({{[a-z0-9]+}}) <
# SORTED: ebreak
# SECONDARY-ERROR: error: Failed to fit secondary code in specified RX sections: not enough contiguos space found.
# ROOT-ERROR: error: RX section '{{[0-9]+}}' (size 4096) failed to fit code mapped to it. Total code size: {{[0-9]+}}
# ROOT-ERROR-NEXT: List of functions mapped to this section:
# ROOT-ERROR-NEXT: SnippyFunction: size {{[0-9]+}} 
