# RUN: llvm-snippy %s -mtriple=riscv64 -function-number=20 -function-layers=5 -num-instrs=1000 \
# RUN: --dump-mf -num-instr-ancil=50 -verify-mi |& FileCheck %s

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      stack
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [JAL, 0.1]
    - [JALR, 0.1]

# CHECK: $[[TMP1:[a-z0-9]+]] = AUIPC target-flags(riscv-pcrel-hi) @[[FUN1:[a-zA-Z0-9_]+]], pre-instr-symbol <mcsymbol .[[TMP_SYM1:[a-zA-Z0-9_]+]]>
# CHECK-NEXT: $[[TMP1]] = ADDI $[[TMP1]], target-flags(riscv-pcrel-lo) <mcsymbol .[[TMP_SYM1]]>
# CHECK-NEXT: $[[TMP1]] = ADDI $[[TMP1]]
# CHECK-NEXT: $[[TMP1]] = ADDI $[[TMP1]], {{[0-1]}}
# CHECK-NEXT: ${{[a-z0-9]+}} = PseudoJALRCall $[[TMP1]],
# CHECK-DAG: PseudoJALCall
# CHECK-DAG: Machine code for function [[FUN1]]:
