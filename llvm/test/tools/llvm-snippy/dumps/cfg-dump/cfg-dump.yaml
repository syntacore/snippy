# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s --cfg-basename=%t
# RUN: rm %t_SnippyFunction-cfg-dump.dot

options:
  num-instrs: 100
  mtriple: riscv64
  dump-cfg: true

sections:
  - name:      0
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      1
    VMA:       0x80002000
    SIZE:      0x100000
    LMA:       0x80002000
    ACCESS:    rw

histogram:
  - [SUB, 2.0]
  - [BEQ, 1.0]
