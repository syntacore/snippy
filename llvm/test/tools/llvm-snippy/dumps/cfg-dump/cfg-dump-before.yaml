# REQUIRES: riscv-snippy-model-None
# COM: Dump before (almost) the first pass

# RUN: llvm-snippy %s --dump-cfg-before=snippy-register-reserve \
# RUN:     --cfg-basename=%t
# RUN: rm %t_SnippyFunction-cfg-dump-before-snippy-register-reserve.dot
# COM: Dump before function generator when there is some CF
# RUN: llvm-snippy %s --dump-cfg-before=snippy-loop-latcher --cfg-basename=%t
# RUN: rm %t_SnippyFunction-cfg-dump-before-snippy-loop-latcher.dot
# COM: Dump when generation is almost done
# RUN: llvm-snippy %s --dump-cfg-before=snippy-branch-lengthener \
# RUN:     --cfg-basename=%t
# RUN: rm %t_SnippyFunction-cfg-dump-before-snippy-branch-lengthener.dot

options:
  num-instrs: 100
  mtriple: riscv64

sections:
  - name:      0
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      1
    VMA:       0x80002000
    SIZE:      0x100000
    LMA:       0x80002000
    ACCESS:    rw

histogram:
  - [SUB, 2.0]
  - [BEQ, 1.0]
