# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=-a,+d \
# RUN:    -num-instrs=10 -dump-initial-registers-yaml=%t.yaml \
# RUN:    && FileCheck %s < %t.yaml

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=-a,+d \
# RUN:    -num-instrs=10 -dump-initial-registers-yaml=%t.yaml \
# RUN:    && FileCheck %s < %t.yaml

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [SRA, 1.0]
    - [SRAI, 1.0]
    - [SRL, 1.0]
    - [SRLI, 1.0]
    - [SLL, 1.0]
    - [SLLI, 1.0]
    - [AND, 1.0]
    - [ANDI, 1.0]
    - [OR, 1.0]
    - [ORI, 1.0]
    - [XOR, 1.0]
    - [XORI, 1.0]
    - [LW, 10.0]
    - [SW, 10.0]

