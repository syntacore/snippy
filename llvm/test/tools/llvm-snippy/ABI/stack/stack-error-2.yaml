# REQUIRES: riscv-snippy-model-spike

# RUN: not llvm-snippy %s |& FileCheck %s -check-prefix=EXTSTACKERROR

# EXTSTACKERROR: error: Cannot run snippet on model: external stack was enabled.

include:
  - Inputs/layout3.yaml

options:
  mtriple: riscv64
  mattr: +m,+c
  num-instrs: 10000
  external-stack: true
  redefine-sp: SP
  spilled-regs-list: [X1]