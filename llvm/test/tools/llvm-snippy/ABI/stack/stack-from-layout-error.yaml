# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +m,+c
  num-instrs: 10000
  spilled-regs-list: [X1]
  init-regs-in-elf: true
  verify-mi: true

sections:
    - name:      1
      VMA:       0x500000
      SIZE:      0x100000
      LMA:       0x500000
      ACCESS:    rx
    - name:      2
      VMA:       0x600000
      SIZE:      0x700000
      LMA:       0x600000
      ACCESS:    rw
    - name:      stack
      VMA:       0xF00000
      SIZE:      0x100000
      LMA:       0xF00000
      ACCESS:    rx

histogram:
    - [DIV, 1.0]
    - [ADD, 1.0]

# CHECK: error: Wrong layout file: "stack" section must be RW
