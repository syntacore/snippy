# REQUIRES: riscv-snippy-model-None
# RUN:  not llvm-snippy %s -mtriple=riscv64 -mcpu=generic-rv64 \
# RUN:  |& FileCheck %s

options:
  preserve-caller-saved-regs: [X]
  num-instrs: 10

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rw
  - name:      2
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rx

include:
  - Inputs/call-graph-with-external-func.yaml

histogram:
    - [ADD, 1.0]
    - [JALR, 0.5]

# CHECK: error: Cannot preserve requested caller-saved registers: no stack
# CHECK-SAME: space allocated.
