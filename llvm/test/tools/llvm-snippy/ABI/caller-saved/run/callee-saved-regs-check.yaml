# RUN: llvm-snippy %s -mtriple=riscv64 -mcpu=generic-rv64 \
# RUN: | FileCheck %s --check-prefix=RV64-GPR-CHECK
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+zfh -mcpu=generic-rv64 \
# RUN: | FileCheck %s --check-prefixes=RV64-GPR-CHECK,RV64-FPRF-CHECK
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+f -mcpu=generic-rv64 \
# RUN: | FileCheck %s --check-prefixes=RV64-GPR-CHECK,RV64-FPRF-CHECK
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+d -mcpu=generic-rv64 \
# RUN: | FileCheck %s --check-prefixes=RV64-GPR-CHECK,RV64-FPRD-CHECK

# RUN: llvm-snippy %s -mtriple=riscv32 -mcpu=generic-rv32 \
# RUN: | FileCheck %s --check-prefix=RV32-GPR-CHECK
# RUN: llvm-snippy %s -mtriple=riscv32 -mattr=+zfh -mcpu=generic-rv32 \
# RUN: | FileCheck %s --check-prefixes=RV32-GPR-CHECK,RV32-FPRF-CHECK
# RUN: llvm-snippy %s -mtriple=riscv32 -mattr=+f -mcpu=generic-rv32 \
# RUN: | FileCheck %s --check-prefixes=RV32-GPR-CHECK,RV32-FPRF-CHECK
# RUN: llvm-snippy %s -mtriple=riscv32 -mattr=+d -mcpu=generic-rv32 \
# RUN: | FileCheck %s --check-prefixes=RV32-GPR-CHECK,RV32-FPRD-CHECK

options:
  num-instrs: 10
  honor-target-abi: on
  verify-mi: on
  dump-mf: on
sections:
  - name:      stack
    VMA:       0x200000
    SIZE:      0x10000
    LMA:       0x200000
    ACCESS:    rw
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rw
  - name:      2
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rx

histogram:
     - [XOR, 1.0]

