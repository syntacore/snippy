# RUN: llvm-snippy %s -mtriple=riscv64 -mcpu=generic-rv64 \
# RUN: -preserve-caller-saved-regs=X | FileCheck %s --check-prefix=RV64-GPR-CHECK

# RUN: llvm-snippy %s -mtriple=riscv32 -mcpu=generic-rv32 \
# RUN: -preserve-caller-saved-regs=X | FileCheck %s --check-prefix=RV32-GPR-CHECK

options:
  num-instrs: 1000
  redefine-sp: reg::X2
  redefine-ra: reg::X1
  verify-mi: on
  dump-mf: on

include:
  - ../Inputs/sections-with-stack.yaml
  - ../Inputs/call-graph-with-external-func.yaml

histogram:
     - [JAL, 1.0]
     - [SUB, 1.0]
     - [ADD, 1.0]

# COM: RV64
# COM: Spill caller saved registers to the stack
