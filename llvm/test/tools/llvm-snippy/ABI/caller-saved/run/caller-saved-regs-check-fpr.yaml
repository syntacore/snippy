# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+zfh -mcpu=generic-rv64 \
# RUN:   -preserve-caller-saved-regs=F \
# RUN: | FileCheck %s

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+f -mcpu=generic-rv64 \
# RUN:   -preserve-caller-saved-regs=F \
# RUN: | FileCheck %s


# RUN: llvm-snippy %s -mtriple=riscv32 -mattr=+zfh -mcpu=generic-rv32 \
# RUN:   -preserve-caller-saved-regs=F \
# RUN: | FileCheck %s

# RUN: llvm-snippy %s -mtriple=riscv32 -mattr=+f -mcpu=generic-rv32 \
# RUN:   -preserve-caller-saved-regs=F \
# RUN: | FileCheck %s

options:
  num-instrs: 1000
  redefine-sp: reg::X2
  verify-mi: on
  dump-mf: on

include:
  - ../Inputs/sections-with-stack.yaml
  - ../Inputs/call-graph-with-external-func.yaml

histogram:
     - [JAL, 1.0]
     - [ADD, 1.0]
     - [FADD_S, 1.0]

# COM: Spill caller saved registers to the stack

# CHECK: FSW $f1_f, $x2, 0
# CHECK: FSW $f5_f, $x2, 0
# CHECK: FSW $f6_f, $x2, 0
# CHECK: FSW $f7_f, $x2, 0
# CHECK: FSW $f28_f, $x2, 0
# CHECK: FSW $f29_f, $x2, 0
