# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s --dump-mir=- |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 200
  init-regs-in-elf: on
  honor-target-abi: on
  verify-mi: on 

include:
  - Inputs/sections-with-stack.yaml
  - Inputs/call-graph-with-external-func.yaml

histogram:
    - [ADD, 1.0]
    - [JAL, 0.1]
    - [JALR, 0.1]

# COM: We check that SnippyFunction has tracksRegLiveness
# CHECK: name: SnippyFunction
# CHECK-NEXT: alignment:
# CHECK-NEXT: exposesReturnsTwice:
# CHECK-NEXT: legalized:
# CHECK-NEXT: regBankSelected:
# CHECK-NEXT: selected:
# CHECK-NEXT: failedISel:
# CHECK-NEXT: tracksRegLiveness: true
