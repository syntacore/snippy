# RUN: llvm-snippy %s -num-instrs=1000 --chained-rx-sections-fill -o %t
# RUN: llvm-objdump %t.elf -d |& FileCheck %s --check-prefix=ENABLED
# RUN: llvm-snippy %s -num-instrs=1000 --chained-rx-sections-fill \
# RUN:     --chained-rx-sorted -o %t
# RUN: llvm-objdump %t.elf -d |& FileCheck %s --check-prefix=SORTED
# RUN: not llvm-snippy %s -num-instrs=all --chained-rx-sections-fill \
# RUN:     --chained-rx-sorted \
# RUN: |& FileCheck %s --check-prefix=ERR1
# RUN: llvm-snippy %s -num-instrs=1000 \
# RUN: |& FileCheck %s --check-prefix=WARN
options:
  reserved-regs-list: [X1]
  mtriple: riscv64
  chained-rx-chunk-size: 10
sections:
  - name:      3
    VMA:       0x210000
    SIZE:      0x1000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      "stack"
    VMA:       0x200000
    SIZE:      0x10000
    LMA:       0x200000
    ACCESS:    rw
  - name:      1
    VMA:       0x410000
    SIZE:      0x1000
    LMA:       0x410000
    ACCESS:    rx
  - name:      4
    VMA:       0x610000
    SIZE:      0x1000
    LMA:       0x610000
    ACCESS:    rx

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]

# ENABLED-COUNT-101: jr
# ENABLED-NOT: jr
#
# SORTED-COUNT-101: jr
# SORTED-NOT: jr
# SORTED: ebreak
#
# ERR1: error: Cannot use 'chained-rx-chunk-size' option: num-instrs is set to 'all'
# WARN: warning: (inconsistent-options) 'chained-rx-chunk-size' is ignored: pass 'chained-rx-sections-fill' to enable it
