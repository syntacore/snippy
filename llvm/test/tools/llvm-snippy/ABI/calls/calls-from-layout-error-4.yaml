# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 100
  num-instr-ancil: 10
  dump-mf: true
  verify-mi: true

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      external: true
      callees:
        - fun1
        - fun2
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3

# CHECK: calls-from-layout-error-4.yaml:16:7: error: Function specified as external cannot have callee functions
