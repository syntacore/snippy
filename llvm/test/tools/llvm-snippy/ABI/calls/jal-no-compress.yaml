# COM: This test checks that riscv asm printer does not compress generated calls.
# RUN: llvm-snippy %s -o %t
# RUN: llvm-objdump -M no-aliases -d %t.elf | FileCheck %s

# CHECK: jal
# CHECK-NOT: c.jal
 
options:
  mtriple: "riscv32"
  march: "rv32imc_zba_zbb_zbc_zbs_zicsr"
  mattr: "+c"
  num-instrs: 100
  redefine-ra: RA
  enable-static-stack: off
  function-number: 3
  function-layers: 3
# COM: keep text section size small to be sure that jal -> c.jal compression is possible
sections:
  - name: text
    VMA:  0x80050000
    SIZE: 0x1000
    LMA:  0x80050000
    ACCESS: rx
  - name: data
    VMA:  0x800A0000
    SIZE: 0x10000
    LMA:  0x800A0000
    ACCESS: rw
  - name: stack
    VMA:  0x800B0000
    SIZE: 0x10000
    LMA:  0x800B0000
    ACCESS: rw

histogram:
  - [JAL, 5.0]
  - [ADD, 5.0]
