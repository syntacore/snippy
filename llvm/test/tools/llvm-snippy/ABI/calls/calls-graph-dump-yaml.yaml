# RUN: llvm-snippy %s -call-graph-dump-filename=%t
# RUN: FileCheck %s --input-file=%t

include:
  - ../../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 100
  num-instr-ancil: 10
  dump-mf: true
  verify-mi: true
  call-graph-dump-format: yaml

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - fun1
        - fun2
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3
      external: true

#CHECK: entry-point: SnippyFunction
#CHECK-NEXT: function-list:
#CHECK-NEXT:   - name: SnippyFunction
#CHECK-NEXT:     callees:
#CHECK-NEXT:       - fun1
#CHECK-NEXT:       - fun2
#CHECK-NEXT:   - name: fun1
#CHECK-NEXT:     callees:
#CHECK-NEXT:       - fun2
#CHECK-NEXT:   - name: fun2
#CHECK-NEXT:     callees:
#CHECK-NEXT:       - fun3
#CHECK-NEXT:   - name: fun3
#CHECK-NEXT:     external: true
