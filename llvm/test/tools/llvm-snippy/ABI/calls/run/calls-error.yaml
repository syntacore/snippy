# REQUIRES: riscv-snippy-model-any

# RUN: not llvm-snippy %s -backtrack \
# RUN: |& FileCheck %s --check-prefix=TRACK
# RUN: not llvm-snippy %s -selfcheck \
# RUN: |& FileCheck %s --check-prefix=TRACK

options:
  mtriple: riscv64
  function-number: 20
  function-layers: 5
  num-instrs: 100
  dump-mf: true
  num-instr-ancil: 50

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      stack
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x410000
    SIZE:      0x100000
    LMA:       0x410000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [JAL, 0.2]

# TRACK: error: Cannot generate requested call instructions: backtrack and selfcheck do not work with calls yet.
