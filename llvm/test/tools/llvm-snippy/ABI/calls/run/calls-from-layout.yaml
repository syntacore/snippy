# RUN: llvm-snippy %s

include:
  - ../../../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 100
  num-instr-ancil: 10
  verify-mi: true

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - fun1
        - fun2
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3
