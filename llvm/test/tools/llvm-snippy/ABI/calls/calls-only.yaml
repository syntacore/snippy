# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  function-number: 20
  function-layers: 5
  num-instrs: 100
  dump-mf: true
  verify-mi: true
  num-instr-ancil: 50

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      stack
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    rw

histogram:
    - [JAL, 0.2]

# CHECK: error: for using calls you need to add to histogram non-call instructions
