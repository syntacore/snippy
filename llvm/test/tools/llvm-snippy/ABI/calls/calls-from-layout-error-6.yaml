# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 100
  num-instr-ancil: 10
  dump-mf: true
  verify-mi: true

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - fun1
        - fun2
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3
    - name: ""

# CHECK: calls-from-layout-error-6.yaml:27:7: error: Empty names are not allowed for function in call graph
