# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/jal-layout.yaml

options:
  mtriple: riscv64
  num-instrs: 100
  num-instr-ancil: 10
  dump-mf: true
  verify-mi: true

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - fun1
        - fun2
        - fun4
    - name: fun1
      callees:
        - fun2
    - name: fun2
      callees:
        - fun3
    - name: fun3

# CHECK: calls-from-layout-error-3.yaml:14:3: error: Function 'SnippyFunction' has 'fun4' in the callee list, that has no description in yaml
