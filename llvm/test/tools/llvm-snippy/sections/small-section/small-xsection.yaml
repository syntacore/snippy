# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -a
  dump-mi: true
  num-instrs: 1000

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADDI, 1.0]

# CHECK: error: RX section '1' (size {{[0-9]+}}) failed to fit code mapped to it. Total code size: {{[0-9]+}}
