# REQUIRES: riscv-snippy-model-spike

# RUN: llvm-snippy %s |& FileCheck %s --check-prefix=DISABLED
# RUN: llvm-snippy %s --chained-rx-sections-fill \
# RUN: |& FileCheck %s --check-prefix=ENABLED
# RUN: not llvm-snippy %s --chained-rx-sections-fill --selfcheck \
# RUN: |& FileCheck %s --check-prefix=ERROR
# RUN: llvm-snippy %s --chained-rx-sections-fill --chained-rx-sorted \
# RUN: |& FileCheck %s --check-prefix=SORTED

options:
  mtriple: riscv64
  num-instrs: 1000

sections:
  - name:      3
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw
  - name:      1
    VMA:       0x410000
    SIZE:      0x100000
    LMA:       0x410000
    ACCESS:    rx
  - name:      4
    VMA:       0x610000
    SIZE:      0x100000
    LMA:       0x610000
    ACCESS:    rx
  - name:      selfcheck
    VMA:       0x200000
    SIZE:      0x10000
    LMA:       0x200000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]

# DISABLED-NOT: jalr zero
#
# ENABLED-COUNT-2: jalr zero
# ENABLED-NOT: jalr zero
#
# SORTED: jalr zero
# SORTED-NEXT: 0x00000000004
# SORTED-NEXT: 0x00000000002
# SORTED: jalr zero
# SORTED-NEXT: 0x00000000002
# SORTED-NEXT: 0x00000000006
# SORTED-NOT: jalr zero
#
# ERROR: error: Cannot generate chained code routine: backtrack, selfcheck and address hazard mode do not work with it yet.
