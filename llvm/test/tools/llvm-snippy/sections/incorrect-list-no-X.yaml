# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -a
  list-opcode-names: true
  dump-mi: true
  num-instrs: 10

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rw
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram: 
    - [LW, 1.0]
    - [SW, 1.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]
      
# CHECK: error: Incorrect list of sections: there are no X-accessible sections.
