# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -dump-mir=- |& FileCheck %s

options:
  mtriple: riscv64

histogram:
  - [ADD, 1.0]

sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x10000
    ACCESS: rw

#CHECK: ModuleID = 'main'
#CHECK: target triple = "riscv64"
