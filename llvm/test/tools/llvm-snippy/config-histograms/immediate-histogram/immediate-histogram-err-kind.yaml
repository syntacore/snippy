# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../../Inputs/sections.yaml

options:
  mtriple: riscv64
  mcpu: generic-rv64
  num-instrs: 20
  dump-mf: on

histogram: 
    - [ADDI, 1.0]
    - [LUI, 1.0]

imm-hist:
  opcodes:
    - 'ADDI': notuniform
# CHECK: immediate-histogram-err-kind.yaml:{{[0-9]+}}:{{[0-9]+}}: error: unknown enumerated scalar
# CHECK-NEXT:    - 'ADDI': notuniform
