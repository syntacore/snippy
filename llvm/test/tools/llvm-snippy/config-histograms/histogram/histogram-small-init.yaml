# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  init-regs-in-elf: true
  num-instrs: 20

sections:
    - name:      1
      VMA:       0x80000
      SIZE:      0x4
      LMA:       0x80000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]

# CHECK: error: RX section '1' (size {{[0-9]+}}) failed to fit code mapped to it. Total code size: {{[0-9]+}}
