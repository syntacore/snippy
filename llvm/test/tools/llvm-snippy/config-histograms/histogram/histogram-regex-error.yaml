# REQUIRES: riscv-snippy-model-None

# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  dump-mi: true
  num-instrs: 20000
  last-instr: ""

sections:
    - name:      1
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rx
    - name:      2
      VMA:       0x80600000
      SIZE:      0x400000
      LMA:       0x80600000
      ACCESS:    rw

histogram: 
# Invalid opcode regexp
    - ["FOO:)", 1.0]

# CHECK: Illegal opcode regular expression "FOO:)": parentheses not balanced
