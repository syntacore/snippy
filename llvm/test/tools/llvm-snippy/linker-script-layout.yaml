# RUN: llvm-snippy %s -mtriple=riscv64 -model-plugin=None -mattr=-a -num-instrs=10 -o %t
# RUN: FileCheck %s --input-file=%t.ld --check-prefix=UNMANGLED
# RUN: llvm-snippy %s -mtriple=riscv64 -model-plugin=None -mattr=-a -num-instrs=10 -o %t \
# RUN: -entry-point=Test -mangle-exported-names
# RUN: FileCheck %s --input-file=%t.ld --check-prefix=MANGLED

sections:
    - name:      1
      VMA:       0x10000
      SIZE:      0x200
      LMA:       0x10000
      ACCESS:    rx
    - name:      2
      VMA:       0x10200
      SIZE:      0x200
      LMA:       0x10200
      ACCESS:    rw
    - name:      named
      VMA:       0x10400
      SIZE:      0x200
      LMA:       0x10400
      ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SW, 5.0]

# UNMANGLED: SNIPPY (rwx) : ORIGIN = 0x10000, LENGTH = 0x600
# UNMANGLED: .snippy.1.rx 0x10000: {
# UNMANGLED: .snippy.2.rw 0x10200 (NOLOAD) : {
# UNMANGLED: .snippy.named.rw 0x10400 (NOLOAD) : {
# MANGLED: SNIPPY_Test (rwx) : ORIGIN = 0x10000, LENGTH = 0x600
# MANGLED: .snippy.Test.1.rx 0x10000: {
# MANGLED: .snippy.Test.2.rw 0x10200 (NOLOAD) : {
# MANGLED: .snippy.Test.named.rw 0x10400 (NOLOAD) : {
