# COM: This test checks error when none of the VLs are suitable for any configuration
#
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../rvv-config-histogram/Inputs/sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100

riscv-vector-unit:
  mode-distribution:
    mode-list:
      - [[sew_8, m1], 1.0] # max VL is 16
    VM:
      - [all_ones, 1.0]
    VL:
      - [52, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VADD_VV, 0.1]
    - [VSETVL, 1.0]

# CHECK: error: riscv-vector-unit: Could not find any applicable VL generators
