# COM: This test checks specifying a reserved value for SEW/LMUL is invalid.
# COM: (same error as any other unknown value)
#
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../rvv-config-histogram/Inputs/sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100

riscv-vector-unit:
  mode-distribution:
    mode-list:
      - [[sew_Reserved1, m4], 1.0]
    VM:
      - [all_ones, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VADD_VV, 0.1]
    - [VSETVL, 1.0]

# CHECK: error: unknown enumerated scalar
# CHECK-NEXT: [sew_Reserved1, m4]
