# COM: This test checks an error when both mode-list and marginal
# COM: SEW and LMUL distributions are specified.
#
# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - ../rvv-config-histogram/Inputs/sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100

riscv-vector-unit:
  mode-distribution:
    mode-list:
      - [[sew_8, m1], 1.0]
    VM:
      - [all_ones, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_16: 1.0
        sew_32: 1.0
      LMUL:
        m1: 1.0
        m8: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VADD_VV, 0.1]
    - [VSETVL, 1.0]

# CHECK: error: It's not allowed to specify both SEW/LMUL configuration and a mode-list
