# COM: This test checks that mode-list works together with marginal-priorities:vl
#
# RUN: llvm-snippy %s -riscv-dump-rvv-config=%t
# RUN: FileCheck %s --input-file=%t

include:
  - ../rvv-config-histogram/Inputs/sections.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 100

riscv-vector-unit:
  mode-distribution:
    marginal-priorities:
      - [vl, 1.0]
    mode-list:
      - [[sew_64, m1], 1.0]
      - [[sew_8, m8], 1.0]
    VM:
      - [all_ones, 1.0]
    VL:
      - [2, 1.0]
      - [12, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VADD_VV, 0.1]
    - [VSETVL, 1.0]

# COM: {e64, m1} - VLMAX=2
# COM: {e8, m8}  - VLMAX=128
# COM: Both modes support VL=2, but only the second one supports VL=12.

# CHECK-DAG: P: 0.75 Conf: { e8, m8, tu, mu, vxrm: rnu }
# CHECK-DAG: P: 0.25 Conf: { e64, m1, tu, mu, vxrm: rnu }
# CHECK: Configuration Bag Size: 2
