# RUN: timeout 300 llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100
  dump-mf: true

include:
  - ../loops/Inputs/sections.yaml

histogram:
  - [BLT, 1.0]
  - [BGE, 1.0]

branches:
  loop-ratio: 1.0
  loop-counters:
    random-init:
      # Max generating value for loop counter
      min: 4294967295
      max: 4294967295
  number-of-loop-iterations:
    min: 16
    max: 16

access-ranges:
  - start: 0x400000000
    size: 64
    stride: 8
    first-offset: 0
    last-offset: 0
  - start: 0x400001000
    size: 8
    stride: 8
    first-offset: 0
    last-offset: 0

# COM: up/down count loop
# CHECK: [[REG:\$x[[:digit:]]+]] = ADDI $x0, {{-?}}1
# CHECK: [[REG]] = S{{(L|R)}}LI [[REG]], 32
# CHECK: {{((BLT)|(BGE))}} [[REG]], $x{{[[:digit:]]+}}
