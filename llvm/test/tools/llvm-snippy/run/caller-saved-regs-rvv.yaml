# RUN: llvm-snippy %s -mtriple=riscv64 -mcpu=generic-rv64 | FileCheck %s
 
options:
  num-instrs: 50
  mattr: "+v"
  redefine-sp: reg::X2
  verify-mi: on
  dump-mf: on
  preserve-caller-saved-regs: [V]

sections:
  - name:      stack
    VMA:       0x200000
    SIZE:      0x10000
    LMA:       0x200000
    ACCESS:    rw
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rw
  - name:      2
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rx

call-graph:
  entry-point: SnippyFunction
  function-list:
    - name: SnippyFunction
      callees:
        - IamExternalFunc
    - name: IamExternalFunc
      external: true

histogram:
     - [JAL, 1.0]
     - [JALR, 1.0]
     - [VADD_VV, 1.0]
     - [VLE64_V, 1.0]
     - [VLSE64_V, 1.0]
     - [VLOXEI64_V, 1.0]
     - [VSETVL, 0.1]

