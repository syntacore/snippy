# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  mattr: +zicond
  num-instrs: 10000

sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x10000
    ACCESS: rw

histogram:
  - [ADD, 1.0]
  - [SUB, 1.0]
  - [OR, 1.0]
  - [XOR, 1.0]
  - [AND, 1.0]
  - [CZERO_EQZ, 2.5]
  - [CZERO_NEZ, 2.5]

# CHECK-COUNT-1000: czero.eqz
# CHECK-COUNT-1000: czero.nez
