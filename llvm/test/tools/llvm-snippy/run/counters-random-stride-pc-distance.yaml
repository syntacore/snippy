# UNSUPPORTED: riscv-snippy-model-None
# RUN: timeout 300 llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 100

include:
  - ../loops/Inputs/sections.yaml

histogram:
  - [BNE, 1.0]
  - [BLT, 1.0]
  - [BLTU, 1.0]
  - [BGE, 1.0]
  - [BGEU, 1.0]
  - [BEQ, 1.0]

branches:
  loop-ratio: 1.0
  max-depth:
    loop: 1
  loop-counters:
    random-stride:
      min: 10
      max: 1500
  distance:
    pc:
      min: 8
      max: 8

access-ranges:
  - start: 0x400000000
    size: 64
    stride: 8
    first-offset: 0
    last-offset: 0
  - start: 0x400001000
    size: 8
    stride: 8
    first-offset: 0
    last-offset: 0

# CHECK-DAG: bne
# CHECK-DAG: blt
# CHECK-DAG: bltu
# CHECK-DAG: bge
# CHECK-DAG: bgeu
# CHECK-DAG: beq
