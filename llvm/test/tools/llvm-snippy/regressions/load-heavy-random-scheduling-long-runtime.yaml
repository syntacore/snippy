# REQUIRES: riscv-snippy-model-None
# REQUIRES: snippy-long-tests
# RUN: timeout 300 llvm-snippy %s

options:
  mtriple: riscv64
  mcpu: generic-rv64
  num-instrs: 500000
  init-memory: full
  entry-point: test_1
  external-stack: true
  honor-target-abi: true
  mangle-exported-names: true
  init-regs-in-elf: true
  riscv-init-fregs-from-memory: true
  last-instr: RET
  riscv-disable-misaligned-access: atomics-only
  random-scheduling: true
  enable-phdrs-definition: true
  memory-seed: 1
sections:
  - name: sect_rx_40ca53000
    PHDR: sect_rx_40ca53000
    VMA: 0x40ca53000
    SIZE: 0x2400000
    LMA: 0x40ca53000
    ACCESS: rx
  - name: readonly
    PHDR: readonly
    VMA: 0x443311000
    SIZE: 0x1000
    LMA: 0x443311000
    ACCESS: r
  - name: selfcheck
    PHDR: selfcheck
    VMA: 0x4535d9000
    SIZE: 0x1000000
    LMA: 0x4535d9000
    ACCESS: rw
  - name: sect_rw_41eae4000
    PHDR: sect_rw_41eae4000
    VMA: 0x41eae4000
    SIZE: 0x1000
    LMA: 0x41eae4000
    ACCESS: rw
histogram:
  - [LB, 5.0]
  - [LBU, 5.0]
