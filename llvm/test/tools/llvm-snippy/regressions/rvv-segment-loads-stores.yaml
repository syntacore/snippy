# REQUIRES: riscv-snippy-model-spike
# RUN: timeout 300 llvm-snippy %s

options:
  num-instrs: 10000
  mtriple: riscv64
  honor-target-abi: on
  enable-phdrs-definition: on
  init-regs-in-elf: on
  riscv-init-fregs-from-memory: on
  init-memory: full
  enable-address-value-hazards: on
  mattr: +v,+c

