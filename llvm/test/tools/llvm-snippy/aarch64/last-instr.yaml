# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s |& FileCheck %s
options:
  mtriple: aarch64
  num-instrs: 10
  dump-mi: true

include:
  - Inputs/simple_sections.yaml

histogram:
  - ["ADDWri", 1.0]

# CHECK-COUNT-10: Generated MI_
# CHECK-NEXT: RET {{.*}}, pre-instr-symbol <mcsymbol __snippy_exit>, pcsections {{.*}}
