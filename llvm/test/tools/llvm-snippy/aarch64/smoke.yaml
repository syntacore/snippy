# REQUIRES: riscv-snippy-model-None

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: aarch64
  mattr: +cssc
  num-instrs: 1000
  dump-mi: true
  last-instr: ""

include:
  - Inputs/simple_sections.yaml

histogram:
  - [ABSWr, 1.0]

# CHECK-COUNT-1000: Generated MI_
# CHECK-NEXT: HINT 0, post-instr-symbol <mcsymbol __snippy_exit>
