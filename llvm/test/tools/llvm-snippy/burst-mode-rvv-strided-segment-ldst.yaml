# RUN: llvm-snippy %s %S/Inputs/sections.yaml -model-plugin=None

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 20000
  verify-gen-histogram: true
  histogram-must-succeed: true

burst:
  mode: mixed
  min-size: 100
  max-size: 100

histogram:
  - ["V[LS]SSEG[2-8]E[123468]{1,2}_V", 1.0]
  - [VSETIVLI, 10.0]
  - [SW, 1.0]
  - [MUL, 2.0]
  - [DIV, 1.0]
  - [ADD, 1.0]
  - [ADDI, 1.0]
