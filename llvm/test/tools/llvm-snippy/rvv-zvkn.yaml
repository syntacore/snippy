# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v,+zvkn \
# RUN:  -o %t --num-instrs=2000 \
# RUN:  --init-regs-in-elf --verify-mi -verify-gen-histogram \
# RUN:  -histogram-max-deviation=5

include:
- Inputs/memory-unaligned.yaml
- rvv-config-histogram/Inputs/rvv-unit-sew_32-m1-max_encodable.yaml
sections:
  - name:      0
    VMA:       0x8000
    SIZE:      0x4000
    LMA:       0x8000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

  - [VMV1R_V, 1.0]
  - [VMV2R_V, 1.0]
  - [VMV4R_V, 1.0]
  - [VMV8R_V, 1.0]
  - [VMV_V_V, 1.0]
  - [VAESDF_VV, 1.0]
  - [VAESDF_VS, 1.0]
  - [VAESDM_VV, 1.0]
  - [VAESDM_VS, 1.0]
  - [VAESEF_VV, 1.0]
  - [VAESEF_VS, 1.0]
  - [VAESEM_VV, 1.0]
  - [VAESEM_VS, 1.0]
  - [VAESKF1_VI, 1.0]
  - [VAESKF2_VI, 1.0]
  - [VAESZ_VS, 1.0]
  - [VSHA2CH_VV, 1.0]
  - [VSHA2CL_VV, 1.0]
  - [VSHA2MS_VV, 1.0]
  - [VANDN_VV, 1.0]
  - [VANDN_VX, 1.0]
  - [VBREV8_V, 1.0]
  - [VREV8_V, 1.0]
  - [VROL_VV, 1.0]
  - [VROL_VX, 1.0]
  - [VROR_VV, 1.0]
  - [VROR_VX, 1.0]
  - [VROR_VI, 1.0]
  - [VSETVL, 0.1]
