# REQUIRES: riscv-snippy-model-any

# RUN: not llvm-snippy %s \
# RUN:     -initial-regs-yaml=%S/../../initialization/Inputs/initial_state_zero.yaml \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 10
  dump-mf: true
  backtrack: true
  mattr: +m

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x4000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x806000
      SIZE:      0x4000
      LMA:       0x806000
      ACCESS:    rw

histogram:
    - [DIV, 1.0]

# CHECK: Back-tracking events threshold is exceeded
