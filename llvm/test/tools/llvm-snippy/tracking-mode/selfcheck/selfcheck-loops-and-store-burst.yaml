# REQUIRES: riscv-snippy-model-callbacks
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=-c,+m \
# RUN:    -num-instrs=1000 -init-regs-in-elf -selfcheck \
# RUN:    --model-plugin=spike \
# RUN: |& FileCheck %s
burst:
  mode: store
  min-size: 33
  max-size: 33
sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw
    - name:      stack
      VMA:       0x410000
      SIZE:      0x100000
      LMA:       0x410000
      ACCESS:    rw

histogram:
    - [BEQ, 1.0]
    - [SB, 10.0]

branches:
  number-of-loop-iterations:
    min: 1
    max: 2
  max-depth:
    loop: 1

# CHECK: #===Simulation Start===

