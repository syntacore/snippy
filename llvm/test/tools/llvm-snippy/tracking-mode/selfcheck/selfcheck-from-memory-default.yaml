# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw

histogram:
  - [LW, 2.0]
  - [SW, 1.0]
  - [ADD, 1.0]
  - [XOR, 1.0]
  - [AND, 1.0]
  - [SUB, 1.0]

options:
  mtriple: riscv64
  num-instrs: 100
  selfcheck: ""
  selfcheck-ref-value-storage: "memory"
  riscv-disable-misaligned-access: true
