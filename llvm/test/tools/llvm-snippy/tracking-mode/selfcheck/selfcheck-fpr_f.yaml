# REQUIRES: riscv-snippy-model-any
# UNSUPPORTED: riscv-snippy-model-whisper

# RUN: llvm-snippy %s -mattr=+f \
# RUN: |& FileCheck %s

# RUN: llvm-snippy %s -mattr=+zfh -dump-mf -selfcheck-mem \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  num-instrs: 2
  init-regs-in-elf: true
  selfcheck: ""

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x100000
      LMA:       0x310000
      ACCESS:    rw

histogram: 
    - [FADD_S, 1.0]

# CHECK: #===Simulation Start===

# CHECK: fadd.s
# CHECK: [[FPREG:f[0-9]+]] {{(<- )*}}0x{{(FFFFFFFF)*}}[[VALUE:[0-9a-fA-F]+]]

# CHECK: fsw
# CHECK: 0x[[VALUE]]

# CHECK: sw
# CHECK: 0x[[VALUE]]


