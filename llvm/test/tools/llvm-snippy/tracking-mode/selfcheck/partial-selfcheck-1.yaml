# UNSUPPORTED: riscv-snippy-model-None
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=-c \
# RUN:    -num-instrs=1000 -init-regs-in-elf -selfcheck=10 \
# RUN: |& FileCheck %s --dump-input always 
sections:
  - name:      1
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    r
  - name:      2
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      3
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x600000
    SIZE:      0x100000
    LMA:       0x600000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [AND, 1.0]
    - [ANDI, 1.0]
    - [OR, 1.0]
    - [ORI, 1.0]
    - [XOR, 1.0]
    - [XORI, 1.0]

# CHECK-COUNT-200: sd
# CHECK: #===Simulation Start===
# CHECK-COUNT-200: sd

