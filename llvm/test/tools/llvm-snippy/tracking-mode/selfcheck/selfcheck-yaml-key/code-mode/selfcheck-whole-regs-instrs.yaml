# REQUIRES: riscv-snippy-model-any
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s \
# RUN:     %S/../../selfcheck-whole-regs-instrs.yaml \
# RUN:     -initial-regs-yaml=%S/../Inputs/reg-init.yaml -o %t
# RUN: FileCheck %s --input-file=%t.selfcheck.yaml

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10
  init-regs-in-elf: true
  riscv-preference-for-rvv-mode-change: vsetvl
  rvv-init-mode: loads

selfcheck:
  mode: code
  selfcheck-td-options:
    enable-selfcheck-rvv: true

#CHECK-COUNT-80: address
