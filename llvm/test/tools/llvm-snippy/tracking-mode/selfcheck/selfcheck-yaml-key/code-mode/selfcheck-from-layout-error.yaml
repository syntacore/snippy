# RUN: not llvm-snippy %s -model-plugin=NONEXISTENT \
# RUN: |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +m,+c
  num-instrs: 10000
  init-regs-in-elf: true
  verify-mi: true

sections:
    - name:      1
      VMA:       0x500000
      SIZE:      0x100000
      LMA:       0x500000
      ACCESS:    rx
    - name:      2
      VMA:       0x600000
      SIZE:      0x700000
      LMA:       0x600000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0xF00000
      SIZE:      0x100
      LMA:       0xF00000
      ACCESS:    rw

histogram:
    - [DIV, 1.0]
    - [ADD, 1.0]
selfcheck:
  mode: code 

# CHECK: error: Cannot use "selfcheck" section from layout: it does not fit selfcheck data ({{[0-9]+}} bytes)
