# REQUIRES: riscv-snippy-model-any
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s \
# RUN:     %S/../../selfcheck-widening.yaml \
# RUN:     -initial-regs-yaml=%S/../Inputs/reg-init.yaml -o %t
# RUN: FileCheck %s --input-file=%t.selfcheck.yaml -check-prefix=ANNOTATION

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  init-regs-in-elf: true
  riscv-preference-for-rvv-mode-change: vsetvl
  rvv-init-mode: loads
  verify-gen-histogram: true

selfcheck:
  mode: code
  selfcheck-td-options:
    enable-selfcheck-rvv: true

# ANNOTATION-COUNT-2000: address
# ANNOTATION-NOT: address
