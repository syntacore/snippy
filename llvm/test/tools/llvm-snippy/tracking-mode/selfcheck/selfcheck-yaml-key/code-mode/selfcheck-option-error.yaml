# RUN: not llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -c
  dump-mf: true

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram: 
    - [ADD, 1.0]


selfcheck:
  mode: code 
  period: qwerty

# CHECK: error: invalid number 
