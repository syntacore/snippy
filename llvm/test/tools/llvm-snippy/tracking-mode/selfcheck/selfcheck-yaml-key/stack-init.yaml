# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 \
# RUN:    -num-instrs=1000 -init-regs-in-elf \
# RUN:    -honor-target-abi -trace-log %t --redefine-sp=reg::x23
# RUN: FileCheck %s --input-file %t --dump-input fail

sections:
  - name:      0
    VMA:       0x40000f000
    SIZE:           0x1000
    LMA:       0x40000f000
    ACCESS:    r
  - name:      1
    VMA:       0x400010000
    SIZE:          0xf0000
    LMA:       0x400010000
    ACCESS:    rx
  - name:      2
    VMA:       0x400100000
    SIZE:         0x100000
    LMA:       0x400100000
    ACCESS:    rw
  - name:      stack
    VMA:       0x400200000
    SIZE:         0x100000
    LMA:       0x400200000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x400300000
    SIZE:         0x100000
    LMA:       0x400300000
    ACCESS:    rw

access-ranges:
  - start: 0x400100000
    size:     0x100000
    stride: 16
    first-offset: 0
    last-offset: 0

branches:
  loop-ratio: 1
  number-of-loop-iterations:
      min: 2  # 4 by default
      max: 2  # 4 by default

histogram:
  - [BEQ, 1.0]
  - [LB, 1.0]
  - [SW, 1.0]
  - [ADD, 1.0]

selfcheck:
  mode: code 

