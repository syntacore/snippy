# UNSUPPORTED: riscv-snippy-model-None
# UNSUPPORTED: riscv-snippy-model-whisper
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+m \
# RUN:    -num-instrs=2 -init-regs-in-elf \
# RUN: |& FileCheck %s
sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram:
    - [MUL, 1.0]

selfcheck:
  mode: checksum

# CHECK: #===Simulation Start===

# CHECK: mul
# CHECK-NEXT: [[XREG0:x[0-9]+]] {{(<- )*}}0x[[VALUE0:[0-9a-fA-F]+]]

# CHECK: beq

# CHECK: mul
# CHECK-NEXT: [[XREG1:x[0-9]+]] {{(<- )*}}0x[[VALUE1:[0-9a-fA-F]+]]

# CHECK: beq

