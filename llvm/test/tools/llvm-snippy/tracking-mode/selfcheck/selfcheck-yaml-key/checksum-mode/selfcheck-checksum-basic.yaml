# REQUIRES: riscv-snippy-model-any
# UNSUPPORTED: riscv-snippy-model-whisper

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +m
  num-instrs: 2
  init-regs-in-elf: true
  dump-mf: true
# COM: X0, should not be a register that we check
# COM: (simulator can silently process these as no-op instructions)
  reserved-regs-list: ["X0"]

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram:
    - [MUL, 1.0]

selfcheck:
  mode: checksum

# CHECK: #===Simulation Start===

# CHECK: mul
# CHECK-NEXT: [[XREG0:x[0-9]+]] {{(<- )*}}0x[[VALUE0:[0-9a-fA-F]+]]

# CHECK: beq

# CHECK: mul
# CHECK-NEXT: [[XREG1:x[0-9]+]] {{(<- )*}}0x[[VALUE1:[0-9a-fA-F]+]]

# CHECK: beq
