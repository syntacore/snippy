# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 2
  init-regs-in-elf: true
  dump-mf: true

include:
  - "../../../Inputs/sections.yaml"
  - "../../Inputs/selfcheck-checksum-rvv.yaml"

riscv-vector-unit:
  mode-change-bias:
    P: deduced
    Pvill: 1.0
    Pnomask: 0.0
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VSETIVLI, 0.0005]
    - [VL1RE32_V, 1.0]

# COM: The check-sum is computed in the legal support RVV mode. Then the
# COM: illegal one is restored and the mask is loaded, as VMXNOR_MM would trap.

# CHECK: bb.0:
# CHECK: VSETIVLI [[AVL:[0-9]+]], [[VTYPE:[0-9]+]],
# CHECK: [[Def:\$v[0-9]+]] = VL1RE32_V
# CHECK-NEXT: VSETIVLI
# CHECK-NEXT: [[AccVReg:\$v[0-9]+]] = VMV_V_I 0
# CHECK-NEXT: [[AccVReg]] = VREDXOR_VS [[Def]], [[AccVReg]]
# CHECK-NEXT: [[AccXReg:\$x[1-9][0-9]?]] = VMV_X_S [[AccVReg]]
# CHECK-NEXT: VSETIVLI [[AVL]], [[VTYPE]],
# CHECK: $v0 = VL1RE8_V
# CHECK: BEQ {{\$x[0-9]+}}, [[AccXReg]], 8
# CHECK-NEXT: EBREAK
