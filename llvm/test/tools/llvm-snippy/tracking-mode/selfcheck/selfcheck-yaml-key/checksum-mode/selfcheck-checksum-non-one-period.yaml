# REQUIRES: riscv-snippy-model-any

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -c
  num-instrs: 20
  init-regs-in-elf: true
  reserved-regs-list: [X0]

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw

histogram:
    - [SW, 1.0]

selfcheck:
  mode: checksum
  period: 10

# CHECK: #===Simulation Start===

# CHECK-COUNT-2: beq
# CHECK-NOT: beq

