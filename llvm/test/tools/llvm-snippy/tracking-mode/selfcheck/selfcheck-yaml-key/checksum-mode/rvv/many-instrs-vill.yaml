# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv

# COM: The model traps on any vector instruction that is illegal with vill set.

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  init-regs-in-elf: true

include:
  - "../../../Inputs/sections.yaml"
  - "../../Inputs/selfcheck-checksum-rvv.yaml"

riscv-vector-unit:
  mode-change-bias:
    P: deduced
    Pvill: 0.5
  mode-distribution:
    VM:
      - [any_legal, 1.0]
      - [all_ones, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_8: 1.0
        sew_16: 1.0
        sew_32: 1.0
        sew_64: 1.0
      LMUL:
        mf2: 1.0
        m1: 1.0
        m2: 1.0
        m4: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0

histogram:
    - [VSETIVLI, 1.0]
    - [VADD_VV, 1.0]
    - [VMUL_VX, 1.0]
    - [VMSEQ_VV, 1.0]
    - [VREDSUM_VS, 1.0]
    - [VL1RE32_V, 1.0]
    - [VL2RE8_V, 1.0]
    - [VL4RE64_V, 1.0]
    - [VS1R_V, 1.0]
