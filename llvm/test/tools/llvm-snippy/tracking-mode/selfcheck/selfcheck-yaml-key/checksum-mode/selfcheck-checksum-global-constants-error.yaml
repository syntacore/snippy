# RUN: not llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=-c \
# RUN:    -num-instrs=1000 -init-regs-in-elf \
# RUN: |& FileCheck %s
sections:
  - name:      1
    VMA:       0x310000
    SIZE:      0x100000
    LMA:       0x310000
    ACCESS:    r
  - name:      2
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      3
    VMA:       0x500000
    SIZE:      0x100000
    LMA:       0x500000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [SRA, 1.0]
    - [SRAI, 1.0]
    - [SRL, 1.0]
    - [SRLI, 1.0]
    - [SLL, 1.0]
    - [SLLI, 1.0]
    - [AND, 1.0]
    - [ANDI, 1.0]
    - [OR, 1.0]
    - [ORI, 1.0]
    - [XOR, 1.0]
    - [XORI, 1.0]
    - [LW, 1.0]
    - [SW, 1.0]

selfcheck:
  mode: checksum
  selfcheck-gv: true

# CHECK: error: 'selfcheck-gv' doesn't make sense with selfcheck checksum mode enabled
