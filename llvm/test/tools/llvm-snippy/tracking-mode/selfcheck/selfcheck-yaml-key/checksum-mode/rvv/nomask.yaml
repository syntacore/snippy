# UNSUPPORTED: riscv-snippy-model-None
# REQUIRES: riscv-rvv

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 2
  init-regs-in-elf: true
  dump-mf: true

include:
  - "../../../Inputs/sections.yaml"
  - "../../Inputs/selfcheck-checksum-rvv.yaml"

riscv-vector-unit:
  mode-change-bias:
    P: deduced
    Pnomask: 1.0
  mode-distribution:
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
    - [VSETIVLI, 0.0005]
    - [VADD_VV, 1.0]

# COM: V0 holds no mask, so restoring the RVV mode after the check-sum
# COM: doesn't rewrite it.

# CHECK: [[Def:\$v[0-9]+]] = VADD_VV {{\$v[0-9]+}}, {{\$v[0-9]+}}, $noreg
# CHECK-NEXT: VSETIVLI
# CHECK-NEXT: [[AccVReg:\$v[0-9]+]] = VMV_V_I 0
# CHECK-NEXT: [[AccVReg]] = VREDXOR_VS [[Def]], [[AccVReg]]
# CHECK-NEXT: [[AccXReg:\$x[1-9][0-9]?]] = VMV_X_S [[AccVReg]]
# CHECK-NEXT: VSETIVLI
# CHECK-NOT: $v0 =
# CHECK: BEQ {{\$x[0-9]+}}, [[AccXReg]], 8
# CHECK-NEXT: EBREAK
