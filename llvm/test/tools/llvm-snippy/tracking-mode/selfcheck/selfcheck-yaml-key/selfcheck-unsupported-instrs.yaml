sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80000000
    SIZE:      0x10
    LMA:       0x80000000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x80001000
    SIZE:      0x1000
    LMA:       0x80001000
    ACCESS:    rw

histogram:
  - [INSTR, 1.0]

options:
  mattr: "+c,+zifencei"
  num-instrs: 10
  init-regs-in-elf: true
  mtriple: riscv64

selfcheck:
  mode: MODE

