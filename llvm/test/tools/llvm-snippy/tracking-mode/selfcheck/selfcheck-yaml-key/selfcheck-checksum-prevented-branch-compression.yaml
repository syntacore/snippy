sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80000000
    SIZE:      0x10
    LMA:       0x80000000
    ACCESS:    rw

histogram:
  - [SD, 1.0]
  - [LD, 1.0]

options:
  mattr: "+c"
  num-instrs: 1000

selfcheck:
  mode: checksum
  period: PERIOD

# CHECK-NOT: BEQ $x0
