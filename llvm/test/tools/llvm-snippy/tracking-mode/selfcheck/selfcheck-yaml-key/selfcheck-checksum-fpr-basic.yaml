# UNSUPPORTED: riscv-snippy-model-None
# UNSUPPORTED: riscv-snippy-model-whisper
# RUN: llvm-snippy %s \
# RUN:    -mtriple=riscv64 -mattr=+m \
# RUN:    -num-instrs=1 -init-regs-in-elf \
# RUN:    -reserved-regs-list=X0 -mattr=+f   \
# RUN: |& FileCheck %s
sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x210000
      SIZE:      0x100000
      LMA:       0x210000
      ACCESS:    rw
    - name:      selfcheck
      VMA:       0x310000
      SIZE:      0x2000
      LMA:       0x310000
      ACCESS:    rw

histogram:
    - [FMUL_S, 1.0]

selfcheck:
  mode: checksum

# CHECK: #===Simulation Start===

# CHECK: fmv.x.w
# CHECK-NEXT: [[XREG0:x[0-9]+]] {{(<- )*}}0x[[VALUE0:[0-9a-fA-F]+]]

# CHECK-NOT: xor

# CHECK: beq

# CHECK-NOT: fmv.x.w
