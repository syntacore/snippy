# RUN: not llvm-snippy %s |& FileCheck %s

# CHECK: error: selfcheck / backtrack / address-value-hazards execution with both LR/SC is prohibited

options:
  mtriple: riscv64
  init-regs-in-elf: true
  force-emit-linker-script: true
  selfcheck: ""
  selfcheck-gv: true
  mattr: +c,+a,+m

sections:
  - name:      0
    VMA:       0x200000
    SIZE:      0x1000
    LMA:       0x200000
    ACCESS:    r
  - name:      1
    VMA:       0x210000
    SIZE:      0x100000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x80002000
    SIZE:      0x100000
    LMA:       0x80002000
    ACCESS:    rw
  - name:      selfcheck
    VMA:       0x310000
    SIZE:      0x1000000
    LMA:       0x310000
    ACCESS:    rw

histogram:
  - [LR_D, 1]
  - [LR_D_AQ, 1]
  - [LR_W, 1]
  - [LR_W_AQ, 1]
  - [LW, 1]
  - [LWU, 1]
  - [SB, 1]
  - [SC_D, 1]
  - [SC_D_RL, 1]
  - [SC_W, 1]
  - [SC_W_RL, 1]