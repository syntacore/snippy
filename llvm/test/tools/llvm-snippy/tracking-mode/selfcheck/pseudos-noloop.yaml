# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s | FileCheck %s

options:
  mtriple: riscv64
  mattr: +f,+zihintpause
  num-instrs: 2000
  selfcheck: ""
  init-regs-in-elf: on

branches:
  loop-ratio: 0.0

histogram:
  - [ADD, 1.0]
  - [BNE, 1.0]
  - [BEQ, 1.0]
  - [PAUSE, 1.0]
  - [WriteFFLAGSImm, 1.0]
  - [WriteFRMImm, 1.0]
  - [ReadFFLAGS, 1.0]
  - [ReadFRM, 1.0]
  - [SwapFFLAGSImm, 1.0]
  - [SwapFRMImm, 1.0]
sections:
  - name: 1
    VMA: 0x10000
    LMA: 0x10000
    SIZE: 0x10000
    ACCESS: rx
  - name: 2
    VMA: 0x20000
    LMA: 0x20000
    SIZE: 0x1000
    ACCESS: rw
  - name: stack
    VMA: 0x21000
    LMA: 0x21000
    SIZE: 0x2000
    ACCESS: rw
  - name: selfcheck
    VMA: 0x23000
    LMA: 0x23000
    SIZE: 0x30000
    ACCESS: rw
# CHECK: ===Simulation Start===
# CHECK-DAG: pause
# CHECK-DAG: csrwi
# CHECK-DAG: csrrwi
# CHECK-DAG: csrr
