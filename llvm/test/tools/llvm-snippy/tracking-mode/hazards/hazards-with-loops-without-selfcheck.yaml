# REQUIRES: riscv-snippy-model-callbacks

# RUN: llvm-snippy %s \
# RUN: -mtriple=riscv64 -mattr=+m,+c \
# RUN: -num-instrs=1000 -init-regs-in-elf -enable-address-value-hazards

sections:
    - name:      1
      VMA:       0x800000
      SIZE:      0x40000
      LMA:       0x800000
      ACCESS:    rx
    - name:      2
      VMA:       0x860000
      SIZE:      0x40000
      LMA:       0x860000
      ACCESS:    rw
    - name:      stack
      VMA:       0x900000
      SIZE:      0x40000
      LMA:       0x900000
      ACCESS:    rw

histogram:
    - [BEQ, 2.0]
    - [BLT, 2.0]
    - [BGE, 2.0]
    - [BGEU, 2.0]
    - [BLTU, 2.0]
    - [BNE, 2.0]
    - [C_BEQZ, 2.0]
    - [C_BNEZ, 2.0]
    - [ADD, 1.0]
    - [ADDI, 1.0]
    - [SUB, 1.0]
    - [MUL, 1.0]

include:
  - ../../Inputs/branchegram-no-pc-distance.yaml
