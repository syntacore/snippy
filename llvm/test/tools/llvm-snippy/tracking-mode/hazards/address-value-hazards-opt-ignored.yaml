# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s -mtriple=riscv64 \
# RUN:   -enable-address-value-hazards -num-instrs=10 \
# RUN: |& FileCheck %s --dump-input fail

sections:
    - name:      1
      VMA:       0x100000
      SIZE:      0x100000
      LMA:       0x100000
      ACCESS:    rx
    - name:      2
      VMA:       0x800000
      SIZE:      0x400000
      LMA:       0x800000
      ACCESS:    rw

histogram:
    - [LD, 1.0]

