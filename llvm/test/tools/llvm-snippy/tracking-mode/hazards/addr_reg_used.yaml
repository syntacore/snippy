# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: -a
  dump-mf: true
  num-instrs: 1000

sections:
    - name:      1
      VMA:       0x1000
      SIZE:      0x10000
      LMA:       0x1000
      ACCESS:    rx
    - name:      2
      VMA:       0x80000000
      SIZE:      0x400000
      LMA:       0x80000000
      ACCESS:    rw

histogram:
    - [LW, 1.0]

# CHECK-NOT: LW $x0
