access-ranges:
    - start: 0x80002000
      size: 12
      stride: 4
      first-offset: 0
      last-offset: 0
    - start: 0x80002010
      size: 12
      stride: 4
      first-offset: 1
      last-offset: 1
burst:
  mode: BURST_MODE
  min-size: BURST_SIZE
  max-size: BURST_SIZE

