# RUN: not llvm-snippy %s |& FileCheck %s

include:
  - Inputs/default-layout.yaml
options:
  mtriple: riscv64
  num-instrs: 10
access-ranges:
  - start: 0x100000
    size: 0x16
    stride: 0
    first-offset: 0
    last-offset: 0

# CHECK: error: Invalid memory access range: 'last-offset' (0) >= 'stride' (0)
