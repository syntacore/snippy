# COM: This is a regression test for cases with instructions that use the same
# COM: base register and require different alignment (atomics are aligned
# COM: by regular store can be misaligned).

# RUN: llvm-snippy %s

options:
  mtriple: riscv64
  march: rv64iac
  num-instrs: 1000
  riscv-disable-misaligned-access: atomics-only
sections:
  - name: 1
    VMA: 0x100000
    LMA: 0x100000
    SIZE: 0x100000
    ACCESS: rx
  - name: 2
    VMA: 0x200000
    LMA: 0x200000
    SIZE: 0x10000
    ACCESS: rw
access-ranges:
  - start: 0x200000
    size: 0x10000
    stride: 1
    first-offset: 0
    last-offset: 0
histogram:
  - [C_SD, 1.0]
  - [AMOSWAP_W, 1.0]
burst:
  mode: custom
  min-size: 2
  max-size: 2
  groupings:
    - [AMOSWAP_W, C_SD]
