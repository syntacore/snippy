# REQUIRES: riscv-snippy-model-spike
# RUN: llvm-snippy %s |& FileCheck %s
# CHECK-NOT: mem 0x0000000081000000{{.*}}mem 0x0000000081000001{{.*}}mem 0x0000000081000002{{.*}}mem 0x0000000081000000{{.*}}mem 0x0000000081000001{{.*}}mem 0x0000000081000002{{.*}}
options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1000
  init-regs-in-elf: true
  verify-mi: true
  riscv-disallow-intersecting-mem-accesses: VSSSEG3E8_V
sections:
  - name: 1
    VMA: 0x80000000
    SIZE: 0x00400000
    LMA: 0x80000000
    ACCESS: rx
  - name: 2
    VMA: 0x80600000
    SIZE: 0x00400000
    LMA: 0x80600000
    ACCESS: r
  - name: 3
    VMA: 0x81000000
    SIZE: 0x00400000
    LMA: 0x81000000
    ACCESS: rw
access-ranges:
  - start: 0x81000000
    size: 0x6
    stride: 1
    first-offset: 0
    last-offset: 0
riscv-vector-unit:
  mode-change-bias:
    P: 0.2
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [2, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_8: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0
histogram:
  - [VSSSEG3E8_V, 1.0]
