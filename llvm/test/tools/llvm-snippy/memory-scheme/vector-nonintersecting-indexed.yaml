# REQUIRES: asserts
# REQUIRES: riscv-rvv
# RUN: llvm-snippy %s -debug-only=snippy-riscv -model-plugin None |& grep -oP "IndexValue.*: \K.*" | sort | uniq | wc -l | FileCheck %s
# COM: Check that 8 unique indices are generated
# CHECK: 8
options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 1
  riscv-disallow-intersecting-mem-accesses: ".*"
sections:
  - name: 1
    VMA: 0x80000000
    SIZE: 0x00400000
    LMA: 0x80000000
    ACCESS: rx
  - name: 2
    VMA: 0x80600000
    SIZE: 0x00400000
    LMA: 0x80600000
    ACCESS: r
  - name: 3
    VMA: 0x81000000
    SIZE: 0x00400000
    LMA: 0x81000000
    ACCESS: rw
access-ranges:
  - start: 0x81000000
    size: 0x8
    stride: 1
    first-offset: 0
    last-offset: 0
riscv-vector-unit:
  mode-change-bias:
    P: 0.2
  mode-distribution:
    VM:
      - [all_ones, 1.0]
    VL:
      - [8, 1.0]
    VXRM:
      rnu: 1.0
      rne: 1.0
      rdn: 1.0
      ron: 1.0
    VTYPE:
      SEW:
        sew_8: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
        ma: 1.0
      VTA:
        tu: 1.0
        ta: 1.0
histogram:
  - ["VLUXEI8_V", 1.0]
