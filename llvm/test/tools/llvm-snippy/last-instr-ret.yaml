# REQUIRES: riscv-snippy-model-None
# RUN: llvm-snippy %s -mtriple=riscv64 \
# RUN:    -dump-mi -num-instrs=2000 -last-instr=RET \
# RUN:    | FileCheck %s --dump-input always

sections:
  - name:      1
    VMA:       0x210000
    SIZE:      0x2000
    LMA:       0x210000
    ACCESS:    rx
  - name:      2
    VMA:       0x100000
    SIZE:      0x100000
    LMA:       0x100000
    ACCESS:    rw

histogram:
    - [ADD, 1.0]
    - [ADDI, 1.0]

# CHECK: PseudoJALRRet
# CHECK-NOT: Generated MI_
