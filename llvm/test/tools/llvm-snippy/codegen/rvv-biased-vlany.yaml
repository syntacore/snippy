# REQUIRES: riscv-snippy-model-spike

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v --num-instrs=10000 -o %t \
# RUN:  |& FileCheck %s

include:
- Inputs/rvv-lmul1-sew32-vlany.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
    - [VADD_VV, 1.0]

# CHECK-DAG: vsetivli zero, 1, e32, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
# CHECK-DAG: vsetivli zero, 2, e32, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
# CHECK-DAG: vsetivli zero, 3, e32, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
# CHECK-DAG: vsetivli zero, 4, e32, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
