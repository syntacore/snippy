# REQUIRES: riscv-rvv
# COM: This test verifies that after installing
# COM: the illegal rvv configuration in vtype,
# COM: only legal instructions are generated (from RISCV-V spec 1.0 :
# COM: vset{i}vl{i} and whole-register loads, stores, and moves). 
# COM: It fail because spike thinks that some of the instructions are illegal
# XFAIL: *

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --model-plugin=spike --num-instrs=1000 -o %t \
# RUN:  |& FileCheck %s --check-prefix=CHECK-ILLEGAL

# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --model-plugin=spike --num-instrs=10000 -o %t \
# RUN:  |& FileCheck %s --check-prefix=CHECK-LEGAL

include:
- "../rvv-config-biased/Inputs/rvv-unit-pvill-1.yaml"

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

# COM: Illegal when vill install
    - [VAADDU_VV, 1.0]
    - [VAADD_VX, 1.0]
    - [VADC_VIM, 1.0]
    - [VADD_VI, 1.0]
    - [VAND_VX, 1.0]
    - [VASUBU_VX, 1.0]
    - [VASUB_VX, 1.0]
    - [VIOTA_M, 1.0]
    - [VXOR_VX, 1.0]
    - [VZEXT_VF4, 1.0]

# COM: Legal when vill install
    - [VL1RE16_V, 1.0]
    - [VL1RE32_V, 1.0]
    - [VL1RE64_V, 1.0]
    - [VL1RE8_V, 1.0]
    - [VL2RE16_V, 1.0]
    - [VL2RE32_V, 1.0]
    - [VL2RE64_V, 1.0]
    - [VL2RE8_V, 1.0]
    - [VL4RE16_V, 1.0]
    - [VL4RE32_V, 1.0]
    - [VL4RE64_V, 1.0]
    - [VL4RE8_V, 1.0]
    - [VL8RE16_V, 1.0]
    - [VL8RE32_V, 1.0]
    - [VL8RE64_V, 1.0]
    - [VL8RE8_V, 1.0]
    - [VS1R_V, 1.0]
    - [VS2R_V, 1.0]
    - [VS4R_V, 1.0]
    - [VS8R_V, 1.0]

# COM: This opcodes also must be legal when vill install
# COM: but spike say : "exception trap_illegal_instruction"
    - [VMV1R_V, 1.0]
    - [VMV2R_V, 1.0]
    - [VMV4R_V, 1.0]
    - [VMV8R_V, 1.0]


# CHECK-ILLEGAL-NOT: vaaddu.vv
# CHECK-ILLEGAL-NOT: vaadd.vx
# CHECK-ILLEGAL-NOT: vadc.vim
# CHECK-ILLEGAL-NOT: vand.vx
# CHECK-ILLEGAL-NOT: vasubu.vx
# CHECK-ILLEGAL-NOT: vasub.vx
# CHECK-ILLEGAL-NOT: viota.m
# CHECK-ILLEGAL-NOT: vxor.vx
# CHECK-ILLEGAL-NOT: vzext.vf4

# CHECK-LEGAL: vl1re8.v
# CHECK-LEGAL: vl1re16.v
# CHECK-LEGAL: vl1re32.v
# CHECK-LEGAL: vl1re64.v
# CHECK-LEGAL: vl2re8.v
# CHECK-LEGAL: vl2re16.v
# CHECK-LEGAL: vl2re32.v
# CHECK-LEGAL: vl2re64.v
# CHECK-LEGAL: vl4re8.v
# CHECK-LEGAL: vl4re16.v
# CHECK-LEGAL: vl4re32.v
# CHECK-LEGAL: vl4re64.v
# CHECK-LEGAL: vl8re8.v
# CHECK-LEGAL: vl8re16.v
# CHECK-LEGAL: vl8re32.v
# CHECK-LEGAL: vl8re64.v
# CHECK-LEGAL: vs1r.v
# CHECK-LEGAL: vs2r.v
# CHECK-LEGAL: vs4r.v
# CHECK-LEGAL: vs8r.v
# CHECK-LEGAL: vmv1r.v
# CHECK-LEGAL: vmv2r.v
# CHECK-LEGAL: vmv4r.v
# CHECK-LEGAL: vmv8r.v
