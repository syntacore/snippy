# REQUIRES: riscv-rvv
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  -o %t --num-instrs=100000 \
# RUN:  --init-regs-in-elf --verify-mi \
# RUN:  --entry-point=start \
# RUN:  -verify-gen-histogram -histogram-max-deviation=5 -histogram-must-succeed=true \
# RUN:  -rvv-init-mode=loads \
# RUN:  -histogram-must-succeed=false \
# RUN:  |& FileCheck %s

include:
- "../../Inputs/memory-unaligned.yaml"
- "../Inputs/rvv-unit-all.yaml"

sections:
  - name:      0
    VMA:       0x2000000
    SIZE:      0x1000000
    LMA:       0x2000000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VADC_VIM, 1.0]
    - [VADD_VI, 1.0]
    - [VAND_VI, 1.0]
    - [VMADC_VI, 1.0]
    - [VMADC_VIM, 1.0]
    - [VMERGE_VIM, 1.0]
    - [VMSEQ_VI, 1.0]
    - [VMSGTU_VI, 1.0]
    - [VMSGT_VI, 1.0]
    - [VMSLEU_VI, 1.0]
    - [VMSLE_VI, 1.0]
    - [VMSNE_VI, 1.0]
    - [VOR_VI, 1.0]
    - [VRGATHER_VI, 1.0]
    - [VRSUB_VI, 1.0]
    - [VSADDU_VI, 1.0]
    - [VSADD_VI, 1.0]
    - [VSLIDEDOWN_VI, 1.0]
    - [VSLIDEUP_VI, 1.0]
    - [VSLL_VI, 1.0]
    - [VSRA_VI, 1.0]
    - [VSRL_VI, 1.0]
    - [VSSRA_VI, 1.0]
    - [VSSRL_VI, 1.0]
    - [VXOR_VI, 1.0]
# CHECK-NOT: Machine Verifier Pass report
# CHECK: Start Verification for function: start:
# CHECK: End Verification for function: start

