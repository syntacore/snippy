# REQUIRES: riscv-rvv
# RUN: not llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  -o %t --num-instrs=100000 \
# RUN:  --init-regs-in-elf --verify-mi \
# RUN:  --entry-point=start \
# RUN:  -verify-gen-histogram -histogram-max-deviation=5 -histogram-must-succeed=true \
# RUN:  -rvv-init-mode=loads \
# RUN:  --riscv-nomask-mode-for-rvv=true \
# RUN:  |& FileCheck %s

include:
- "../../Inputs/memory-unaligned.yaml"
- "../Inputs/rvv-unit-float-available.yaml"

sections:
  - name:      0
    VMA:       0x2000000
    SIZE:      0x1000000
    LMA:       0x2000000
    ACCESS:    r
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VMSBC_VVM, 1.0]
# CHECK: In histogram given a vector opcode with explicit V0 mask usage, but snippy was given option that forbids any masks for vector instructions
