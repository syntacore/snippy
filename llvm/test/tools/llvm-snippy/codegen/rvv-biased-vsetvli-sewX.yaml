# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike

# COM: this test requires spike model because we match execution log
# COM: the test checks for bias-based RVV mode switches

# RUN: llvm-snippy %s |& FileCheck %s

options:
  mtriple: riscv64
  mattr: +v
  num-instrs: 10000

include:
- Inputs/rvv-lmul1-sewX.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw

histogram:
    - [VADD_VV, 1.0]

# COM: Looking for sequences like:
# COM:    vsetvli zero, a5, e64, m1, tu, mu
# COM:      ......
# COM:    vmxnor.mm v0, v0, v0
# COM:      ......
# COM:    vadd.vv

# CHECK-DAG: vsetvli zero, {{[a-z0-9]+}}, e64, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
# CHECK-DAG: vsetvli zero, {{[a-z0-9]+}}, e32, m1, tu, mu{{[[:space:]].+[[:space:]].+}}vmxnor.mm v0, v0, v0{{[[:space:]].+[[:space:]].+}}vadd.vv
