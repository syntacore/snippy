# RUN: llvm-snippy %s -model-plugin=None |& FileCheck %s

options:
  mtriple: riscv64
  march: rv64imfdv
  num-instrs: 1000
  dump-mf: on
  reserved-regs-list: ["V([0-9]|1[0-9]|2[0-9])"]

include:
  - Inputs/sections.yaml

riscv-vector-unit:
  mode-distribution:
    VM:
      - [any_legal, 1.0]
    VL:
      - [any_legal, 1.0]
    VXRM:
      rnu: 1.0
    VTYPE:
      SEW:
        sew_32: 1.0
      LMUL:
        m1: 1.0
      VMA:
        mu: 1.0
      VTA:
        tu: 1.0

histogram:
  - [VNSRL_WI, 1.0] # dest EEW (32) < src EEW (64)
  - [VSETIVLI, 1.0]

# COM: Check destination vector register group overlap with source vector
#      register group when:
#
#      The destination EEW (=32, EMUL = 1) is smaller than the source EEW (=64).
# CHECK: $v30 = VNSRL_WI $v30
# CHECK-NOT: $v31 = VNSRL_WI $v30
