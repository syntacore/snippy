# REQUIRES: riscv-snippy-model-None
# RUN: not llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --num-instrs=10000 -o %t \
# RUN:  |& FileCheck %s

include:
- Inputs/rvv-lmul1-sew32-vlany.yaml

sections:
  - name:      0
    VMA:       0x10000
    SIZE:      0x10000
    LMA:       0x10000
    ACCESS:    r
  - name:      1
    VMA:       0x40000
    SIZE:      0x40000
    LMA:       0x40000
    ACCESS:    rx
  - name:      2
    VMA:       0x800000
    SIZE:      0x400000
    LMA:       0x800000
    ACCESS:    rw

histogram:
    - [VSEXT_VF8, 1.0]

# CHECK: error: Incorrect RVV setup: there are none opcodes available for all RVV modes

