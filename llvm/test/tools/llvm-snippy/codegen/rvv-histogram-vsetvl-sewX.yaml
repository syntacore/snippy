# REQUIRES: riscv-rvv
# REQUIRES: riscv-snippy-model-spike

# COM: this test requires spike model because we match execution log
# COM: the test checks for bias-based RVV mode switches
# RUN: llvm-snippy %s -mtriple=riscv64 -mattr=+v \
# RUN:  --num-instrs=100000 -o %t \
# RUN:  -verify-gen-histogram  -histogram-must-succeed=true \
# RUN:  |& FileCheck %s

include:
- Inputs/rvv-lmul1-sewX-nobias.yaml

sections:
  - name:      1
    VMA:       0x80000000
    SIZE:      0x400000
    LMA:       0x80000000
    ACCESS:    rx
  - name:      2
    VMA:       0x80600000
    SIZE:      0x400000
    LMA:       0x80600000
    ACCESS:    rw
histogram:

    - [VADD_VV, 1.0]
    - [VSETIVLI, 1.0]
    - [VSETVL, 1.0]
    - [VSETVLI, 1.0]

# CHECK:      vsetvl zero, {{[^ ]+}}, {{[^ ]+}}
# CHECK:      vsetvl a5, {{[^ ]+}}, {{[^ ]+}}
# CHECK:      vsetvl s2, {{[^ ]+}}, {{[^ ]+}}
# CHECK:      vsetvl t6, {{[^ ]+}}, {{[^ ]+}}
# CHECK:      vsetvl {{[^ ]+}}, ra, {{[^ ]+}}
# CHECK:      vsetvl {{[^ ]+}}, a5, {{[^ ]+}}
# CHECK:      vsetvl {{[^ ]+}}, s2, {{[^ ]+}}
# CHECK:      vsetvl {{[^ ]+}}, t6, {{[^ ]+}}
# CHECK:      vsetvl {{[^ ]+}}, {{[^ ]+}}, ra
# CHECK:      vsetvl {{[^ ]+}}, {{[^ ]+}}, a5
# CHECK:      vsetvl {{[^ ]+}}, {{[^ ]+}}, s2
# CHECK:      vsetvl {{[^ ]+}}, {{[^ ]+}}, t6

# CHECK: vadd
# CHECK: vsetvli
# CHECK: vadd
# CHECK: vsetivli


